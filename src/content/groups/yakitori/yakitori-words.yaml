- id: omakase
  ja: おまかせ
  kana: おまかせ
  romaji: omakase
  mean:
    ja: "店に任せること"
    zh: "交给店家安排"
    en: "Chef's choice"
  part:
    ja: "料理の内容（どの串を、どの順で出すか）を店に一任する注文の仕方。漢字では「お任せ」"
    zh: "把菜品内容（上哪些串、按什么顺序）全权交给店家决定的点法，汉字写作“お任せ”"
    en: "Leaving the selection – which skewers, in what order – to the shop; written お任せ in kanji"
  note:
    ja: "「任せる」に丁寧の接頭語「お（御）」が付いた語で、辞書は特に「料理屋で料理の内容を店に一任すること」とし、「お任せコース」を用例に挙げる。京橋の伊勢廣は夜はコースのみで、焼鳥9本にスープなどが付く12品の「フルコース」は、鶏1羽のすべての部位を味わえるよう創業者夫妻が考案したという。池尻大橋の「鳥とみ」のように、焼き鳥と水炊きのコースだけを出す店もある。"
    zh: "由“任せる”（托付）加上敬语前缀“お”构成；词典特别解释为“在饭馆把菜品内容全权交给店家”，并以“お任せコース”（主厨套餐）为例。东京京桥的老店伊势广晚上只提供套餐，其12道的“全套”（9串烤鸡加汤等）据说是创始人夫妇为让客人尝遍一只鸡的所有部位而设计的。也有店像池尻大桥的“鸟とみ”那样只供应烤鸡串加水炊锅的套餐。"
    en: "From makaseru, “to entrust”, with the polite prefix o-; dictionaries note its special use for leaving the menu to a restaurant and cite omakase kōsu (“chef's-choice course”). At Ise-hiro in Kyōbashi dinner is course-only, and its 12-item full course – nine skewers plus soup and sides – was devised by the founding couple so diners could taste every part of one bird. Some shops, such as Toritomi in Ikejiri-Ōhashi, serve nothing but a set course of yakitori and mizutaki."
  sources:
  - { title: "コトバンク「御任せ」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E5%BE%A1%E4%BB%BB%E3%81%9B-454386" }
