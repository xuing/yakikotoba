order: 2
ja: 用語
zh: 菜单用语
en: Menu words
# Group note sources:
# - コトバンク「焼き鳥」（日本大百科全書）https://kotobank.jp/word/%E7%84%BC%E3%81%8D%E9%B3%A5-898078 （明治・大正のころまでは小鳥を丸焼き）
# - コトバンク「焼鳥」（精選版 日本国語大辞典：季語・冬）https://kotobank.jp/word/%E7%84%BC%E9%B3%A5-647701
# - ミシュランガイド日本「焼鳥」https://guide.michelin.com/jp/ja/article/features/Yakitori_JP （明治半ばの屋台、牛・豚の臓物も総称して「やきとり」）
# - サライ「『焼き鳥』と『やきとり』は違う食べ物？」https://serai.jp/gourmet/1020196 （書き分け、豚を「やきとり」と呼ぶ地域）
note:
  ja: "「焼き鳥」は明治・大正のころまで、ツグミやスズメなどの小鳥を丸ごと直火で焼いたものを指した。明治半ばに鶏の端肉や内臓を串に刺してタレで焼く屋台が生まれ、牛や豚の臓物の串もまとめて「やきとり」と呼んだため、今も豚の串焼きを「やきとり」と呼ぶ地域があり、漢字の「焼き鳥」は鶏、ひらがなの「やきとり」は鶏に限らないと書き分ける専門家もいる。俳句では冬の季語。"
  zh: "直到明治、大正年间，“焼き鳥”还是指把斑鸫、麻雀等小鸟整只用明火烤。明治中期出现了把鸡的边角肉和内脏串起来刷酱烤的路边摊，牛、猪内脏串也统称“やきとり”，所以至今仍有地方把烤猪肉串叫“やきとり”；也有专家区分写法：汉字“焼き鳥”专指鸡，平假名“やきとり”则不限于鸡。在俳句中它是冬季的季语。"
  en: "Until the Meiji and Taishō eras, yakitori meant small birds such as thrushes and sparrows grilled whole over an open flame. In the mid-Meiji period street stalls began skewering chicken trimmings and offal and grilling them with tare, and beef and pork offal skewers went by the same name – so some regions still call pork skewers yakitori, and some experts write 焼き鳥 for chicken but やきとり for skewers of any meat. In haiku it is a winter season word."
items:
- id: shio
  ja: 塩
  ruby: '{塩|しお}'
  kana: しお
  romaji: shio
  mean:
    ja: "塩味（塩焼き）"
    zh: "盐味（盐烤）"
    en: "Salt (salt-grilled)"
  part:
    ja: "タレを使わず、串に塩を振って焼く味付け。焼き鳥の味付けは基本的に「塩」か「タレ」"
    zh: "不刷酱汁、只撒盐烤的调味方式；烤鸡串的调味基本是“盐”或“酱汁”二选一"
    en: "Seasoning with salt alone instead of tare; yakitori is basically ordered either shio or tare"
  note:
    ja: "辞書は焼き鳥を、串に刺して素焼きにしてから「たれ、塩などをつけて焼いたもの」と定義し、材料に塩を振りかけることを「振り塩」（あて塩）という。どの部位を塩にするかは店が決め、鳥貴族はぼんじり（三角）・砂肝・ささみ・せせり・やげんなんこつを塩焼きのみ、レバー（きも）はタレのみで出し、手羽先・つくね・皮・ハツは両方から選べる。京橋の伊勢廣のコースでも、ささみ（わさび添え）・砂肝・皮身・手羽は塩、レバーやもも肉はタレで焼く。"
    zh: "词典把烤鸡串定义为串好后先素烤、再“蘸酱汁或盐等烤制的食物”，往食材上撒盐叫“振り塩”（又称“あて塩”）。哪些部位用盐由店家决定：鸟贵族的鸡屁股（三角）、鸡胗、鸡里脊、鸡颈肉、药研软骨只做盐烤，鸡肝（きも）只做酱汁烤，鸡翅、鸡肉丸、鸡皮、鸡心两种可选。京桥伊势广的套餐里，鸡里脊（配山葵）、鸡胗、皮身、鸡翅用盐，鸡肝和腿肉则刷酱汁。"
    en: "Dictionaries define yakitori as skewers grilled plain and then “with tare, salt and so on”; sprinkling salt over food is called furi-jio (also ate-jio). Each shop decides which cuts get salt: Torikizoku serves bonjiri (sankaku), gizzard, sasami, seseri and yagen cartilage salt-only and liver (kimo) tare-only, and lets you choose for wings, tsukune, skin and heart. Ise-hiro's course in Kyōbashi likewise salt-grills sasami (with wasabi), gizzard, 皮身 (skin with neck meat) and wings, and uses tare for liver and thigh."
  sources:
  - { title: "コトバンク「焼鳥」（精選版 日本国語大辞典・デジタル大辞泉）", url: "https://kotobank.jp/word/%E7%84%BC%E9%B3%A5-647701" }
  - { title: "コトバンク「振り塩」（和・洋・中・エスニック 世界の料理がわかる辞典）", url: "https://kotobank.jp/word/%E6%8C%AF%E3%82%8A%E5%A1%A9-1496094" }
  - { title: "鳥貴族 メニュー「焼鳥」", url: "https://torikizoku.co.jp/menu/yakitori/" }
  - { title: "京橋伊勢廣 本店（コース内容）", url: "https://www.isehiro.co.jp/honten/" }
  - { title: "サライ「東京の老舗や名店で味わう、奥深き『焼き鳥』の世界」2025年", url: "https://serai.jp/gourmet/1225015" }
- id: tare
  ja: タレ
  kana: たれ
  romaji: tare
  mean:
    ja: "焼き鳥のたれ"
    zh: "烤鸡串酱汁"
    en: "Tare (basting sauce)"
  part:
    ja: "醤油と味醂などを合わせて煮詰めた甘辛い調味液。素焼きにした串に付けて焼く"
    zh: "酱油和味醂等调合熬制的甜咸调味汁，刷在素烤过的串上再烤"
    en: "A sweet-savoury sauce of soy sauce, mirin and the like, cooked down and brushed on skewers after a plain first grilling"
  note:
    ja: "「たれ」は、もとは味噌の垂れ汁（たれじる）から始まった語で、漢字では「垂れ」と書く。焼き鳥のたれは醤油と味醂を同割（1対1）にしたものが基本で、白焼きにした後、たれを繰り返し付けながら焼く（付け焼き）。京橋の伊勢廣は戦後の再開以来、醤油と味醂だけのタレを、減った分だけ少しずつ補う「仕継ぎ」で受け継いでいる。寿司で使う煮詰めたたれを「つめ」と呼ぶのも同じ系統の調味液である。"
    zh: "“たれ”一词源自味噌滴出的汁（垂汁），汉字写作“垂れ”。烤鸡串酱汁以酱油和味醂各半（1:1）为基础，先素烤，再反复蘸酱烤（付け焼き）。东京京桥的老店伊势广自战后重新开业以来，一直沿用只用酱油和味醂的酱汁，用掉多少就一点点补多少，称为“仕継ぎ”。寿司上用的熬浓酱汁叫“つめ”（煮詰め），也属同一类调味汁。"
    en: "The word began with the juice that drips from miso (tarejiru) and is written 垂れ, “dripping”. Yakitori tare is basically equal parts soy sauce and mirin; skewers are first grilled plain, then basted and grilled repeatedly (tsuke-yaki). Ise-hiro in Kyōbashi has kept its soy-and-mirin-only tare going since reopening after the war, topping it up only by what is used (shitsugi). The reduced sauce brushed on sushi, tsume, belongs to the same family of seasoning."
  sources:
  - { title: "コトバンク「たれ」（日本大百科全書）", url: "https://kotobank.jp/word/%E3%81%9F%E3%82%8C-563411" }
  - { title: "コトバンク「垂れ」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E5%9E%82%E3%82%8C-519814" }
