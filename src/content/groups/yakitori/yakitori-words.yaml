  - { title: "サライ「もてなしの本質を求め100年。完成させた鶏と炭火の芸術｜京橋 伊勢廣 本店」2023年", url: "https://serai.jp/gourmet/1147567" }
- id: hon
  ja: 本
  ruby: '{本|ほん}'
  kana: ほん
  romaji: hon
  mean:
    ja: "串を数える助数詞"
    zh: "串（数串的量词）"
    en: "Counter for skewers"
  part:
    ja: "長い物・細長い棒状の物を数える助数詞。焼き鳥は串1本ずつ数える"
    zh: "数长条形物品的量词；烤鸡串按串数计"
    en: "The counter for long, thin objects; yakitori is counted skewer by skewer"
  note:
    ja: "前の数によって「ほん・ぼん・ぽん」と音が変わり、1本いっぽん、2本にほん、3本さんぼん、4本よんほん、5本ごほん、6本ろっぽん、7本ななほん、8本はっぽん、9本きゅうほん、10本じっぽん。常用漢字表は「十」のこの読みを「ジッ」とし、「ジュッ」も認めている（じゅっぽん）。1皿の本数は店によって異なり、鳥貴族の焼鳥は各2本、京橋の伊勢廣は焼鳥7本の「7本コース」や持ち帰りの「10本入り」を設けている。"
    zh: "读音随前面的数字变成“ほん／ぼん／ぽん”：1本いっぽん、2本にほん、3本さんぼん、4本よんほん、5本ごほん、6本ろっぽん、7本ななほん、8本はっぽん、9本きゅうほん、10本じっぽん。《常用汉字表》把“十”在这里的读音定为“ジッ”，同时认可“ジュッ”（じゅっぽん）。每份几串因店而异：鸟贵族的烤鸡串每份2串，京桥伊势广有7串的“7本套餐”和外带“10串装”。"
    en: "The sound shifts with the number: ippon, nihon, sanbon, yonhon, gohon, roppon, nanahon, happon, kyūhon, jippon (1–10). The official Jōyō kanji table lists ジッ for 十 here (jippon) and accepts ジュッ as an alternative (juppon). How many come per order varies: every yakitori item at Torikizoku is two skewers, while Ise-hiro in Kyōbashi offers a seven-skewer course and a ten-skewer takeaway box."
  sources:
  - { title: "コトバンク「本」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E6%9C%AC-631932" }
  - { title: "東京都教育委員会「日本語初期指導 第27単元（買い物・乗り物）」", url: "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/1_31_2" }
  - { title: "文化庁「常用漢字表」（平成22年内閣告示第2号）", url: "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf" }
  - { title: "鳥貴族 メニュー（2026年10月版PDF）", url: "https://torikizoku.co.jp/assets/uploads/2026/10/menu_jp.pdf" }
  - { title: "京橋伊勢廣 本店（コース内容）", url: "https://www.isehiro.co.jp/honten/" }
  - { title: "京橋伊勢廣 テイクアウト", url: "https://www.isehiro.co.jp/takeout/" }
- id: kushi
  ja: 串
  ruby: '{串|くし}'
  kana: くし
  romaji: kushi
  mean:
    ja: "串"
    zh: "签子；串"
    en: "Skewer"
  part:
    ja: "食材を刺し通して焼いたり干したりする、先のとがった竹や鉄の細い棒。串に刺して焼く料理は「串焼き」"
    zh: "用来穿起食材烤制或晾干的尖头竹签或铁签；串起来烤的菜叫“串焼き”（烤串）"
    en: "A pointed bamboo or metal stick for threading food to grill or dry; food grilled on one is kushiyaki"
  note:
    ja: "「櫛（くし）」と同語源とされ、漢字「串」は物を串刺しにした形の象形文字。古くは「焼串（やいぐし）」と呼ばれて竹製がほとんどで、室町時代の『四条流庖丁書』（1489年）は大焼串を長さ1尺2寸（約36cm）、小焼串を1尺（約30cm）と定めている。串に刺すことを「串を打つ」「串打ち」といい、職人の世界では「串打ち三年、焼き一生」と言われる。京橋の伊勢廣は毎朝届く丸鶏を捌き、部位ごとに串を打つ。"
    zh: "据说与“櫛”（梳子）同源；汉字“串”是把东西穿在一起的象形字。古称“焼串”（やいぐし），几乎都是竹制，室町时代的《四条流庖丁书》（1489年）规定大烤签长1尺2寸（约36厘米）、小烤签长1尺（约30厘米）。穿串叫“串を打つ”（串打ち），行内有“穿串三年，烤一辈子”（串打ち三年、焼き一生）的说法。京桥伊势广每天早上把送来的整鸡分割，再按部位穿串。"
    en: "The word is thought to share its origin with kushi “comb”, and the kanji 串 is a pictograph of things threaded on a stick. Anciently called yaigushi (“grilling skewer”) and almost always bamboo, skewers were given set sizes in the Muromachi-period cookery text Shijō-ryū Hōchōgaki (1489): 1 shaku 2 sun (about 36 cm) for a large one, 1 shaku (about 30 cm) for a small one. Threading is kushi-uchi, and the trade saying goes “three years to skewer, a lifetime to grill” (kushi-uchi sannen, yaki isshō). Ise-hiro in Kyōbashi butchers whole birds delivered every morning and skewers them part by part."
  sources:
  - { title: "コトバンク「串」（デジタル大辞泉・字通・世界大百科事典・日本大百科全書）", url: "https://kotobank.jp/word/%E4%B8%B2-483230" }
  - { title: "コトバンク「焼串」（精選版 日本国語大辞典）", url: "https://kotobank.jp/word/%E7%84%BC%E4%B8%B2-647666" }
  - { title: "コトバンク「串打ち」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E4%B8%B2%E6%89%93%E3%81%A1-483258" }
  - { title: "コトバンク「串焼き」（和・洋・中・エスニック 世界の料理がわかる辞典）", url: "https://kotobank.jp/word/%E4%B8%B2%E7%84%BC%E3%81%8D-1494712" }
