- id: yakiton
  ja: 焼きとん
  ruby: '{焼|や}きとん'
  kana: やきとん
  romaji: yakiton
  mean:
    ja: "豚の串焼き"
    zh: "烤猪肉串（猪杂串）"
    en: "Pork skewers"
  part:
    ja: "豚の肉や内臓（もつ）を串に刺して焼いたもの。「とん」は「豚」の音読み"
    zh: "把猪肉或猪内脏（もつ）串起来烤的食物；“とん”是“豚”（猪）的音读"
    en: "Pork meat or offal (motsu) grilled on skewers; ton is the Sino-Japanese reading of 豚, “pig”"
  note:
    ja: "「もつ焼き」とも呼ばれ、「もつ」は「臓物」の略で、七味唐辛子を薬味にする。内臓は肝臓をレバー、心臓をハツ、大腸をシロ、腎臓をマメなどと呼び、頭の肉「カシラ」のうち目の横の「コメカミ」も焼き鳥店で串に出されることが多い。明治半ばの屋台は鶏の端肉と並んで牛・豚の臓物も焼き、まとめて「やきとり」と呼んだため、今も豚の串を「やきとり」と呼ぶ地域があり、埼玉県東松山は豚のカシラ肉をピリ辛の味噌だれで、北海道室蘭は豚ロース肉の間に玉ねぎを挟んで出す。"
    zh: "也叫“もつ焼き”（烤内脏串），“もつ”是“臓物”（内脏）的略称，佐料用七味辣椒粉。内脏各有叫法：肝叫“レバー”，心叫“ハツ”，大肠叫“シロ”，肾叫“マメ”；猪头肉“カシラ”中眼睛旁边的“コメカミ”（太阳穴肉）也常在烤串店里做成串。明治中期的路边摊除了鸡的边角肉也烤牛、猪内脏，统称“やきとり”，所以至今仍有地方把猪肉串叫“やきとり”：埼玉县东松山用猪头肉配微辣味噌酱，北海道室兰则在猪里脊肉之间夹洋葱。"
    en: "Also called motsu-yaki – motsu is short for zōmotsu, “innards” – and seasoned with shichimi chili pepper. Offal cuts have their own names: liver is rebā, heart hatsu, large intestine shiro, kidney mame; from the head meat (kashira), the komekami beside the eye is often skewered at yakitori shops. Mid-Meiji street stalls grilled beef and pork offal alongside chicken scraps under the single name yakitori, so some towns still call pork skewers yakitori: Higashimatsuyama in Saitama serves pork head meat with spicy miso, and Muroran in Hokkaidō sandwiches onion between pieces of pork loin."
  sources:
