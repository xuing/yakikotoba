  - { title: "京橋伊勢廣「伊勢廣について」（東京都公式広報サイト TOKYO UPDATES より）", url: "https://www.isehiro.co.jp/history/" }
  - { title: "サライ「東京の老舗や名店で味わう、奥深き『焼き鳥』の世界」2025年", url: "https://serai.jp/gourmet/1225015" }
- id: moriawase
  ja: 盛り合わせ
  ruby: '{盛|も}り{合|あ}わせ'
  kana: もりあわせ
  romaji: moriawase
  mean:
    ja: "数種を一皿に盛ったもの"
    zh: "拼盘"
    en: "Assortment (mixed plate)"
  part:
    ja: "一つの器に異なるものをいくつか取り合わせて盛ったもの。焼き鳥では数種類の串を一皿にまとめた品"
    zh: "把几种不同的东西搭配盛在一个容器里；烤鸡串里指把几种串装成一盘"
    en: "Several different items arranged together in one dish; for yakitori, a plate of mixed skewers"
  note:
    ja: "「盛る」（器に入れて満たす・積み上げる）と「合わせる」から成る語で、辞書の見出しは【盛（り）合（わ）せ】、つまり送り仮名を省いた「盛合せ」「盛り合せ」も通用する表記。辞書の用例は「刺身を三人前盛り合わせにする」。器に盛るのが盛り合わせで、箱や籠に2種類以上を詰めたものは「詰め合わせ」と呼び分ける。"
    zh: "由“盛る”（盛入容器、堆起）和“合わせる”（搭配）构成；词典词头写作【盛（り）合（わ）せ】，即省略送假名的“盛合せ”“盛り合せ”等写法也通行。词典例句是“把生鱼片做成三人份的拼盘”（刺身を三人前盛り合わせにする）。盛在器皿里的叫“盛り合わせ”，把两种以上的东西装进盒子或篮子里的则叫“詰め合わせ”（什锦装）。"
    en: "Formed from moru (“to heap into a dish”) and awaseru (“to put together”); dictionaries head it 盛(り)合(わ)せ, so spellings that drop the optional kana, such as 盛合せ or 盛り合せ, are also standard. The dictionary example is “to make sashimi for three into a moriawase”. Arranged in a dish it is moriawase; two or more kinds packed together in a box or basket are tsumeawase."
  sources:
  - { title: "コトバンク「盛合せ」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E7%9B%9B%E5%90%88%E3%81%9B-646829" }
