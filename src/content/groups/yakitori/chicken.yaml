- id: hatsu
  ja: ハツ
  kana: はつ
  romaji: hatsu
  mean:
    ja: "鶏の心臓"
    zh: "鸡心"
    en: "Chicken heart"
  part:
    ja: "心臓。規格では肝臓と合わせて「きも」とし、心臓だけを売るときは「心臓」「ハート」「ハツ」と表示する"
    zh: "心脏。规格上与肝脏合称“きも”，单独出售心脏时标作“心脏”“ハート”或“ハツ”"
    en: "The heart. The standards group heart and liver together as kimo; heart sold on its own is labelled shinzō, hāto or hatsu"
  note:
    ja: "「ハツ」は英語 heart から来た語で、品書きでは鳥貴族のように「ハート（ハツ）」と書く店もある。周りの脂肪や血管を取り除き血抜きするとクセのない味になり、規格にも血抜きして上部を除いた「ハツ（血ぬき）」がある。100gあたり186kcal・脂質15.5g（生）で、肝臓（3.1g）や砂肝（1.8g）より脂質が多い。大動脈がつながる上部「ハツモト」は1羽から取れる量が少なく、柔らかく歯切れがよい。"
    zh: "“ハツ”来自英语heart，菜单写法不一，例如鸟贵族写作“ハート（ハツ）”。去掉周围的脂肪和血管并放血后没有腥膻味，规格中也有放过血、切除上部的“ハツ（血ぬき）”。每100克（生）186千卡、脂肪15.5克，脂肪比鸡肝（3.1克）和鸡胗（1.8克）多。连着主动脉的上端叫“ハツモト”（心根），一只鸡只能取下一点，肉质柔软、脆爽。"
    en: "Hatsu comes from English “heart”, and menus differ – Torikizoku, for one, writes hāto (hatsu). Trimmed of the surrounding fat and vessels and bled, it has no off-flavour, and the standard lists a bled, top-trimmed “hatsu (chinuki)”. It has 186 kcal and 15.5 g fat per 100 g (raw) – far more fat than liver (3.1 g) or gizzard (1.8 g). The top where the aorta joins, hatsumoto, yields only a little per bird and is tender with a clean bite."
  sources:
  - { title: "コトバンク「ハツ」（デジタル大辞泉・精選版 日本国語大辞典）", url: "https://kotobank.jp/word/%E3%81%AF%E3%81%A4-3216146" }
