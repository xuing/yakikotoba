- id: tsukune
  ja: つくね
  kana: つくね
  romaji: tsukune
  mean:
    ja: "鶏肉をこねて丸めたもの"
    zh: "鸡肉丸（鸡肉丸子串）"
    en: "Chicken meatball skewer"
  part:
    ja: "鶏肉をたたいて細かくし、卵や山芋などのつなぎを加えて手でこね、丸めたもの。焼き鳥では串に刺して焼く"
    zh: "把鸡肉剁碎，加鸡蛋、山药等作粘合剂，用手揉捏成团；烤鸡串店把它串起来烤"
    en: "Chicken chopped fine, bound with egg, grated yam or the like, kneaded by hand and shaped into balls; at yakitori shops, skewered and grilled"
  note:
    ja: "動詞「つくねる（捏ねる）」の連用形が名詞になった語で、手でこねて丸く固めることをいう（「つくねる」は束ねる・こねるの意）。配合や形は店ごとに異なり、京橋の伊勢廣（1921年創業）は「団子」の名で、つなぎを一切使わず麻の実を加えたものを出し、職人は手の感覚だけで重さの誤差を2g以内にそろえるという。鳥貴族は大葉を合わせた「つくね塩」のほか、「つくねたれ」「つくねチーズ焼」を出す。"
    zh: "来自动词“つくねる”（捏ねる，揉捏）的连用形名词化，指用手揉捏成团；“つくねる”有捆扎、揉捏之意。配方和形状各店不同：1921年创业的京桥老店伊势广称之为“团子”，完全不加粘合剂、拌入麻籽，据说老师傅仅凭手感就能把每个的重量误差控制在2克以内。鸟贵族则有加紫苏叶的“盐味つくね”，以及酱汁つくね和芝士つくね。"
    en: "The noun form of the verb tsukuneru, “to knead into a ball by hand” (the verb also means to bundle together). Recipes and shapes vary by shop: Ise-hiro in Kyōbashi (founded 1921) serves it as dango (“dumpling”), made with no binder at all and studded with hemp seeds, and says its cooks shape each one to within 2 g by feel alone. Torikizoku offers it salted with shiso leaf, with tare, or grilled with cheese."
  sources:
