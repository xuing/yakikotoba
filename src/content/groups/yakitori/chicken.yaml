order: 1
ja: 鶏
zh: 鸡
en: Chicken
# Group note sources:
# - 日本食鳥協会『食鶏取引規格・食鶏小売規格』（令和8年4月改正）: 若どり = 3ヵ月齢未満, こにく
# - 農林水産省 aff 2020年9月号「お肉の豆知識」https://www.maff.go.jp/j/pr/aff/2009/spe1_01.html （ブロイラーは品種ではない、地鶏のJAS条件）
# - 農林水産省「地鶏肉の日本農林規格」新旧対照表 https://www.maff.go.jp/j/jas/attach/pdf/250527_siryou-3.pdf
# - サライ「なぜ、焼き鳥はカウンター席がおすすめなのか？」https://serai.jp/gourmet/1020200 （地鶏・銘柄鶏・ブロイラー、40〜50日で出荷）
# - コトバンク「地鶏」（共同通信ニュース用語解説）https://kotobank.jp/word/%E5%9C%B0%E9%B6%8F-284345 （50日程度で出荷）
# - 農林水産省 aff 2020年9月号「お肉丸わかり図鑑」https://www.maff.go.jp/j/pr/aff/2009/spe1_02.html （せせり・ぼんじりは規格に分類されない部位）
note:
  ja: "部位名は農林水産省の「食鶏小売規格」（2026年4月改正）で定められているが、せせり・ぼんじりなどは規格にない店の通称で、首の肉は規格では「こにく」と呼ぶ。焼き鳥に使う鶏は大きく、ブロイラー（品種名ではなく、短期間で大きく育つよう改良された肉用若鶏の総称で、40〜50日ほどで出荷。規格の「若どり」はふ化後3か月未満の鶏をいう）、飼料や飼い方に工夫を加えた「銘柄鶏」、JASの基準を満たす「地鶏」の三つに分かれる。地鶏の基準は、在来種由来の血が50％以上、ふ化日から75日以上の飼育、28日齢以降は平飼いで1㎡あたり10羽以下。"
  zh: "鸡的部位名称由日本农林水产省《食鸡零售规格》（2026年4月修订）规定，せせり（鸡颈肉）、ぼんじり（鸡屁股）等是规格里没有的店家俗称，颈肉在规格中叫“こにく”（小肉）。烤鸡串用的鸡大致分三类：白羽肉鸡（broiler，不是品种名，而是经改良、能快速长大的肉用仔鸡的统称，约40–50天出栏；规格上的“若鸡”指孵化后不满3个月的鸡）、在饲料和饲养方式上下功夫的“品牌鸡”（銘柄鶏），以及符合JAS标准的“地鸡”（地鶏）。地鸡须满足：本土品种血统占50%以上，自孵化日起饲养75天以上，28日龄起平养且每平方米不超过10只。"
  en: "Cut names are fixed by MAFF's retail standard for chicken (revised April 2026); seseri and bonjiri are shop names not found in it, where neck meat is called koniku. Yakitori chicken comes in three classes: broilers – not a breed but a general term for young meat chickens bred to grow fast, usually shipped at about 40–50 days (the standard's wakadori means any bird under three months); meigara-dori, branded birds raised on modified feed or methods; and jidori, which must meet the JAS standard. That means at least 50% native-breed blood, at least 75 days from hatching, and floor rearing at no more than 10 birds per m² from day 28."
items:
- id: momo
  ja: もも
  kana: もも
  romaji: momo
  mean:
    ja: "鶏のもも肉"
    zh: "鸡腿肉"
    en: "Chicken thigh"
  part:
    ja: "脚（腿）の肉。規格の「もも肉」は腿から骨を除いた皮つきの肉で、ひざ関節より上を「うわもも」（大腿）、下を「したもも」（下腿）という"
    zh: "鸡腿的肉。规格中的“腿肉”指去骨带皮的整条腿肉，膝关节以上叫“上腿”（うわもも，大腿），以下叫“下腿”（したもも，小腿）"
    en: "Leg meat. In the standard, momo-niku is boneless, skin-on leg; above the knee joint is uwamomo (thigh proper), below it shitamomo (drumstick)"
  note:
    ja: "赤みを帯びた肉厚の肉で、うま味とコクが強い。若どりのもも（皮つき・生）は100gあたり190kcal・脂質14.2g・たんぱく質16.6g、皮を除くと113kcal・脂質5.0g。焼き鳥店では「正肉（せいにく）」とも呼び（規格の「正肉」はむね肉ともも肉を合わせたもの）、ねぎまにもふつうもも肉を使う。もも肉の付け根近くの小さな肉「ソリ」は仏語 sot-l'y-laisse（愚か者はそこを残す）に由来し、この呼び名は銀座「バードランド」が発祥とされる。"
    zh: "肉色偏红、厚实，鲜味和醇厚感强。若鸡带皮生鸡腿肉每100克190千卡、脂肪14.2克、蛋白质16.6克，去皮后为113千卡、脂肪5.0克。烤鸡串店也把它叫作“正肉”（せいにく），而规格上的“正肉”指胸肉加腿肉；鸡肉大葱串（ねぎま）一般也用腿肉。腿根附近的一小块肉叫“ソリ”，源自法语sot-l'y-laisse（“傻瓜才会剩下”），这一叫法据说始于东京银座的烤鸡店“Bird Land”（バードランド）。"
    en: "Reddish, thick meat with a rich, savoury flavour. Raw skin-on thigh from young chickens has 190 kcal, 14.2 g fat and 16.6 g protein per 100 g; skinless, 113 kcal and 5.0 g fat. Yakitori shops also call it seiniku (“proper meat”) – whereas in the standard 正肉 means breast and thigh together – and negima is normally made with thigh. The small morsel near the top of the thigh is called sori, from French sot-l'y-laisse (“only a fool leaves it”), a name said to have started at Bird Land in Ginza."
  sources:
  - { title: "農林水産省 aff 2020年9月号「鶏の部位図鑑」ポスター（監修：日本食肉消費総合センター）", url: "https://www.maff.go.jp/j/pr/aff/2009/pdf/aff2009_02_poster05.pdf" }
