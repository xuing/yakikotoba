- id: negima
  ja: ねぎま
  kana: ねぎま
  romaji: negima
  mean:
    ja: "鶏肉とねぎの串"
    zh: "鸡肉大葱串"
    en: "Chicken and negi (Japanese leek) skewer"
  part:
    ja: "鶏肉（ふつうはもも）と長ねぎを交互に串に刺したもの"
    zh: "鸡肉（一般是腿肉）与大葱段交替串在一根签子上"
    en: "Pieces of chicken (usually thigh) alternated with lengths of negi on one skewer"
  note:
    ja: "「ねぎま」は本来「葱鮪」と書き、ネギとマグロを煮た料理（ねぎま鍋・ねぎま汁）を指す語で、『東海道中膝栗毛』（1802〜09年）に用例がある。「ま」は「間」ではない。鶏の串がこの名で呼ばれる理由は、一説にネギとマグロを交互に刺して焼いた江戸の串に姿が似ていたため、一説にマグロのトロが高級になり手頃な鶏肉で代用したためという。店によって名が違い、鳥貴族は「もも貴族焼」、京橋の伊勢廣（1921年創業）はネギとシシトウを挟んだ串を単に「もも肉」と呼ぶ。"
    zh: "“ねぎま”原写作“葱鮪”，本指葱和金枪鱼同煮的菜（葱鲔锅、葱鲔汤），江户后期的《东海道中膝栗毛》（1802–09年）已有用例；“ま”并不是“间”的意思。鸡肉串沿用这个名字，一说是因为外形像江户时代把葱和金枪鱼交替串起来烤的串，一说是金枪鱼腩变贵后改用便宜的鸡肉代替。各店叫法不同：连锁店鸟贵族叫“もも贵族烧”，1921年创业的京桥老店伊势广则把夹着葱和糯米椒（シシトウ）的串直接叫“もも肉”（腿肉）。"
    en: "Negima was originally written 葱鮪, “leek and tuna”: a dish of negi simmered with tuna (as a hotpot or soup), attested in Tōkaidōchū Hizakurige (1802–09); the ma does not mean “between”. One theory says chicken skewers took the name because they looked like Edo-period skewers of alternating negi and tuna; another says cheaper chicken replaced tuna belly once toro became a luxury. Names vary by shop: Torikizoku calls its version momo kizoku-yaki, and Ise-hiro in Kyōbashi (founded 1921) simply calls its thigh skewer with negi and shishito peppers momo-niku."
  sources:
  - { title: "コトバンク「葱鮪」（精選版 日本国語大辞典・デジタル大辞泉）", url: "https://kotobank.jp/word/%E8%91%B1%E9%AE%AA-594717" }
