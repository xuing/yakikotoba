- id: reba
  ja: レバー
  kana: ればー
  romaji: rebā
  mean:
    ja: "鶏の肝臓"
    zh: "鸡肝"
    en: "Chicken liver"
  part:
    ja: "肝臓。規格では心臓と合わせて「きも」とし、肝臓だけなら「肝臓」または「レバー」と表示する"
    zh: "肝脏。规格上与心脏合称“きも”，单独出售时标作“肝脏”或“レバー”"
    en: "The liver. The standards sell it with the heart as kimo, or alone as kanzō or rebā"
  note:
    ja: "英語 liver から来た語で、1904年の村井弦斎『食道楽』に用例がある。別名「きも」で、鳥貴族も「きも（レバー）」と書く。100gあたり（生）たんぱく質18.9g・脂質3.1gのほか、鉄9.0mg、ビタミンA（レチノール活性当量）14,000µg、ビタミンB12 44.0µgを含む。鳥貴族はタレ焼きのみで出し、京橋の伊勢廣は肝臓・心臓・腎臓などを合わせた串をタレで焼き、100羽に1羽ほどしか取れない脂肪を蓄えた肝を選んで使うとしている。"
    zh: "来自英语liver，1904年村井弦斋的小说《食道乐》中已有用例。别名“きも”（肝），鸟贵族菜单也写作“きも（レバー）”。每100克（生）含蛋白质18.9克、脂肪3.1克，另含铁9.0毫克、维生素A（视黄醇活性当量）14000微克、维生素B12 44.0微克。鸟贵族只做酱汁烤；京桥伊势广把肝、心、肾等串在一起刷酱烤，并称专挑约100只鸡里才有1只的、积满脂肪的肝。"
    en: "From English “liver”, attested in Murai Gensai's novel Kuidōraku (1904). It is also called kimo, and Torikizoku writes kimo (rebā). Per 100 g raw it has 18.9 g protein and 3.1 g fat, plus 9.0 mg iron, 14,000 µg vitamin A (retinol activity equivalents) and 44.0 µg vitamin B12. Torikizoku grills it with tare only; Ise-hiro in Kyōbashi grills a mixed skewer of liver, heart, kidney and more with tare, and says it picks fat-rich livers found in only about one bird in a hundred."
  sources:
  - { title: "コトバンク「レバー」（精選版 日本国語大辞典・日本大百科全書）", url: "https://kotobank.jp/word/%E3%82%8C%E3%81%B0%E3%83%BC-3176022" }
