- id: bonjiri
  ja: ぼんじり
  kana: ぼんじり
  romaji: bonjiri
  mean:
    ja: "鶏の尾の付け根の肉"
    zh: "鸡屁股（鸡尾肉）"
    en: "Chicken tail (pope's nose)"
  part:
    ja: "尾の付け根、尾骨の周りについている肉"
    zh: "尾巴根部、尾骨周围的肉"
    en: "The meat around the tailbone at the base of the tail"
  note:
    ja: "鶏肉の中で最も脂がのっているといわれるが、よく動かす部分のため身は締まり、噛むほどにうま味が出る。規格にはない通称で、鳥貴族の品書きでは「三角（ぼんじり）」と書く。尾の付け根の背側には羽づくろい用の脂を出す「尾腺」があり、規格は販売する部位から尾腺を除くよう定めている。下処理では、脂をためた「油壺」と呼ばれるクリーム色の部分を切り落とす。"
    zh: "据说是鸡肉中脂肪最多的部位，但因经常活动而肉质紧实，越嚼越香。它不是规格里的名称而是俗称，鸟贵族的菜单写作“三角（ぼんじり）”。尾根背侧有分泌理羽油脂的“尾脂腺”，规格规定出售的分割品须去除尾脂腺；处理时要切掉积存油脂、叫作“油壶”的奶油色部分。"
    en: "Said to be the fattiest part of the bird, yet firm because it is a much-used muscle, it gives up more flavour the longer you chew. Bonjiri is a trade name, not a term in the standard; Torikizoku lists it as sankaku (“triangle”). On top of the tail base sits the uropygial (preen) gland, whose oil the bird spreads on its feathers, and the standard requires it to be removed from cuts sold. In preparation, the cream-coloured, fat-filled abura-tsubo (“oil pot”) is cut away."
  sources:
  - { title: "コトバンク「ぼんじり」（デジタル大辞泉）", url: "https://kotobank.jp/word/%E3%81%BC%E3%82%93%E3%81%98%E3%82%8A-673676" }
