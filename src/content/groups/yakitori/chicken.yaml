- id: tebasaki
  ja: 手羽先
  ruby: '{手羽先|てばさき}'
  kana: てばさき
  romaji: tebasaki
  mean:
    ja: "鶏の手羽先"
    zh: "鸡翅（翅中连翅尖）"
    en: "Chicken wing (flat and tip)"
  part:
    ja: "手羽（翼の上腕から先端まで）から上腕部分の「手羽もと」を除いた残り。橈骨・尺骨部分の「手羽なか」と先端部分の「手羽はし」から成る"
    zh: "整只翅膀（从上臂到翅尖）去掉上臂部分“翅根”（手羽もと）后剩下的部分，由桡骨和尺骨段的“翅中”（手羽なか）和末端的“翅尖”（手羽はし）组成"
    en: "The wing (upper arm to tip) minus the upper-arm drumette (tebamoto): the flat (tebanaka, the radius-and-ulna section) plus the tip (tebahashi)"
  note:
    ja: "ゼラチン質と脂質が多くうま味が濃い部位で、若どりの手羽さき（皮つき・生）は100gあたり207kcal・脂質16.2g、重量の40％が骨。手羽なかを縦半分に割ったものは「鶏スペアリブ」と呼ばれる。焼き鳥では京橋の伊勢廣が骨ごとぶつ切りにして塩で焼き、鳥貴族は塩とタレの両方で出す。名古屋名物の手羽先唐揚げは1963年創業の「風来坊」が元祖を名乗り、手羽先がスープの材料程度にしか使われなかった時代、発注ミスで丸鶏が届かなかった日に生まれたという。"
    zh: "富含胶质和脂肪，鲜味浓：若鸡带皮生翅（手羽先）每100克207千卡、脂肪16.2克，重量的40%是骨头。把翅中纵向劈成两半的叫“鸡肋排”（鶏スペアリブ）。烤鸡串店里，京桥伊势广连骨剁块撒盐烤，鸟贵族则盐味和酱汁都有。名古屋名物“炸鸡翅”以1963年创业的“风来坊”自称元祖；据该店说，当时鸡翅几乎只用来熬汤，某天因订货失误整鸡没到货，才把鸡翅蘸上秘制酱汁端上桌。"
    en: "Rich in gelatin and fat, with deep flavour: raw skin-on tebasaki from young chickens has 207 kcal and 16.2 g fat per 100 g, and 40% of its weight is bone. A flat split lengthwise is sold as “chicken spare ribs”. Ise-hiro in Kyōbashi chops it bone-in and salt-grills it; Torikizoku offers salt or tare. Nagoya's famous fried wings are claimed by Fūraibō (founded 1963), which says they were born when wings went mostly into stock and a mis-order left the shop without whole chickens one day."
  sources:
  - { title: "日本食鳥協会『食鶏取引規格・食鶏小売規格』（農林水産省畜産局長通達、令和8年4月改正）", url: "https://www.j-chicken.jp/wp-chicken/wp-content/uploads/2026/07/%E9%A3%9F%E9%B6%8F%E5%8F%96%E5%BC%95-%E5%B0%8F%E5%A3%B2%E8%A6%8F%E6%A0%BC-R7%EF%BC%88%E8%A7%A3%E4%BD%93%E5%93%81%E5%9B%B3%E8%A6%8B%E9%96%8B%E3%81%8D%EF%BC%89.pdf" }
