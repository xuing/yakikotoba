- id: sunagimo
  ja: 砂肝
  ruby: '{砂肝|すなぎも}'
  kana: すなぎも
  romaji: sunagimo
  mean:
    ja: "鶏の砂嚢（筋胃）"
    zh: "鸡胗"
    en: "Chicken gizzard"
  part:
    ja: "胃の後半部、厚い筋肉でできた筋胃（砂嚢）。規格の「すなぎも」は腺胃と内層を除いた筋胃"
    zh: "胃的后半部分、由厚实肌肉构成的肌胃（砂囊）；规格中的“砂肝”指去掉腺胃和内层膜的肌胃"
    en: "The muscular rear stomach (gizzard). In the retail standard, sunagimo is the gizzard with the glandular stomach and inner lining removed"
  note:
    ja: "鳥の胃は消化液を出す前胃（腺胃）と、それに続く筋胃に分かれる。筋胃は厚い筋肉層と丈夫な膜をもち、歯のない鳥が飲み込んだ砂粒をためて食物をすりつぶすため「砂嚢（さのう）」（嚢は袋の意）とも呼ばれる。弾力があるのにさっくり噛み切れる淡白な部位で、100gあたり86kcal・脂質1.8g・たんぱく質18.3g（生）。別名「砂ぎも」「砂ずり」（主に関西で多いといわれ、鳥貴族も「砂ずり（砂肝）」と書く）で、規格には腱質を除いた「すなぎも（すじなし）」もある。"
    zh: "鸟的胃分为分泌消化液的前胃（腺胃）和其后的肌胃。肌胃有厚实的肌肉层和坚韧的内膜，鸟没有牙齿，靠储存在其中的砂粒把食物磨碎，因此又叫“砂囊”。口感有弹性却一咬就断，味道清淡，每100克（生）86千卡、脂肪1.8克、蛋白质18.3克。别名“砂ぎも”“砂ずり”（据说关西较常用，鸟贵族菜单也写作“砂ずり（砂肝）”），规格中另有去掉筋膜的“去筋砂肝”。"
    en: "A bird's stomach has two parts: the glandular proventriculus, which secretes digestive juices, and the muscular gizzard behind it. Birds have no teeth, so the gizzard – thick-walled with a tough lining – stores swallowed grit to grind food, hence its other name sanō, “sand bag”. Springy yet clean to bite and mild in taste, it has 86 kcal, 1.8 g fat and 18.3 g protein per 100 g (raw). It is also called sunazuri, said to be commoner in Kansai (Torikizoku writes “sunazuri (sunagimo)”), and the standard also lists sunagimo with the tough sinew removed (sujinashi)."
  sources:
  - { title: "コトバンク「砂嚢」（デジタル大辞泉・精選版 日本国語大辞典・ブリタニカ国際大百科事典）", url: "https://kotobank.jp/word/%E7%A0%82%E5%9A%A2-69447" }
  - { title: "コトバンク「筋胃」（精選版 日本国語大辞典）", url: "https://kotobank.jp/word/%E7%AD%8B%E8%83%83-247485" }
  - { title: "コトバンク「腺胃」（世界大百科事典）", url: "https://kotobank.jp/word/%E8%85%BA%E8%83%83-1352763" }
