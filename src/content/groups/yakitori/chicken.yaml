- id: mune
  ja: むね
  kana: むね
  romaji: mune
  mean:
    ja: "鶏の胸肉"
    zh: "鸡胸肉"
    en: "Chicken breast"
  part:
    ja: "胸部の肉（骨を除いた皮つき肉）。規格では手羽と首の皮を除いた胸の肉で、手羽もとの付け根部分は「かたこにく」として分ける"
    zh: "胸部去骨带皮的肉。规格上指去掉整只翅膀和颈皮后的胸肉，翅根根部那块另称“かたこにく”（肩小肉）"
    en: "Boneless, skin-on breast. The standard defines it as the breast minus the whole wing and neck skin, with the piece at the base of the wing classed separately as katakoniku"
  note:
    ja: "脂肪が少なく淡白で、若どりのむね（皮なし・生）は100gあたり105kcal・脂質1.9g・たんぱく質23.3g、皮つきは133kcal・脂質5.9g。高温で加熱するとパサつきやすい。イミダゾールジペプチドを多く含む。むね肉と手羽もとの間にある「ふりそで」は、もも肉より脂が控えめでむね肉よりジューシーな部位で、スーパーでは「鶏肩肉」として売られる。"
    zh: "脂肪少、味清淡：若鸡去皮生鸡胸每100克105千卡、脂肪1.9克、蛋白质23.3克，带皮为133千卡、脂肪5.9克。高温加热容易发柴。鸡胸肉富含咪唑二肽（imidazole dipeptide）。胸肉与翅根之间的“ふりそで”脂肪比腿肉少、又比胸肉多汁，超市里以“鸡肩肉”的名称出售。"
    en: "Lean and mild: raw skinless breast from young chickens has 105 kcal, 1.9 g fat and 23.3 g protein per 100 g (skin-on: 133 kcal, 5.9 g fat). It dries out easily at high heat. Breast meat is rich in imidazole dipeptides. The furisode, between the breast and the wing drumette, is leaner than thigh but juicier than breast, and is sold in supermarkets as “chicken shoulder”."
  sources:
  - { title: "農林水産省 aff 2020年9月号「鶏の部位図鑑」ポスター（監修：日本食肉消費総合センター）", url: "https://www.maff.go.jp/j/pr/aff/2009/pdf/aff2009_02_poster05.pdf" }
