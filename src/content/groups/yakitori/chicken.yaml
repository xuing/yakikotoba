- id: seseri
  ja: せせり
  kana: せせり
  romaji: seseri
  mean:
    ja: "鶏の首の肉"
    zh: "鸡颈肉（鸡脖肉）"
    en: "Chicken neck meat"
  part:
    ja: "首の骨についている肉を切り取ったもの。規格での名は「こにく」（取引規格の「こにくⅠ型」）"
    zh: "从鸡脖子骨上剔下的肉；规格中叫“小肉”（こにく，交易规格的“小肉Ⅰ型”）"
    en: "Meat cut from the neck bones; the standard's name is koniku (type I in the wholesale standard)"
  note:
    ja: "一羽から少量しか取れない希少な部位であることから「小肉（こにく）」とも呼ばれる。鶏は常に首を動かしているため肉質が引き締まり、プリプリした弾力と濃いうま味、噛むほどに出る肉汁が特徴で、コラーゲンも多い。鳥貴族は塩焼きのみで出し、京橋の伊勢廣は首の肉で皮をはさんだ「皮身」に使う。"
    zh: "因一只鸡只能取下少量、比较稀少，又叫“小肉”（こにく）。鸡的脖子总在活动，所以肉质紧实，弹牙、鲜味浓，越嚼汁水越多，胶原蛋白也丰富。鸟贵族只做盐烤；京桥伊势广则用颈肉夹住鸡皮，做成“皮身”。"
    en: "Because only a little comes from each bird it is also called koniku, “small meat”. Constant neck movement makes the meat firm and springy, with deep flavour, juices that flow as you chew, and plenty of collagen. Torikizoku serves it salt-grilled only, and Ise-hiro in Kyōbashi uses it to sandwich skin in its 皮身 skewer."
  sources:
  - { title: "農林水産省 aff 2020年9月号「牛、豚、鶏の部位を徹底解説！お肉丸わかり図鑑」", url: "https://www.maff.go.jp/j/pr/aff/2009/spe1_02.html" }
