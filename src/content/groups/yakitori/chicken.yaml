- id: kawa
  ja: 皮
  ruby: '{皮|かわ}'
  kana: かわ
  romaji: kawa
  mean:
    ja: "鶏の皮"
    zh: "鸡皮"
    en: "Chicken skin"
  part:
    ja: "鶏の皮（皮下脂肪を含む）。取引規格は首の皮（頸皮）を「かわⅠ型」、それ以外の皮を「かわⅡ型」と分ける"
    zh: "鸡皮（含皮下脂肪）。交易规格把颈皮定为“皮Ⅰ型”，其余部位的皮为“皮Ⅱ型”"
    en: "Skin with its subcutaneous fat. The wholesale standard classes neck skin as kawa type I and all other skin as type II"
  note:
    ja: "皮下脂肪を含むため脂質が多く、もも皮（生）は100gあたり脂質51.6g・474kcal、むね皮は48.1g・466kcalで、カロリーはささみの約5倍。博多名物の「とりかわ」は首の皮を串にらせん状に巻き付け、タレに漬けては焼く工程を数日かけて繰り返して脂を落とす（福岡の「かわ屋」は6日間かけて仕込む）。京橋の伊勢廣は皮を首の肉ではさんだ「皮身」を塩で焼き、鳥貴族はゆでた皮を塩かタレで焼く。"
    zh: "因含皮下脂肪，脂肪很高：生鸡腿皮每100克脂肪51.6克、474千卡，胸皮48.1克、466千卡，热量约为鸡里脊的5倍。博多名物“鸡皮串”（とりかわ）把颈皮螺旋状缠在签子上，反复蘸酱、烤制、放凉，花上数天逼出油脂（福冈的“かわ屋”要准备6天）。京桥伊势广把鸡皮夹上颈肉做成“皮身”撒盐烤；鸟贵族则把焯过水的鸡皮做成盐烤或酱汁烤。"
    en: "Including the subcutaneous fat, it is very rich: raw thigh skin has 51.6 g fat and 474 kcal per 100 g, breast skin 48.1 g and 466 kcal – about five times the calories of sasami. Hakata's torikawa winds neck skin in a spiral around the skewer, then dips it in tare and grills it again and again over several days to render out the fat (Kawaya in Fukuoka takes six days). Ise-hiro in Kyōbashi salt-grills skin sandwiched with neck meat (its 皮身 skewer), and Torikizoku grills pre-boiled skin with salt or tare."
  sources:
  - { title: "文部科学省「日本食品標準成分表（八訂）増補2023年」", url: "https://www.mext.go.jp/a_menu/syokuhinseibun/mext_00001.html" }
