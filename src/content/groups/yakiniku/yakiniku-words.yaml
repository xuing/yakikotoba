        url: https://www.sentabi.jp/delicious
      - title: 仙台観光国際協会「せんだい旅日和」仙台牛たん焼き、食べ比べの楽しみ
        url: https://www.sentabi.jp/features/42
  - id: tare
    ja: タレ
    kana: たれ
    romaji: tare
    mean:
      ja: 焼肉のたれ
      zh: 烤肉酱汁
      en: Sauce (tare)
    part:
      ja: 醤油をベースにした液状の合わせ調味料。焼いた肉につける、または肉を漬け込んでから焼く
      zh: 以酱油为底的液体复合调味料，用来蘸烤好的肉，或先把肉腌在里面再烤
      en: A soy-based liquid seasoning, used as a dip for grilled meat or as a marinade before grilling
    note:
      ja: 漢字では「垂れ」と書き、もとは味噌の垂れ汁（たれじる）から始まった言葉で、醤油・みりんなどを合わせて煮つめた調味液をいう（日本大百科全書）。焼肉では焼いた肉につけるほか、肉をタレに漬け込んでから焼く食べ方もある。家庭用の「焼肉のたれ」は1968年にエバラ食品が発売し、醤油ベースなので、他社が使っていた「ソース」ではなく「たれ」と名付けたという。
      zh: 汉字写作「垂れ」，原本出自味噌滴下的汁液（垂れ汁），指酱油、味醂等调和熬制的调味汁（《日本大百科全书》）。吃烤肉时可以烤好后蘸，也可以先把肉腌在酱汁里再烤。家用「焼肉のたれ」由荏原食品（エバラ食品）于1968年推出；因为是酱油底，没有沿用别家用的“沙司”（ソース）一词，而取名为「たれ」。
      en: Written 垂れ (“drippings”), the word began with the liquid that drips from miso, and means a seasoning of soy sauce, mirin and the like simmered together (Nipponica encyclopedia). At yakiniku it is either a dip for grilled meat or a marinade the meat soaks in before grilling. Ebara Foods launched bottled yakiniku no tare for the home in 1968 and, because it was soy-based, called it tare rather than the “sauce” (sōsu) other makers used.
    sources:
      - title: 日本大百科全書「たれ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%9F%E3%82%8C-563411
