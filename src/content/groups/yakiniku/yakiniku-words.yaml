order: 5
ja: 用語
zh: 菜单用语
en: Menu words
note:
  ja: 品書きでは「上タン塩」＝「上（等級）＋タン（部位）＋塩（味付け）」のように語を組み合わせ、注文では「2人前」のように量を添える。
  zh: 菜单上的菜名由几个词拼成，例如「上タン塩」＝「上」（档次）＋「タン」（部位）＋「塩」（调味）；点菜时再加上份量，如「2人前」。
  en: "Menu items are built from parts: jō-tan-shio = jō (grade) + tan (cut) + shio (seasoning); when ordering you add the quantity, e.g. ni-ninmae (two servings)."
items:
  - id: shio
    ja: 塩
    ruby: "{塩|しお}"
    kana: しお
    romaji: shio
    mean:
      ja: 塩味
      zh: 盐味
      en: Salt (seasoning)
    part:
      ja: タレではなく塩で味付けして焼く肉。「タン塩」のように部位名の後に付ける
      zh: 不用酱汁、用盐调味再烤的肉，接在部位名后，如「タン塩」
      en: Meat seasoned with salt instead of sauce; follows the cut name, as in tan-shio
    note:
      ja: 焼肉は焼いてからタレや塩をつけて食べるほか、あらかじめ下味をつけてから焼くこともある（日本食肉消費総合センター）。牛タンは焼肉店では「タン塩」として食べることが多い（同）。1948年に最初の専門店が生まれた仙台名物の牛たん焼きでは、塩味にこだわる老舗のほか味噌や醤油味の店もあり、味付けは店ごとに異なる。
      zh: 烤肉既可以烤好后蘸酱汁或盐吃，也可以先调好底味再烤（日本食肉消费综合中心）。牛舌在烤肉店多以「タン塩」（盐烤牛舌）的形式来吃（同上）。仙台名产烤牛舌的第一家专卖店诞生于1948年，当地既有坚持盐味的老店，也有味噌味、酱油味的店，调味因店而异。
      en: Yakiniku may be dipped in sauce or salt after grilling, or seasoned before it goes on the grill (Japan Meat Information Service Center). At yakiniku restaurants beef tongue is most often eaten as tan-shio, salted tongue (same source). In Sendai, whose grilled-tongue specialty dates from the first dedicated restaurant in 1948, old shops that stick to salt sit alongside ones seasoning with miso or soy sauce.
    sources:
      - title: 日本食肉消費総合センター 用語集「焼き肉」
        url: https://www.jmi.or.jp/info/word/ya/ya_002.html
      - title: 日本食肉消費総合センター 用語集「タン」
        url: https://www.jmi.or.jp/info/word/ta/ta_025.html
