        url: https://www.ebarafoods.com/sp/meat/32/
  - id: ninmae
    ja: 人前
    ruby: "{人前|にんまえ}"
    kana: にんまえ
    romaji: ninmae
    mean:
      ja: …人分
      zh: …人份
      en: Serving(s)
    part:
      ja: 数の後に付けて、何人分の量かを表す語。「1人前」「2人前」
      zh: 接在数字后表示几人份的量，如「1人前」「2人前」
      en: "Suffix after a number giving how many people’s portions: ichi-ninmae (one serving), ni-ninmae (two)"
    note:
      ja: 「一人前（いちにんまえ）」は一人に割り当てる量をいい、1701年の浮世草子『傾城色三味線』に用例がある（日本国語大辞典）。同じ「一人前」は「成人であること」「技芸などが一応の水準に達していること」も表し、「一人前の医者」のように使う。「人前」だけだと「ひとまえ」と読み、「人の見ている前・公衆の面前」という別の意味になる。
      zh: 「一人前」（いちにんまえ）指分给一个人的量，1701年的浮世草子《倾城色三味线》中已有用例（《日本国语大辞典》）。同样的「一人前」还表示“成年”“技艺等达到一定水准”，如「一人前の医者」（独当一面的医生）。单独的「人前」读作“ひとまえ”，意思变成“人前、众人面前”。
      en: Ichi-ninmae is the amount allotted to one person, attested in the 1701 ukiyo-zōshi Keisei Iro Jamisen (Nihon Kokugo Daijiten). The same ichi-ninmae also means “adult” or “fully qualified”, as in ichi-ninmae no isha, “a full-fledged doctor”. On its own, 人前 is read hitomae and means “in front of others, in public”.
    sources:
      - title: デジタル大辞泉・精選版 日本国語大辞典「一人前」（コトバンク）
        url: https://kotobank.jp/word/%E4%B8%80%E4%BA%BA%E5%89%8D-31335
      - title: デジタル大辞泉・精選版 日本国語大辞典「人前」（コトバンク）
        url: https://kotobank.jp/word/%E4%BA%BA%E5%89%8D-611659
  - id: tabehodai
    ja: 食べ放題
    ruby: "{食|た}べ{放題|ほうだい}"
    kana: たべほうだい
    romaji: tabehōdai
    mean:
      ja: 一定料金で好きなだけ食べられること
      zh: 吃到饱（自助）
      en: All-you-can-eat
    part:
      ja: 一定料金で、多くは制限時間内に好きなだけ注文・飲食できる方式
      zh: 付固定价格，通常在限定时间内想吃多少点多少
      en: A fixed price for as much as you like, usually within a time limit
    note:
      ja: 「放題」は動詞の連用形などに付いて思いのままにする意を表す接尾語で、「飲み放題」「言いたい放題」のほか、「伸び放題」のように成り行きに任せる意にもなる（デジタル大辞泉）。食べ放題は一定料金で好きなだけ食べられる方式で時間制限が設けられることが多く、料理を並べて各自が取る「バイキング」は、1958年に帝国ホテルが北欧のスモーガスボードを参考に始めた日本独自の呼び名である。焼肉チェーンではテーブルのタッチパネルで注文して席まで運んでもらう方式もあり、焼肉きんぐの食べ放題は100分制。
      zh: 「放題」是接在动词连用形等后面的后缀，表示随心所欲地做；除「飲み放題」（畅饮）、「言いたい放題」（想说什么说什么）外，「伸び放題」（任其疯长）则表示放任不管（《数字大辞泉》）。「食べ放題」是付固定价格随便吃的方式，多有时间限制；把菜摆出来各自取用的形式在日本叫“バイキング”（维京），是帝国饭店1958年参考北欧的 smörgåsbord 首创的日式叫法。烤肉连锁店也有用桌上触摸屏点单、由店员送到桌边的方式，例如焼肉きんぐ的自助是100分钟制。
      en: "-hōdai is a suffix meaning “as much as one likes”: nomi-hōdai (all-you-can-drink), iitai-hōdai (saying whatever one pleases), and also “left to run wild”, as in nobi-hōdai (overgrown) (Digital Daijisen). Tabehōdai means unlimited eating for a fixed price, usually with a time limit; the self-serve buffet is called baikingu (“Viking”) in Japan, a name the Imperial Hotel coined in 1958 for a buffet modelled on the Scandinavian smörgåsbord. Yakiniku chains also run table-order versions where you order on a touch panel and staff bring the food; Yakiniku King’s all-you-can-eat runs 100 minutes."
    sources:
      - title: デジタル大辞泉・精選版 日本国語大辞典「放題」（コトバンク）
        url: https://kotobank.jp/word/%E6%94%BE%E9%A1%8C-628148
      - title: 世界の料理がわかる辞典「食べ放題」（コトバンク）
        url: https://kotobank.jp/word/%E9%A3%9F%E3%81%B9%E6%94%BE%E9%A1%8C-562600
      - title: 精選版 日本国語大辞典・日本大百科全書・世界の料理がわかる辞典「バイキング料理」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%B0%E3%81%84%E3%81%8D%E3%82%93%E3%81%90%E6%96%99%E7%90%86-3164021
      - title: 焼肉きんぐ 公式サイト（食べ放題コース）
        url: https://www.yakiniku-king.jp/
