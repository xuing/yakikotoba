  - id: jo
    ja: 上
    ruby: "{上|じょう}"
    kana: じょう
    romaji: jō
    mean:
      ja: 普通より上等
      zh: 上等（比普通的好）
      en: Premium (a cut above standard)
    part:
      ja: 品書きで部位名の前に付ける等級。「上カルビ」「上タン塩」など
      zh: 菜单上放在部位名前的档次标记，如「上カルビ」「上タン塩」
      en: "A grade prefix before the cut on menus: jō-karubi, jō-tan-shio"
    note:
      ja: 「うえ」ではなく「じょう」と読み、普通のものより価値・程度が優れていることを表す語で、世阿弥『風姿花伝』の「上・中・下」にも用例がある（日本国語大辞典）。牛肉の公的な格付は日本食肉格付協会の歩留等級A〜Cと肉質等級5〜1を組み合わせた15区分（A5など）で、「上」という等級はない。一方、豚枝肉の格付は「極上・上・中・並・等外」の5段階で、「上」が正式な等級名になっている。また「上ミノ」は、第一胃のうち特に厚い部分の名前として定着している。
      zh: 读作“じょう”（jō）而不是“うえ”，表示比普通的更好，世阿弥《风姿花传》的“上・中・下”就是这个用法（《日本国语大辞典》）。牛肉的官方评级由日本食肉格付协会把出肉率等级A–C和肉质等级5–1组合成15档（如A5），没有“上”这一级。而猪胴体的官方评级分“极上・上・中・并・等外”五级，“上”是正式等级名。另外「上ミノ」已固定用来指第一胃中特别厚的部分。
      en: Read jō rather than ue, the word marks something better than ordinary, a sense found as early as Zeami’s Fūshi Kaden with its “upper, middle, lower” (Nihon Kokugo Daijiten). Official beef grading by the Japan Meat Grading Association combines yield grades A–C with quality grades 5–1 into 15 classes (A5 and so on); there is no jō grade. Pork carcasses, by contrast, are graded gokujō, jō, chū, nami and tōgai, so jō is an official pork grade. And jō-mino has become the name of the especially thick part of the rumen.
    sources:
      - title: 精選版 日本国語大辞典「上（じょう）」（コトバンク）
        url: https://kotobank.jp/word/%E4%B8%8A-33718
      - title: 日本食肉格付協会「牛枝肉取引規格」
        url: https://www.jmga.or.jp/index.php/standard/beef/
      - title: 日本食肉格付協会「豚枝肉取引規格」
        url: https://www.jmga.or.jp/index.php/standard/pork/
