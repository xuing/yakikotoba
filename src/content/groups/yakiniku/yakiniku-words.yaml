        url: https://www.maff.go.jp/j/pr/aff/1608/spe2_01.html
      - title: 日本食肉消費総合センター 用語集「ミノ」
        url: https://www.jmi.or.jp/info/word/ma/ma_036.html
  - id: tokujo
    ja: 特上
    ruby: "{特上|とくじょう}"
    kana: とくじょう
    romaji: tokujō
    mean:
      ja: 特別に上等
      zh: 特等（比「上」更高）
      en: Top grade, extra premium
    part:
      ja: 「上」よりさらに上の品書きの等級。「特上カルビ」「特上ロース」など
      zh: 比「上」更高一档的菜单标记，如「特上カルビ」「特上ロース」
      en: "The menu grade above jō: tokujō-karubi, tokujō-rōsu"
    note:
      ja: 「特別に上等であること。最上の品物」を表す語で（日本国語大辞典）、デジタル大辞泉は用例に「特上の肉」を挙げる。農林水産省の部位図鑑は、かたロースの中でもしっかり霜降りが入る「ザブトン」を「お店では特上ロースとして提供される」と紹介している。公的な格付の最上位は牛肉なら「A5」、豚枝肉なら「極上」で、「特上」は格付の用語ではない。
      zh: 意思是“特别上等、最好的东西”（《日本国语大辞典》），《数字大辞泉》举的例句就是「特上の肉」（特上的肉）。农林水产省的部位图鉴介绍，肩胛里脊中霜降较多的「ザブトン」（坐垫肉）“在店里作为「特上ロース」供应”。官方评级的最高级，牛肉是“A5”，猪胴体是“极上”，「特上」并不是评级用语。
      en: It means “specially superior; the very best article” (Nihon Kokugo Daijiten), and the Digital Daijisen’s example is tokujō no niku, “top-grade meat”. MAFF’s cut guide says zabuton, the well-marbled part of the chuck roll, is “served in restaurants as tokujō rōsu”. The top official grades are A5 for beef and gokujō for pork carcasses; tokujō is not a grading term.
    sources:
      - title: 精選版 日本国語大辞典・デジタル大辞泉「特上」（コトバンク）
        url: https://kotobank.jp/word/%E7%89%B9%E4%B8%8A-582616
