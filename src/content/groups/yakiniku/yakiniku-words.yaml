        url: https://www.jmga.or.jp/index.php/standard/beef/
      - title: 日本食肉格付協会「豚枝肉取引規格」
        url: https://www.jmga.or.jp/index.php/standard/pork/
  - id: kisho-bui
    ja: 希少部位
    ruby: "{希少|きしょう}{部位|ぶい}"
    kana: きしょうぶい
    romaji: kishō bui
    mean:
      ja: 1頭から少ししか取れない部位
      zh: 稀少部位
      en: Rare cut
    part:
      ja: 大きな部位をさらに細かく分けて取る小さな部位の総称（ミスジ、ザブトン、イチボなど）
      zh: 把大部位再细分后取出的小块部位的统称（如ミスジ、ザブトン、イチボ）
      en: Small sub-cuts taken from the major primals (misuji, zabuton, ichibo and so on)
    note:
      ja: 明確な定義はなく、牛肉の部位は「食肉小売品質基準」で11部位に分けられるが、焼肉店などではさらに細かく分けた希少部位が味わえる（農林水産省）。エバラ食品の解説によれば、牛1頭から取れる食肉約400kgのうち0.5％、約2kgほどしか取れない部位を指すことが多い。一部の焼肉店が付加価値をつけてメニューにしたのが始まりで、2000年代初頭の焼肉ブームで広まり、カメノコ（うちももの一部）やメガネ（骨盤まわりの赤身）など細分化が進んだという（同）。
      zh: 没有明确定义：按「食肉小売品質基準」（肉类零售品质基准），牛肉分为11个部位，而烤肉店等会进一步细分，提供稀少部位（农林水产省）。据荏原食品（エバラ食品）介绍，一头牛约可取400公斤肉，其中只占0.5%、约2公斤左右的部位通常被称为稀少部位。这一说法始于部分烤肉店为提升附加值推出的菜品，随2000年代初的烤肉热普及，后来又细分出「カメノコ」（内侧腿肉的一部分）、「メガネ」（骨盆周围的瘦肉）等（同上）。
      en: "There is no formal definition: Japan’s retail meat standard divides beef into 11 parts, while yakiniku restaurants cut further into rare cuts (MAFF). Ebara Foods explains that the term usually means parts yielding only about 2 kg—0.5% of the roughly 400 kg of meat from one animal. It began as a value-adding menu device at some yakiniku shops, spread with the early-2000s yakiniku boom, and has since split into ever smaller cuts such as kamenoko (part of the inside round) and megane (lean meat around the pelvis) (same source)."
    sources:
      - title: 農林水産省 aff 2016年8月号 特集2「牛肉(2) 牛肉の部位図鑑」
        url: https://www.maff.go.jp/j/pr/aff/1608/spe2_02.html
      - title: エバラ食品「スーパーでも手に入るようになった「希少部位」おうちでおいしく食べる調理術をお肉の達人が伝授します」（2020年8月31日）
        url: https://www.ebarafoods.com/sp/meat/32/
  - id: atsugiri
    ja: 厚切り
    ruby: "{厚切|あつぎ}り"
    kana: あつぎり
    romaji: atsugiri
    mean:
      ja: 厚く切ること・厚く切ったもの
      zh: 厚切
      en: Thick-cut
    part:
      ja: 肉を厚めに切ったもの。「厚切りタン」のように部位名の前に付ける
      zh: 把肉切得较厚，放在部位名前，如「厚切りタン」
      en: Meat sliced thick; placed before the cut name, as in atsugiri-tan
    note:
      ja: 対義語は「薄切り」で（デジタル大辞泉）、食肉は部分肉から厚切り・薄切り・かたまり・ひき肉など用途に合わせた精肉にカットされて売られる（日本食肉消費総合センター）。牛タンは根元ほど柔らかく舌先ほど硬い部位で（農林水産省）、日本食肉消費総合センターは、脂肪は多いがかたく、薄切りか長時間の煮込みでやわらかく食べられると説明している。1948年に最初の専門店ができた仙台の牛たん焼きでは、厚切りを看板にする店が複数ある。
      zh: 反义词是「薄切り」（薄切）（《数字大辞泉》）；肉类会由分割肉切成厚片、薄片、整块、肉末等按用途销售的精肉（日本食肉消费综合中心）。牛舌越靠舌根越软、越靠舌尖越硬（农林水产省），日本食肉消费综合中心也说它脂肪多但偏硬，切薄片或长时间炖煮才吃得软嫩。仙台烤牛舌的第一家专卖店诞生于1948年，当地有好几家以厚切牛舌为招牌的店。
      en: The opposite is usugiri, “thin-cut” (Digital Daijisen); retail meat is cut from primals into thick slices, thin slices, blocks or mince to suit its use (Japan Meat Information Service Center). Beef tongue is softer toward the root and tougher toward the tip (MAFF), and the same center notes it is fatty but tough, eaten tender only when sliced thin or braised for a long time. In Sendai, where the first grilled-tongue restaurant opened in 1948, several shops make thick-cut tongue their calling card.
    sources:
      - title: デジタル大辞泉「厚切り」（コトバンク）
        url: https://kotobank.jp/word/%E5%8E%9A%E5%88%87%E3%82%8A-425460
