  - id: moriawase
    ja: 盛り合わせ
    ruby: "{盛|も}り{合|あ}わせ"
    kana: もりあわせ
    romaji: moriawase
    mean:
      ja: 数種類を一皿に盛ったもの
      zh: 拼盘
      en: Assorted platter
    part:
      ja: 異なる部位や料理をいくつか取り合わせて一つの器に盛った品
      zh: 把几种不同的部位或菜放在同一个盘子里
      en: Several different cuts or dishes arranged together on one plate
    note:
      ja: 「盛る」と「合わせる」からなる語で、料理で一つの器に異なるものをいくつか取り合わせて盛ったものをいう（世界の料理がわかる辞典）。たとえばナムルは、ほうれん草・大豆もやし・ぜんまいの3種を盛り合わせることが多い（同）。刺身の盛り合わせのように部位別の肉に名札を付けて大皿に並べる焼肉店が増えたことが、希少部位の名が広まった一因とされる（エバラ食品）。
      zh: 由「盛る」（盛装）和「合わせる」（搭配）构成，指在一个容器里搭配盛放几种不同的菜（《世界の料理がわかる辞典》）。例如韩式拌菜常把菠菜、黄豆芽、蕨菜三样拼在一起（同上）。有观点认为，烤肉店像生鱼片拼盘那样，把各部位的肉配上名牌摆在大盘里，是稀少部位名称普及的原因之一（荏原食品）。
      en: "From moru (“to heap on a dish”) and awaseru (“to combine”): several different foods arranged together in one vessel (Sekai no Ryōri ga Wakaru Jiten). Namul, for instance, is usually served as a trio of spinach, soybean sprouts and bracken (same source). Yakiniku shops laying out cuts with name tags on a big platter, like a sashimi assortment, are credited with helping the names of rare cuts catch on (Ebara Foods)."
    sources:
      - title: 世界の料理がわかる辞典「盛り合わせ」（コトバンク）
        url: https://kotobank.jp/word/%E7%9B%9B%E3%82%8A%E5%90%88%E3%82%8F%E3%81%9B-1496365
      - title: デジタル大辞泉・精選版 日本国語大辞典・世界の料理がわかる辞典「ナムル」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%AA%E3%82%80%E3%82%8B-3215386
