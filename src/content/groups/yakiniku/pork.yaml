  - id: bara
    ja: 豚バラ
    ruby: "{豚|ぶた}バラ"
    kana: ぶたばら
    romaji: buta bara
    mean:
      ja: "豚のばら肉（三枚肉）"
      zh: "猪五花肉"
      en: "Pork belly"
    part:
      ja: "腹側の、あばら骨まわりの肉"
      zh: "腹部、肋骨周围的肉"
      en: "The belly, around the ribs"
    note:
      ja: "赤身と脂肪が交互に3層ほど重なって見えることから「三枚肉」とも呼ばれ、骨付きのものはスペアリブ、ベーコンもこの部位から作る。辞書はカルビを「牛や豚のばら肉」としており、豚バラは「豚カルビ」とも呼ばれ、韓国料理のサムギョプサル（삼겹살、「3・層・肉」の意）も豚バラを焼くもの。豚部分肉取引規格では第5肋骨の長さの3分の1の位置で背線と平行に切ってロースとばらを分け、半丸1本分のばらは4.0kg未満が「S」、4.5kg以上が「L」。日本食品標準成分表では、ばら（大型種・脂身つき・生）の脂質は100gあたり35.4g。"
      zh: "瘦肉和肥肉交替叠成约三层，所以又叫“三枚肉”；带骨的就是肋排（spare rib），培根也用这个部位做。词典把“カルビ”解释为“牛或猪的五花肉”，所以猪五花也叫“豚カルビ”；韩国的“삼겹살”（サムギョプサル，意为“三层肉”）烤的也是猪五花。按猪分割肉交易规格，在第5肋骨长度三分之一处与背线平行切开，分出里脊（ロース）和五花；半边胴体的一整块五花不足4.0公斤为“S”，4.5公斤以上为“L”。日本食品标准成分表中，猪五花（大型种、带脂、生）每100克含脂质35.4克。"
      en: "Lean and fat alternate in about three layers, hence its other name sanmai-niku (“three-layer meat”); bone-in it becomes spare ribs, and bacon is made from it. Dictionaries define karubi as the belly meat of cattle or pigs, so pork belly is also sold as buta-karubi, and Korean samgyeopsal (삼겹살, “three-layer flesh”) is grilled pork belly too. The wholesale pork standard separates loin from belly with a cut parallel to the back one third of the way down the 5th rib; a belly from one side under 4.0 kg is graded S, and 4.5 kg or more L. Raw belly of large-breed pork with its fat contains 35.4 g of fat per 100 g."
    sources:
