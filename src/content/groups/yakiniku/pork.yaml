  - id: tan
    ja: 豚タン
    ruby: "{豚|ぶた}タン"
    kana: ぶたたん
    romaji: buta tan
    mean:
      ja: "豚の舌"
      zh: "猪舌"
      en: "Pork tongue"
    part:
      ja: "舌（根元のタン元から先端のタン先まで）"
      zh: "舌头（从舌根“タン元”到舌尖“タン先”）"
      en: "The tongue, from the root (tan-moto) to the tip (tan-saki)"
    note:
      ja: "皮は食用に向かないため取り除いて使う。根元のほうは脂肪が多く柔らかく、全体にコリコリとした歯ごたえがあり、薄切りにして網焼きやから揚げにする。ビタミンA・B2、鉄、タウリンを正肉より多く含む。日本食品標準成分表では生100gあたりの脂質が16.3gで、牛タン（31.8g）のほぼ半分。"
      zh: "舌皮不适合食用，要剥掉再用。舌根部分脂肪多、较软，整体口感脆韧，常切薄片网烤或做成炸物。维生素A、B2、铁和牛磺酸的含量比正肉高。日本食品标准成分表中，生猪舌每100克含脂质16.3克，约为牛舌（31.8克）的一半。"
      en: "The skin is inedible and is removed before use. The root end is fattier and softer, the whole tongue has a crunchy, springy bite, and it is sliced thin for grilling or deep-frying. It contains more vitamins A and B2, iron and taurine than muscle meat. Raw, it has 16.3 g of fat per 100 g—about half the 31.8 g in beef tongue."
    sources:
