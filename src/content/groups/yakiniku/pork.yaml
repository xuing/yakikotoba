order: 3
ja: 豚
zh: 猪肉
en: Pork
note:
  ja: "小売表示の部位は「食肉小売品質基準」でかた・かたロース・ロース・ヒレ・ばら・もも・そとももの7つ、卸売の「豚部分肉取引規格」ではかた・ヒレ・ロース・ばら・ももの5つ（かたを分けるときはかたロースとうで）で、豚トロ（ネック）はどちらでも独立した部位ではない。豚は牛より若い月齢で出荷されるため、脂肪の多いばらを除けば部位による肉質の差が比較的小さい。"
  zh: "零售标示按《食肉零售品质基准》分为かた、かたロース、ロース、ヒレ、ばら、もも、そともも7个部位；批发用的《猪分割肉交易规格》分为かた、ヒレ、ロース、ばら、もも5块（细分时把かた再分成かたロース和うで）；豚トロ（颈肉）在两套标准里都不是独立部位。猪的出栏月龄比牛小，除了脂肪多的五花，各部位的肉质差别相对较小。"
  en: "Japan’s retail labelling standard recognises seven pork cuts (kata, kata-rōsu, rōsu, hire, bara, momo, sotomomo) and the wholesale standard five (kata, hire, rōsu, bara, momo, with kata optionally split into kata-rōsu and ude); tontoro (neck) is not a separate cut in either. Pigs go to market younger than cattle, so apart from the fatty belly the cuts differ relatively little in texture."
items:
  - id: tontoro
    ja: 豚トロ
    ruby: "{豚|とん}トロ"
    kana: とんとろ
    romaji: tontoro
    mean:
      ja: "豚の頬〜首の脂ののった肉"
      zh: "猪颈肉"
      en: "Pork jowl / neck (P-toro)"
    part:
      ja: "頬から首にかけての、あご周りの肉"
      zh: "从脸颊到脖子、下颌周围的肉"
      en: "Meat from the cheek to the neck, around the jaw (jowl)"
    note:
      ja: "マグロのトロのように脂がのっていることからの名で、「とんとろ」と読み、「ピーとろ」とも呼ぶ。一頭から左右1枚ずつ、少量しか取れない。ほどよい脂肪と霜降りが豊富で、焼肉にするとサクサクとした食感になる。食肉小売品質基準の豚の7部位には含まれず、豚部分肉取引規格では頬部（ジョール）は「かた」の一部として整形される。"
      zh: "因像金枪鱼的“toro”（腹部肥肉）一样油脂丰腴而得名，读作“とんとろ”，也叫“ピーとろ”。一头猪左右各只有一片，产量很少。脂肪适中、雪花丰富，烤后口感脆爽。它不在《食肉零售品质基准》规定的猪肉7个部位之内；按猪分割肉交易规格，脸颊（jowl）部分随“かた”（肩）一起修整。"
      en: "Named for its tuna-toro-like richness; it is read tontoro and also called pī-toro. Each pig yields only one piece per side. Moderately fatty and well marbled, it grills to a crisp, crunchy bite. It is not one of the seven retail pork cuts, and under the wholesale standard the jowl is trimmed as part of the shoulder (kata)."
    sources:
      - title: "農林水産省 aff 2020年9月号「豚の部位図鑑」（監修：日本食肉消費総合センター）"
