        url: https://www.gyukaku.ne.jp/menu/menu-menmeshi.php
      - title: 焼肉きんぐ 単品メニュー「ご飯」
        url: https://www.yakiniku-king.jp/menu_all/tanpin/rice/
  - id: reimen
    ja: 冷麺
    ruby: "{冷麺|れいめん}"
    kana: れいめん
    romaji: reimen
    mean:
      ja: 冷たいスープの麺料理
      zh: 冷面
      en: Cold noodles (naengmyeon)
    part:
      ja: 朝鮮半島の冷麺に由来する、コシの強い麺を冷たいスープで食べる料理
      zh: 源自朝鲜半岛冷面，筋道的面条配冰凉的汤
      en: Korean-style chewy noodles served in a chilled broth
    note:
      ja: 朝鮮半島の冷麺はそば粉とでんぷんの生地を型から押し出してゆでる麺で、もとは12月の時食としてオンドルの部屋で涼を味わう冬の料理だった（平壌の水冷麺、咸興のビビン冷麺が有名）。盛岡冷麺は1954年創業の盛岡の焼肉店「食道園」が発祥とされ、そば粉を使わず小麦粉と馬鈴薯でんぷんで麺を作り、わんこそば・じゃじゃ麺と並ぶ盛岡三大麺に数えられる。食道園では辛さを特辛・辛口・普通・別辛の4段階から選ぶ。なお関西では「冷麺」が冷やし中華を指すことがある。
      zh: 朝鲜半岛的冷面是把荞麦粉加淀粉的面团从模具中压出、再煮熟的面，原本是十二月在暖炕（温突）屋里吃来感受凉意的冬季时令食物（平壤水冷面、咸兴拌冷面最有名）。盛冈冷面据说发源于1954年开业的盛冈烤肉店「食道園」，面条不用荞麦粉，而用小麦粉和马铃薯淀粉制成，与碗子荞麦面、炸酱面并称“盛冈三大面”。食道園的辣度分特辣、辣、普通、辣料另上（「別辛」）四档。另外在关西，「冷麺」有时指中式凉面（冷やし中華）。
      en: "Korean naengmyeon uses noodles pressed from a buckwheat-and-starch dough through a mould and boiled; it began as a December seasonal dish, eaten for its chill in ondol-heated rooms (Pyongyang’s brothy and Hamhung’s spicy mixed versions are the classics). Morioka reimen traces to Shokudōen, a yakiniku restaurant founded in Morioka in 1954; its noodles use wheat flour and potato starch instead of buckwheat, and it counts among Morioka’s “three great noodles” with wanko soba and jajamen. Shokudōen lets you choose the heat: extra hot, hot, regular, or betsukara (spice served on the side). In Kansai, reimen can also mean hiyashi chūka, Chinese-style chilled ramen."
    sources:
      - title: 日本大百科全書・デジタル大辞泉・精選版 日本国語大辞典「冷麺」（コトバンク）
        url: https://kotobank.jp/word/%E5%86%B7%E9%BA%BA-661227
