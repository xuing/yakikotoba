order: 4
ja: サイド
zh: 饭面小菜
en: Sides
items:
  - id: rice
    ja: ライス
    kana: らいす
    romaji: raisu
    mean:
      ja: 白いご飯
      zh: 白米饭
      en: Plain rice
    part:
      ja: 器に盛った白飯。焼肉店では肉とは別に単品で頼む
      zh: 盛在碗里的白米饭，在烤肉店要另外单点
      en: A bowl of plain white rice, ordered separately from the meat
    note:
      ja: 英語の rice から。日本語の「ライス」は米・米飯のことで、特に西洋料理に添える米飯をいい、1877年の『米欧回覧実記』に用例がある（日本国語大辞典）。焼肉チェーンには「ごはん」と書く店もあり、牛角は「ごはん」「カルビ専用ごはん」、焼肉きんぐは「ごはん」を小・中・特盛の3サイズで出している。
      zh: 来自英语 rice。日语的「ライス」指米或米饭，尤其指配西餐的米饭，1877年的《米欧回览实记》中已有用例（《日本国语大辞典》）。也有烤肉连锁店在菜单上写「ごはん」：牛角写「ごはん」和「カルビ専用ごはん」（配五花肉专用饭），焼肉きんぐ的「ごはん」分小、中、特大三种份量。
      en: "From English “rice”: in Japanese, raisu means rice or cooked rice, especially rice served with Western-style dishes, and is attested as early as 1877 in the Bei-Ō Kairan Jikki (Nihon Kokugo Daijiten). Some yakiniku chains write gohan instead: Gyū-Kaku lists gohan and a karubi-senyō gohan (rice meant for karubi), and Yakiniku King serves gohan in small, medium and extra-large."
    sources:
      - title: 精選版 日本国語大辞典・デジタル大辞泉「ライス」（コトバンク）
        url: https://kotobank.jp/word/%E3%82%89%E3%81%84%E3%81%99-2572126
