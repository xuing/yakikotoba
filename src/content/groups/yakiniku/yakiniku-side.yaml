        url: https://www.yakiniku-king.jp/menu_all/tanpin/rice/
  - id: kimuchi
    ja: キムチ
    kana: きむち
    romaji: kimuchi
    mean:
      ja: 朝鮮半島の漬物
      zh: 韩式泡菜
      en: Kimchi
    part:
      ja: 塩漬けした白菜・大根・きゅうりなどを、唐辛子・にんにく・塩辛などの薬味で漬け込んだ発酵漬物
      zh: 把盐渍过的白菜、萝卜、黄瓜等，用辣椒、大蒜、鱼虾酱等调料腌制发酵而成
      en: Salted cabbage, radish, cucumber and the like, fermented with chilli, garlic and salted seafood
    note:
      ja: 朝鮮半島の漬物の総称で数十種あり、白菜のペチュキムチ、大根を角切りにしたカクテキ（깍두기）、きゅうりのオイキムチなどがある。唐辛子が使われるようになったのは17世紀後半からで、それ以前は山椒・生姜・にんにくを使う、主に塩味だけのものだった。漬けるときに重石はせず、日本の漬物のように洗って絞ることもしない。初冬に越冬用のキムチを一斉に漬ける「キムジャン」は、2013年にユネスコ無形文化遺産に登録された。
      zh: 是朝鲜半岛腌菜的总称，有几十种，如白菜做的「ペチュキムチ」、萝卜切块的「カクテキ」（깍두기）、黄瓜做的「オイキムチ」。17世纪后半叶才开始用辣椒，此前用山椒、生姜、大蒜，基本只有咸味。腌制时不压石头，也不像日本咸菜那样洗净拧干。初冬家家集中腌制过冬泡菜的「김장」（越冬泡菜），2013年列入联合国教科文组织人类非物质文化遗产代表作名录。
      en: "The umbrella term for Korean pickles, with dozens of kinds: baechu kimchi (napa cabbage), kakuteki (kkakdugi, cubed radish) and oi kimchi (cucumber) among them. Chilli only came into use in the late 17th century; before that kimchi was a mainly salty pickle flavoured with sansho, ginger and garlic. No weight is pressed on it, and unlike Japanese pickles it is not rinsed and wrung out. Kimjang, the communal early-winter making of kimchi for the cold months, was inscribed on UNESCO’s Intangible Cultural Heritage list in 2013."
    sources:
      - title: 日本大百科全書・改訂新版 世界大百科事典・デジタル大辞泉「キムチ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%8D%E3%82%80%E3%81%A1-3149026
      - title: 精選版 日本国語大辞典「カクテキ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%8B%E3%81%8F%E3%81%A6%E3%81%8D-3209164
      - title: 国立国語院『標準国語大辞典』「깍두기」
        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EA%B9%8D%EB%91%90%EA%B8%B0
      - title: UNESCO “Kimjang, making and sharing kimchi in the Republic of Korea”
        url: https://ich.unesco.org/en/RL/kimjang-making-and-sharing-kimchi-in-the-republic-of-korea-00881
  - id: namuru
    ja: ナムル
    kana: なむる
    romaji: namuru
    mean:
      ja: 野菜の和え物（朝鮮料理）
      zh: 韩式凉拌菜
      en: Namul (seasoned vegetables)
    part:
      ja: もやし・ほうれん草・ぜんまいなどをゆでるなどして、ごま油・醤油・にんにくなどで和えたもの
      zh: 豆芽、菠菜、蕨菜等焯水后，用香油、酱油、蒜等拌成
      en: Bean sprouts, spinach, bracken and the like, blanched and dressed with sesame oil, soy sauce and garlic
    note:
      ja: 朝鮮語 나물 は、食べられる草や葉そのものと、それをゆでる・炒める・生のまま味付けして和えた料理の両方を指す。生野菜を和えた「生菜（センチェ）」と、湯通ししてから和えた「熟菜（スクチェ）」がある。ほうれん草・大豆もやし・ぜんまいの3種を盛り合わせることが多く、ビビンバの具にもなる。韓国の標準国語大辞典の用例には「正月の大満月（旧暦1月15日）には五穀飯と9種類のナムルを食べる」とある。
      zh: 韩语 나물 既指可食用的野菜、树叶本身，也指把它们焯、炒或生着调味拌成的菜。分生拌的「生菜」（センチェ）和焯水后再拌的「熟菜」（スクチェ）。常见菠菜、黄豆芽、蕨菜三样拼在一起，也是拌饭的配料。韩国《标准国语大辞典》的例句说：“正月十五（大满月）吃五谷饭和九种拌菜。”
      en: "Korean namul means both edible greens themselves and the dish made by boiling, stir-frying or simply seasoning them. There are saengchae, dressed raw, and sukchae, blanched first. A trio of spinach, soybean sprouts and bracken is the usual assortment, and namul also tops bibimbap. An example sentence in the Standard Korean Language Dictionary reads: “On the first full moon of the lunar year we eat five-grain rice and nine kinds of namul.”"
    sources:
      - title: 国立国語院『標準国語大辞典』「나물」
        url: https://stdict.korean.go.kr/search/searchView.do?word_no=409778&searchKeywordTo=3
      - title: デジタル大辞泉・精選版 日本国語大辞典・世界の料理がわかる辞典「ナムル」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%AA%E3%82%80%E3%82%8B-3215386
  - id: sanchu
    ja: サンチュ
    kana: さんちゅ
    romaji: sanchu
    mean:
      ja: 焼肉を包む葉野菜
      zh: 包肉用的生菜
      en: Leaf lettuce for wraps
    part:
      ja: 結球しないチシャ（レタスの仲間）の栽培品種。葉で焼肉などを包んで食べる
      zh: 不结球的莴苣（生菜类）品种，用叶子包着烤肉吃
      en: A non-heading lettuce variety whose leaves are used to wrap grilled meat
    note:
      ja: 朝鮮語 상추（サンチュ）はチシャ（レタス）のことで、焼肉などを包んで食べることから日本では「包み菜」ともいう。下葉から順に掻き取って収穫する「掻きちしゃ（チマサンチュ）」の類で、日本にも古くからあった。熱い肉を包んでも葉がしんなりしにくく味の相性もよいため、焼肉ブームとともに人気が出た（日本食肉消費総合センター）。朝鮮語でご飯や肉を葉で包んで食べる料理を「サム（쌈）」といい、一緒に包む甘辛い合わせ味噌を「サムジャン」と呼ぶ。
      zh: 韩语 상추 就是莴苣（生菜）；因为用来包烤肉吃，日本也叫「包み菜」（包菜叶）。属于从下部叶片开始逐片掰取收获的「掻きちしゃ」（チマサンチュ）一类，日本很早就有。包热肉叶子也不容易蔫，和烤肉味道也相配，随着烤肉热潮流行起来（日本食肉消费综合中心）。韩语把用菜叶包饭、包肉吃叫「쌈」（ssam），一起包进去的甜辣拌酱叫「쌈장」（サムジャン）。
      en: Korean sangchu means lettuce; because it is used to wrap yakiniku, Japanese also calls it tsutsumi-na (“wrapping greens”). It is a leaf-picking kaki-chisha (chima sangchu), harvested a leaf at a time from the bottom, and has long existed in Japan too. Its leaves stay crisp around hot meat and suit its flavour, so it caught on with the yakiniku boom (Japan Meat Information Service Center). Wrapping rice or meat in leaves is ssam in Korean, and the sweet-spicy paste tucked in with it is ssamjang.
    sources:
      - title: デジタル大辞泉「サンチュ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%95%E3%82%93%E3%81%A1%E3%82%86-3211452
      - title: デジタル大辞泉「掻き萵苣」（コトバンク）
        url: https://kotobank.jp/word/%E6%8E%BB%E3%81%8D%E8%90%B5%E8%8B%A3-670708
