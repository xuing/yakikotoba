  - id: bibinba
    ja: ビビンバ
    kana: びびんば
    romaji: bibinba
    mean:
      ja: 混ぜご飯（朝鮮料理）
      zh: 拌饭
      en: Bibimbap (mixed rice)
    part:
      ja: ご飯にナムル・焼き肉・卵などをのせ、コチュジャンを加えてよく混ぜて食べる料理
      zh: 米饭上铺凉拌菜、烤肉、鸡蛋等，加辣椒酱拌匀再吃
      en: Rice topped with namul, grilled meat and egg, mixed with gochujang before eating
    note:
      ja: 朝鮮語 비빔밥（ピビムパプ）の「ピビム」は「混ぜる」、「パプ」は「飯」の意で、日本語ではビビンバのほかピビンパとも書く。ご飯の上に焼き肉や数種のナムル、薄焼き卵の細切りなどをのせ、コチュジャンを好みの量加えてよく混ぜてから食べる（日本食肉消費総合センター）。石焼きビビンバは熱した石の器で出し、卵黄をのせることが多く、器の熱で少し焦げたご飯の風味を楽しむ。韓国の標準国語大辞典は類義語として「골동반（骨董飯）」を挙げている。
      zh: 韩语 비빔밥 中，“비빔”是“拌”，“밥”是“饭”；日语写作ビビンバ，也写作ピビンパ。在米饭上放烤肉、几种凉拌菜（ナムル）和蛋丝等，按口味加辣椒酱（コチュジャン）拌匀后食用（日本食肉消费综合中心）。石锅拌饭（石焼きビビンバ）用烧热的石碗盛装，常放一个蛋黄，享受碗壁把米饭烤出的焦香。韩国《标准国语大辞典》把「골동반（骨董饭）」列为它的同义词。
      en: In Korean bibimbap, bibim means “mixing” and bap “rice”; Japanese writes it bibinba or pibinpa. Rice is topped with grilled meat, several kinds of namul and strips of thin omelette, then mixed well with gochujang to taste (Japan Meat Information Service Center). Ishiyaki bibinba comes in a heated stone bowl, often crowned with an egg yolk, and is prized for the rice the hot bowl scorches. Korea’s Standard Korean Language Dictionary gives goldongban (骨董飯) as a synonym.
    sources:
      - title: 世界の料理がわかる辞典・デジタル大辞泉・精選版 日本国語大辞典「ビビンバ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%B3%E3%81%B3%E3%82%93%E3%81%B0-3217047
      - title: 日本食肉消費総合センター 用語集「ビビンバ」
        url: https://www.jmi.or.jp/info/word/ha/ha_074.html
      - title: 世界の料理がわかる辞典「石焼きビビンバ」（コトバンク）
        url: https://kotobank.jp/word/%E7%9F%B3%E7%84%BC%E3%81%8D%E3%81%B3%E3%81%B3%E3%82%93%E3%81%B0-1494193
      - title: 国立国語院『標準国語大辞典』「비빔밥」
        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EB%B9%84%EB%B9%94%EB%B0%A5
  - id: kuppa
    ja: クッパ
    kana: くっぱ
    romaji: kuppa
    mean:
      ja: スープご飯（朝鮮料理）
      zh: 汤饭
      en: Gukbap (rice in soup)
    part:
      ja: 肉や野菜を煮込んだ熱いスープにご飯を入れた料理
      zh: 把米饭泡进炖了肉和蔬菜的热汤里
      en: Rice served in a hot soup of meat and vegetables
    note:
      ja: 朝鮮語 국밥（クッパプ）で、「クッ」は汁物、「パプ」はご飯の意。韓国の標準国語大辞典は「煮たスープにご飯を入れたもの、またはスープにご飯を入れてから煮たもの」と定義している。焼肉チェーンでは「たまごクッパ」「カルビクッパ」（牛角）、「玉子クッパ」「旨辛カルビクッパ」（焼肉きんぐ）のように具の名を冠して出す。
      zh: 韩语 국밥，“국”是汤，“밥”是饭。韩国《标准国语大辞典》的定义是“把饭放进煮好的汤里，或者先把饭放进汤里再煮”的食物。在烤肉连锁店，名字前常冠以配料，如牛角的「たまごクッパ」（鸡蛋汤饭）、「カルビクッパ」（牛五花汤饭），焼肉きんぐ的「旨辛カルビクッパ」（香辣牛五花汤饭）。
      en: "Korean gukbap: guk means “soup” and bap “rice”. The Standard Korean Language Dictionary defines it as rice put into hot soup, or rice simmered in the soup. Yakiniku chains name it after what goes in—Gyū-Kaku’s tamago kuppa (egg) and karubi kuppa, Yakiniku King’s spicy umakara karubi kuppa."
    sources:
      - title: 世界の料理がわかる辞典・デジタル大辞泉「クッパ」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%8F%E3%81%A4%E3%81%B1-3210075
