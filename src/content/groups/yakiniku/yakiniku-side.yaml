        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EC%83%81%EC%B6%94
      - title: 国立国語院『標準国語大辞典』「쌈」
        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EC%8C%88
      - title: 世界の料理がわかる辞典「サムジャン」（コトバンク）
        url: https://kotobank.jp/word/%E3%81%95%E3%82%80%E3%81%98%E3%82%84%E3%82%93-1494991
