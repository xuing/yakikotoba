  - id: karubi
    ja: カルビ
    kana: かるび
    romaji: karubi
    mean:
      ja: "牛のばら肉（あばら肉）"
      zh: "牛五花（牛小排）"
      en: "Short rib / belly (kalbi)"
    part:
      ja: "ばら（あばら骨まわりの腹側の肉）。焼肉では主に後ろ寄りの「ともばら」"
      zh: "五花，即肋骨周围的腹部肉；烤肉用的主要是靠后的“ともばら”"
      en: "The belly around the ribs (bara); for yakiniku mainly the rear belly, tomo-bara"
    note:
      ja: "朝鮮語で「あばら骨（の肉）」を意味する갈비（カルビ）に由来し、日本では主にばら肉を指すが、辞書には「ばら肉以外の部位で、脂身の多いものをさすこともある」とある。全国焼肉協会によれば、戦後の焼肉店のメニューは当初「ロース」と「カルビ」の2つだけで、カルビには部位としての厳密な表示基準がない。肋骨の間の肉は「ゲタカルビ（中落ち）」、骨付きショートリブを骨ごと約8mmに切ったものは「L.A.カルビ」と呼ばれる。日本食品標準成分表では、和牛ばら（脂身つき・生）の脂質は100gあたり50.0gで、輸入牛ばらの32.9gを大きく上回る。"
      zh: "源自朝鲜语“갈비”（肋骨、肋排肉）；在日本主要指五花肉，但词典也注明有时指“五花以外、脂肪多的部位”。据日本全国烧肉协会介绍，战后烤肉店最初的菜单只有“ロース”和“カルビ”两样，而“カルビ”作为部位名并没有严格的标示标准。肋骨之间的肉叫“ゲタカルビ”（中落ち），带骨牛小排连骨切成约8毫米厚的叫“L.A.カルビ”。日本食品标准成分表中，和牛五花（带脂、生）每100克含脂质50.0克，远高于进口牛五花的32.9克。"
      en: "From Korean galbi (갈비), “rib (meat)”: in Japan it usually means belly meat, though dictionaries note it can also mean a fatty cut from elsewhere. According to Japan’s national yakiniku association, post-war yakiniku menus first offered only rōsu and karubi, and karubi has no strict labelling definition as a cut. Meat from between the ribs is geta-karubi (nakaochi), and bone-in short rib sawn about 8 mm thick across the bones is “L.A. karubi”. Raw wagyu belly with its fat contains 50.0 g of fat per 100 g, far above the 32.9 g of imported beef belly."
    sources:
      - title: "農林水産省 aff 2020年9月号「牛の部位図鑑」（監修：日本食肉消費総合センター）"
        url: "https://www.maff.go.jp/j/pr/aff/2009/pdf/aff2009_02_poster01.pdf"
