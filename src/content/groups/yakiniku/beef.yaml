  - id: ichibo
    ja: イチボ
    kana: いちぼ
    romaji: ichibo
    mean:
      ja: "牛の尻（腰骨付近）の肉"
      zh: "牛臀肉（近腰骨处）"
      en: "Rump cap"
    part:
      ja: "ももの臀部、腰骨付近の部分。部分肉では「らんいち」に含まれる"
      zh: "后腿的臀部、腰骨附近；在分割肉规格里属于“らんいち”"
      en: "The buttock end of the hindquarter, near the hip bone; part of the ran-ichi primal"
    note:
      ja: "英語の aitchbone（牛の腰骨）に由来し、村井弦斎『食道楽』（1903年）に「俗に牛肉屋でイチボと云ふのは腰の三角肉で」とある。部分によって肉質が違い、サーロイン側は霜降りが多く柔らかいため焼肉に向き、外もも側は筋肉質で硬めだが赤身と霜降りのバランスがよい。もも肉なのにサーロインに似た味わいで「もも肉のロース」とも呼ばれ、米国のトップサーロインキャップ（クーレット）はイチボの一部にあたる。なお日本食肉消費総合センターは、らんぷの関西での呼び名として「らむ」「いちぼ」を挙げている。"
      zh: "名称来自英语 aitchbone（牛的腰骨）；1903年村井弦斋的《食道乐》里已写道：“肉铺俗称的イチボ，就是腰部的三角肉。”不同位置肉质不同：靠西冷一侧雪花多、柔软，适合烤肉；靠外侧后腿（そともも）一侧肌肉多、偏硬，但瘦肉和雪花比例均衡。虽是后腿肉，味道却像西冷，被称为“后腿里的ロース”；美国的 top sirloin cap（coulotte）相当于它的一部分。另据日本食肉消费综合中心的资料，关西把臀腰肉“らんぷ”叫作“らむ”或“いちぼ”。"
      en: "From English “aitchbone”, the rump bone; Murai Gensai’s Kuidōraku (1903) already notes that “what butchers commonly call ichibo is the triangular meat of the hip”. Texture varies across the cut: the sirloin side is well marbled and tender, ideal for yakiniku, while the outside-round side is more muscular and firmer, with a good balance of lean and marbling. Though it is hindquarter (momo) meat it tastes like sirloin, earning the nickname “the rōsu of the round”, and the American top sirloin cap (coulotte) is part of it. The Japan Meat Information Service Center lists ramu and ichibo as Kansai names for the whole rump (ranpu)."
    sources:
      - title: "コトバンク「イチボ」（デジタル大辞泉・精選版 日本国語大辞典）"
