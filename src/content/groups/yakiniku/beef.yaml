  - id: sagari
    ja: サガリ
    kana: さがり
    romaji: sagari
    mean:
      ja: "牛の横隔膜（腰椎側）"
      zh: "牛横膈膜肉（腰椎侧）"
      en: "Hanger steak (hanging tender)"
    part:
      ja: "横隔膜のうち、背骨（腰椎）に接する部分"
      zh: "横膈膜中贴着脊柱（腰椎）的部分"
      en: "The part of the diaphragm attached to the lumbar spine"
    note:
      ja: "ハラミと同じ横隔膜の一部で、見た目はほとんど同じだが脂が少なめであっさりしており、肉質は柔らかい。別名「ビワハラミ」。輸入名はハンギングテンダーで、米国産は背骨から腰椎にかけて内臓を囲む18cmほどの丸く太い筋肉として流通し、内臓扱いながら肉と同等の価値があるとされる。ハラミと区別せずに「ハラミ」と呼ぶこともある。"
      zh: "和ハラミ同属横膈膜，外观几乎一样，但脂肪较少、味道清爽，肉质柔嫩。别名“ビワハラミ”。进口货叫 hanging tender，美国产的是从脊椎到腰椎、环绕内脏的一段约18厘米、又圆又粗的肌肉，虽然归为内脏，却被视为与正肉同等的食材。有时也不加区分，直接叫“ハラミ”。"
      en: "Part of the same diaphragm as harami and almost identical in looks, but leaner and milder, with a tender texture; it is also called biwa-harami. Imported, it is the hanging tender: a thick, round muscle of about 18 cm that runs from the spine to the lumbar vertebrae around the organs, classed as offal but valued like muscle meat. It is sometimes simply sold as harami."
    sources:
