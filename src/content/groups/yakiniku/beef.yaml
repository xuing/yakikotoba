order: 1
ja: 牛
zh: 牛肉
en: Beef
note:
  ja: "卸売の「牛部分肉取引規格」は半丸枝肉をネック・かた・かたロース・かたばら・ヒレ・リブロース・サーロイン・ともばら・うちもも・しんたま・らんいち・そともも・すねの13部位に分け、小売表示では「食肉小売品質基準」の9部位にネック・すねを加えた11部位が使われる。ミスジ・ザブトン・イチボ・三角バラなどはこれをさらに細かく分けた呼び名で、焼肉店のメニュー名は同基準の対象外のため、同じ名前でも店によって指す範囲が違うことがある。タン・ハラミ・サガリは正肉ではなく副生物（内臓）に分類される。"
  zh: "批发用的《牛分割肉交易规格》把半边胴体分成ネック、かた、かたロース、かたばら、ヒレ、リブロース、サーロイン、ともばら、うちもも、しんたま、らんいち、そともも、すね共13块；零售标示则用《食肉零售品质基准》的9个部位再加上ネック（颈肉）和すね（腱子），共11个。ミスジ、ザブトン、イチボ、三角バラ等是在此基础上进一步细分的叫法；烤肉店的菜单名不受该基准约束，同一个名字在不同店里所指的范围可能不同。タン、ハラミ、サガリ不算正肉，而是副产物（内脏）。"
  en: "Japan’s wholesale beef standard divides a side into 13 primals (neck, kata, kata-rōsu, kata-bara, hire, rib-rōsu, sāroin, tomo-bara, uchimomo, shintama, ran-ichi, sotomomo, sune); retail labels use the nine cuts of the Retail Meat Quality Standard plus neck and shin, 11 in all. Names such as misuji, zabuton, ichibo and sankaku-bara are finer subdivisions, and restaurant menus fall outside the retail standard, so the same name can cover different meat from shop to shop. Tongue, harami and sagari are classed as by-products (offal), not muscle meat."
items:
  - id: tan
    ja: タン
    kana: たん
    romaji: tan
    mean:
      ja: "牛の舌"
      zh: "牛舌"
      en: "Beef tongue"
    part:
      ja: "舌。根元側を「タン元」、先端を「タン先」と呼ぶ"
      zh: "舌头；舌根一侧叫“タン元”，舌尖一侧叫“タン先”"
      en: "The tongue; the root end is tan-moto, the tip tan-saki"
    note:
      ja: "英語の tongue に由来し、弾力のあるサクッとした歯ごたえで、根元ほど柔らかく舌先ほど硬い。日本食品標準成分表では「副生物」に分類され、生100gあたりの脂質は31.8g。焼肉では塩で焼いてレモンを添える「タン塩」が最初の一皿の定番で、一説に1976年開業の叙々苑六本木1号店で、卸業者の提案から生まれたメニューとされる。厚切りを炭火で焼く「牛たん焼き」は仙台発祥で、1948年（昭和23年）に最初の専門店ができ、焼肉店の2〜3mmに対して1〜2cmの厚さで出される。"
      zh: "名称来自英语 tongue；口感有弹性、脆嫩，越靠舌根越软，越近舌尖越硬。日本食品标准成分表把它归入“副产物”，生的每100克含脂质31.8克。烤肉店里第一盘通常点撒盐烤、配柠檬的“タン塩”（盐烤牛舌）；一说这道菜诞生于1976年开业的叙叙苑六本木1号店，最初是肉品批发商的提议。厚切后用炭火烤的“牛舌烧”（牛たん焼き）起源于仙台，1948年出现第一家专门店；一般烤肉店切2—3毫米，仙台则切成1—2厘米厚。"
      en: "From English “tongue”; it has a springy, crisp bite, tender at the root and firmer towards the tip. Japan’s food composition tables class it as a by-product (offal), with 31.8 g of fat per 100 g raw. The customary first order at yakiniku is tan-shio, tongue grilled with salt and served with lemon; one account says it began at Jojoen’s first restaurant in Roppongi, opened in 1976, on a meat wholesaler’s suggestion. Thick-cut, charcoal-grilled gyūtan-yaki comes from Sendai, where the first specialist shop opened in 1948; slices there are 1–2 cm thick, against the usual 2–3 mm at yakiniku restaurants."
    sources:
      - title: "農林水産省 aff 2020年9月号「牛の部位図鑑」（監修：日本食肉消費総合センター）"
