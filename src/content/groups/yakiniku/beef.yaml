        url: "https://americanmeat.jp/trd/publications/book/pdf/new_cut_guide_2026.pdf"
      - title: "米国食肉輸出連合会（USMEF）「赤身ステーキを強化！ショルダークロッドの活用」"
        url: "https://americanmeat.jp/trd/publications/book/pdf/shoulder_clod.pdf"

  - id: zabuton
    ja: ザブトン
    kana: ざぶとん
    romaji: zabuton
    mean:
      ja: "牛の肩ロースの一部"
      zh: "上脑里的雪花块（座垫肉）"
      en: "Chuck flap"
    part:
      ja: "かたロースのうち、あばら骨側の部分"
      zh: "上脑（かたロース）中靠肋骨的一侧"
      en: "The rib side of the chuck roll (kata-rōsu)"
    note:
      ja: "四角い形に切り出せることから座布団にたとえた名。かたロースの中でもしっかり霜降りが入る部位で、焼肉店では「特上ロース」や「特上カルビ」として出されることもある。米国産ではかたロース（チャックアイロール）を「カタロース芯」と「チャックフラップ（ザブトン）」などに分割し、ザブトンは全体に均一にサシが入るが、途中で繊維の向きが横から縦に変わる。"
      zh: "因为能切成方方正正的一块，像日本的坐垫（座布団）而得名。它是上脑里雪花分布得很充分的部位，烤肉店有时把它当作“特上ロース”或“特上カルビ”来卖。美国产上脑卷（chuck eye roll）会分成“上脑芯”和 chuck flap（即ザブトン）等块；这块雪花分布均匀，但肌纤维的走向中途由横转竖。"
      en: "Named after the square floor cushion (zabuton), because it can be cut out as a neat square block. A heavily marbled part of the chuck roll, it is sometimes served as tokujō rōsu or tokujō karubi (premium loin or kalbi). US packers split the chuck eye roll into the eye (kata-rōsu shin) and the chuck flap, i.e. the zabuton, which is evenly marbled but has a grain that turns from horizontal to vertical partway along."
    sources:
      - title: "農畜産業振興機構「【まめ知識】牛肉の「トウガラシ」「ザブトン」「ネクタイ」ってなあに？」（2019年）"
