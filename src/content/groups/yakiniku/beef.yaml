  - id: rosu
    ja: ロース
    kana: ろーす
    romaji: rōsu
    mean:
      ja: "牛の背中の肉"
      zh: "牛背脊肉（上脑、眼肉、西冷一带）"
      en: "Loin (back meat)"
    part:
      ja: "背中の肉。首側からかたロース・リブロース・サーロインと続く"
      zh: "背部的肉，从颈部往后依次是上脑（かたロース）、眼肉（リブロース）、西冷（サーロイン）"
      en: "The back muscles: from the neck end, chuck roll (kata-rōsu), rib loin (rib-rōsu) and sirloin (sāroin)"
    note:
      ja: "英語の roast に由来し「ローストに適する肉」の意で、明治初期の仮名垣魯文『安愚楽鍋』（1871〜72年）には「ラウス」の形で見える。牛部分肉取引規格では、ネックとかたロースを第6〜7頸椎の間、リブロースとサーロインを第10〜11胸椎の間で切り分け、関西ではかたロースを「くらした（鞍下）」、リブロースを単に「ロース」と呼ぶ。焼肉業界では「ロース」を赤身肉の意味で使う慣行があり、2010年10月、消費者庁はもも肉などを「ロース」と表示しないよう業界団体に求めた。小売店はすでに1977年の食肉小売品質基準により、「ロース」と表示できるのをサーロインやリブロースなどロース系の部位に限られている。"
      zh: "来自英语 roast，意为“适合烤制的肉”；明治初期假名垣鲁文的《安愚乐锅》（1871—72年）里写作“ラウス”。按日本《牛分割肉交易规格》，颈肉与上脑在第6、7颈椎之间分开，眼肉与西冷在第10、11胸椎之间分开；关西把上脑叫“くらした”（鞍下），把眼肉直接叫“ロース”。烤肉业界一向有把瘦肉统称“ロース”的惯例，2010年10月日本消费者厅要求行业团体不要再把牛腿肉等标成“ロース”。零售店早在1977年就受《食肉零售品质基准》约束，只有西冷、眼肉等背脊部位才能标“ロース”。"
      en: "From English “roast”, meat fit for roasting; it appears as rausu in Kanagaki Robun’s Aguranabe (1871–72). The wholesale beef standard separates the neck from the chuck roll between the 6th and 7th cervical vertebrae and the rib loin from the sirloin between the 10th and 11th thoracic vertebrae; in Kansai the chuck roll is called kurashita (“under the saddle”) and the rib loin simply rōsu. Yakiniku restaurants long used rōsu to mean lean meat in general, and in October 2010 the Consumer Affairs Agency asked the trade to stop labelling round (momo) and other cuts as rōsu. Retailers had been bound since 1977 by the Retail Meat Quality Standard to use the name only for loin cuts such as sirloin and rib loin."
    sources:
      - title: "コトバンク「ロース」（デジタル大辞泉・精選版 日本国語大辞典・百科事典マイペディア）"
        url: "https://kotobank.jp/word/%E3%82%8D%E3%83%BC%E3%81%99-3176559"
      - title: "日本食肉格付協会「牛部分肉取引規格」"
        url: "https://www.jmga.or.jp/standard/beef-partial/"
      - title: "日本食肉消費総合センター「部位別料理 -牛-」（関西名）"
        url: "https://www.jmi.or.jp/recipe/apart/cooking_apart1.html"
      - title: "PRESIDENT Online（松浦達也）「「ロース、サーロイン、モモ、カルビを高い順に並べよ」本当に焼肉が好きな人ほど、この問題に困惑する理由」（2022年7月10日）"
        url: "https://president.jp/articles/-/59316"
      - title: "J-CASTニュース「「ロース」と「赤身」違います 焼肉メニューで消費者庁が「指導」」（2010年10月14日）"
        url: "https://www.j-cast.com/2010/10/14078222.html?p=all"

  - id: harami
    ja: ハラミ
    kana: はらみ
    romaji: harami
    mean:
      ja: "牛の横隔膜（肋骨側）"
      zh: "牛横膈膜肉（肋骨侧）"
      en: "Outside skirt (diaphragm)"
    part:
      ja: "横隔膜のうち、肋骨に接する腹側の平たい部分"
      zh: "横膈膜中贴着肋骨、靠腹侧的扁平部分"
      en: "The flat, rib-side (costal) part of the diaphragm"
    note:
      ja: "漢字では「腹身」と書く。肉厚で柔らかく、脂もほどよく入って赤身肉に見えるが内臓（副生物）扱いで、日本食品標準成分表でも「うし［副生物］横隔膜」として載り、生100gあたりの脂質は27.3g。輸入名はアウトサイドスカートで、米国産は幅10cmほどの平たい長方形の形で入ってくる。腰椎側のサガリと区別せず、まとめて「ハラミ」と呼ぶこともある。"
      zh: "汉字写作“腹身”。肉厚柔嫩、脂肪适中，看起来像红肉，其实属于内脏（副产物）；日本食品标准成分表也把它列为“牛［副产物］横膈膜”，生的每100克含脂质27.3克。进口货叫 outside skirt，美国产的是宽约10厘米的扁平长条。有时也不区分靠腰椎的“サガリ”，统称“ハラミ”。"
      en: "Written 腹身, “belly meat”, in kanji. Thick, tender and moderately fatty, it looks like red meat but is classed as offal: Japan’s food composition tables list it as beef by-product “diaphragm”, with 27.3 g of fat per 100 g raw. Imported, it is the outside skirt, which arrives from the US as a flat strip about 10 cm wide. The lumbar-side sagari is sometimes sold under the same name."
    sources:
