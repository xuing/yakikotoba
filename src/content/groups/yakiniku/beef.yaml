  - id: misuji
    ja: ミスジ
    kana: みすじ
    romaji: misuji
    mean:
      ja: "牛の肩甲骨まわりの肉"
      zh: "板腱（牛肩胛肉）"
      en: "Top blade (oyster blade)"
    part:
      ja: "かた（うで）の一部で、肩甲骨に沿う筋肉"
      zh: "肩部（前腿上方）的一部分，贴着肩胛骨的肌肉"
      en: "Part of the shoulder clod (kata): the muscle lying along the shoulder blade"
    note:
      ja: "牛一頭から約3kgしか取れない希少部位で、米国では「トップブレード」と呼ばれる。肩まわりはよく動くため硬い部位が多いが、ミスジはあまり動かないので霜降りが入りやすく柔らかく、脂の口溶けがよい。肉塊の中心に太いスジが1本通り、先端側ほど霜降りが濃い。水分が少なく、焼きすぎるとパサつきやすい。"
      zh: "一头牛只能取约3公斤的稀有部位，美国叫 top blade。肩部肌肉活动多，大多偏硬，而这块很少活动，所以容易长出雪花，口感柔嫩，油脂入口即化。中间贯穿一条粗筋，越靠前端雪花越密。含水量少，烤过头容易发柴。"
      en: "A rare cut—only about 3 kg per animal—known in the US as the top blade. Most shoulder muscles work hard and are tough, but this one moves little, so it marbles readily and stays tender, with fat that melts easily. A thick sinew runs through the centre, and the marbling is heaviest at the tip end. It holds little moisture and dries out quickly if overcooked."
    sources:
      - title: "農林水産省 aff 2020年9月号「牛、豚、鶏の部位を徹底解説！お肉丸わかり図鑑」"
        url: "https://www.maff.go.jp/j/pr/aff/2009/spe1_02.html"
