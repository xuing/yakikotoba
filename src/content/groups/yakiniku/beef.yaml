        url: "https://kotobank.jp/word/%E8%85%B9%E8%BA%AB-605112"
      - title: "文部科学省「日本食品標準成分表（八訂）増補2023年」（うし［副生物］横隔膜）"
        url: "https://www.mext.go.jp/a_menu/syokuhinseibun/mext_00001.html"
