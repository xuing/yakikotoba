  - id: sankaku-bara
    ja: 三角バラ
    ruby: "{三角|さんかく}バラ"
    kana: さんかくばら
    romaji: sankaku bara
    mean:
      ja: "かたばらの三角形の部分"
      zh: "前腹三角五花"
      en: "Chuck short rib"
    part:
      ja: "かたばら（第6肋骨より前のばら）の一部"
      zh: "前腹五花（かたばら，第6肋骨以前的五花）的一部分"
      en: "Part of the forequarter belly (kata-bara), in front of the 6th rib"
    note:
      ja: "かたばらから三角形に切り出されることからの名で、ばら肉の中でも最上級の肉質とされる。きめが細かく美しい霜降りが入り、脂の甘みと赤身のうま味を同時に味わえる。米国産では第1〜5肋骨の間の肩バラからブリスケットを外した三角形の部分が「チャックリブ」として流通し、霜降りのカルビ用に使われる。"
      zh: "因从前腹五花（かたばら）上切成三角形而得名，被认为是五花里肉质最好的部分。肌理细腻、雪花漂亮，能同时吃到脂肪的甘甜和瘦肉的鲜味。美国产的对应部位叫 chuck rib：在第1至第5肋骨之间的肩部五花上去掉牛胸（brisket）后剩下的三角形块，多用来做雪花“カルビ”。"
      en: "Named for the triangle in which it is cut from the forequarter belly, it is rated the finest meat of the whole belly. Fine-grained and beautifully marbled, it delivers sweet fat and savoury lean in the same bite. The US equivalent, “chuck rib”, is the triangular piece left when the brisket is removed from the shoulder belly between ribs 1 and 5, and is cut for marbled karubi."
    sources:
      - title: "農林水産省 aff 2016年8月号 特集2「牛肉の部位図鑑」"
        url: "https://www.maff.go.jp/j/pr/aff/1608/spe2_02.html"
