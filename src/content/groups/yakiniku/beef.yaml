  - id: hire
    ja: ヒレ
    kana: ひれ
    romaji: hire
    mean:
      ja: "牛のヒレ肉"
      zh: "牛里脊（牛柳、菲力）"
      en: "Tenderloin (fillet)"
    part:
      ja: "腰の背骨（腰椎）の内側に、左右1本ずつある細長い肉"
      zh: "腰椎内侧左右各一条的细长肌肉"
      en: "A long, narrow muscle on the inner side of the lumbar spine, one on each side"
    note:
      ja: "フランス語の filet に由来し、関西では「ヘレ」とも呼び、村井弦斎『食道楽』（1903年）にすでに用例がある。脂肪が少なく非常に柔らかく、和牛ヒレ（赤肉・生）の脂質は100gあたり15.0gと、和牛リブロース（脂身つき・生）56.5gの約4分の1。牛部分肉取引規格では、片側1本のヒレを3.5kg以上なら「L」、未満なら「S」と区分する。中心部の「シャトーブリアン」は牛一頭から約600gしか取れず、名は19世紀フランスの作家・政治家シャトーブリアンにちなみ、彼の料理人が考案したとも、彼の好物だったからともいう。"
      zh: "来自法语 filet，关西也叫“ヘレ”，明治时期村井弦斋的小说《食道乐》（1903年）里已有用例。脂肪少、极嫩：和牛菲力（瘦肉、生）每100克脂质15.0克，约为和牛眼肉（带脂、生）56.5克的四分之一。按日本《牛分割肉交易规格》，单侧一条3.5公斤以上为“L”，不足为“S”。中心部分叫“シャトーブリアン”（夏多布里昂），一头牛只出约600克，名字来自19世纪法国作家、政治家夏多布里昂，一说是他的厨师所创，一说因为他最爱吃。"
      en: "From French filet, also called here (ヘレ) in Kansai; it already appears in Murai Gensai’s novel Kuidōraku (1903). Lean and very tender: raw wagyu fillet has 15.0 g of fat per 100 g, about a quarter of the 56.5 g in wagyu rib loin with its fat. The wholesale beef standard grades a single fillet from one side as L at 3.5 kg or more and S below that. The centre section, the chateaubriand, yields only about 600 g per animal; it is named after the 19th-century French writer and statesman Chateaubriand, either because his cook devised the dish or because it was his favourite."
    sources:
