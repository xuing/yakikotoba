order: 2
ja: ホルモン
zh: 内脏
en: Offal
note:
  ja: 牛の胃は4つあり、第一胃をミノ、第二胃をハチノス、第三胃をセンマイ、第四胃をギアラ（赤センマイ）と呼ぶ。業界では胃や腸など白っぽい内臓を「白物（しろもの）」、心臓や肝臓など赤っぽい内臓を「赤物（あかもの）」と呼び分けて扱う。
  zh: 牛有四个胃，日语依次叫ミノ（第一胃）、ハチノス（第二胃）、センマイ（第三胃）和ギアラ（第四胃，又叫“赤センマイ”）。行业里把胃、肠等发白的内脏叫「白物」，把心、肝等发红的内脏叫「赤物」，分开处理。
  en: "Cattle have four stomachs, called mino, hachinosu, senmai and giara (also aka-senmai, “red senmai”) in that order. The trade sorts offal into shiromono (“white things”: stomachs and intestines) and akamono (“red things”: heart, liver and the like)."
items:
  - id: horumon
    ja: ホルモン
    kana: ほるもん
    romaji: horumon
    mean:
      ja: 牛・豚などの食用内臓
      zh: 牛、猪等的可食用内脏
      en: Edible offal (beef, pork)
    part:
      ja: 枝肉と皮を除いた可食部（畜産副生物）の通称
      zh: 去掉胴体肉（枝肉）和皮之后剩下的可食部分（畜产副产品）的俗称
      en: Everyday name for the edible parts left once the carcass meat and hide are removed
    note:
      ja: 業界の統一名称は「畜産副生物」で、「ホルモン」「モツ」はもとは業界語であり、農林水産省の資料は小腸を「ホルモンの代名詞」、大腸を「ホルモンの代表的な存在」と紹介している。語源は医学用語の「ホルモン（独 Hormon）」で、1920年ごろには精のつく料理を「ホルモン料理」と呼んでおり、大阪の洋食店「北極星」の創業者・北橋茂男が内臓の意味で広めたとされる。大阪弁の「放るもん（捨てるもの）」に由来するという説は日本国語大辞典も「一説に」として載せるが、語が1920年ごろから使われていたことから俗説とみられ、広まったのは1970年代からという。一般に西日本では牛、東日本では豚の内臓が多く消費される。
      zh: 行业的统一名称是「畜産副生物」（畜产副产品），「ホルモン」「モツ」原本都是行话；农林水产省的资料称小肠是“内脏的代名词”，大肠是“内脏的代表”。词源是医学用语“荷尔蒙”（德语 Hormon）：约1920年起，滋补强身的菜就被叫作「ホルモン料理」，据说是大阪西餐馆「北極星」的创办人北桥茂男把这个词推广成“内脏”的意思。流传很广的“源自大阪话「放るもん」（扔掉的东西）”一说，《日本国语大辞典》也以“一说”收录，但由于这个词约1920年就已在使用，一般视为民间词源，1970年代以后才传开。一般来说，西日本多吃牛内脏，东日本多吃猪内脏。
      en: "The trade’s official term is chikusan fukuseibutsu (“livestock by-products”); horumon and motsu began as trade jargon, and MAFF materials call the small intestine the “byword for horumon” and the large intestine its “typical example”. The word comes from the medical term “hormone” (German Hormon): by around 1920 invigorating dishes were called horumon ryōri, and Kitahashi Shigeo, founder of the Osaka restaurant Hokkyokusei, is credited with popularising it to mean offal. The popular derivation from Osaka dialect hōrumon (“stuff to throw away”) appears in the Nihon Kokugo Daijiten only as “one theory”; since the word was already in use around 1920 it is regarded as folk etymology, and it spread only from the 1970s. In general, western Japan eats more beef offal and eastern Japan more pork offal."
    sources:
