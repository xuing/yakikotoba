  - id: mino
    ja: ミノ
    kana: みの
    romaji: mino
    mean:
      ja: 牛の第一胃
      zh: 牛的第一胃（瘤胃）
      en: Beef rumen (first stomach)
    part:
      ja: 4つある胃の最初で最大の胃（瘤胃・ルーメン）
      zh: 四个胃中的第一个，也是最大的一个（瘤胃）
      en: The first and largest of the four stomachs (rumen)
    note:
      ja: 4つの胃で最も大きく、第二胃と合わせると全胃容積の約8割、牛では100〜150Lに達する。肉厚でかたいがくせは少なく、焼肉では切れ込みを入れて出す。一般に売られるのは特に厚い部分の「上ミノ」で、身と身の間に濃厚な脂を挟んだ厚い部分は「ミノサンド」と呼ばれる希少な部位。名は切り開いた形が雨具の蓑（みの）に似ることからという説がある。
      zh: 是四个胃中最大的，与第二胃合计约占全部胃容积的八成，牛的可达100–150升。肉厚而硬，但异味少；烤肉店上桌前会先切上花刀。市面上卖的一般是特别厚的部分「上ミノ」；肉层之间夹着一层浓厚油脂的厚块叫「ミノサンド」，量很少。一说名字来自剖开后的样子像蓑衣（日语「蓑」读 mino）。
      en: "The largest of the four stomachs: together with the second stomach it makes up about 80% of total stomach volume—100–150 litres in cattle. Thick and tough but mild in flavour, it is scored with knife cuts before serving at yakiniku restaurants. What is usually sold is the extra-thick jō-mino; a thick section with a layer of rich fat sandwiched inside is the scarce mino-sando. One theory derives the name from mino, the straw raincoat it resembles when cut open."
    sources:
