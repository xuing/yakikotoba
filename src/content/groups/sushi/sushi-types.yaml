  - id: hosomaki
    ja: 細巻き
    ruby: "{細巻|ほそま}き"
    kana: ほそまき
    romaji: hosomaki
    mean:
      ja: 細いのり巻き
      zh: 细卷
      en: Thin roll
    part:
      ja: 全形の海苔を半分に切って巻いた細いのり巻き。芯の具は1種類のことが多い
      zh: 用半张海苔卷成的细寿司卷，芯里多半只放一种料
      en: A slim roll made with a half sheet of nori, usually around a single filling
    note:
      ja: 海苔1枚をそのまま使うのが太巻き、半分に切って使うのが細巻き。江戸では「のり巻き」といえば干瓢（かんぴょう）巻きを指し、江戸後期の『守貞謾稿』にも海苔巻には干瓢だけを入れるとある。関東の細巻きは干瓢が基本で、芯がマグロなら鉄火巻、キュウリならかっぱ巻、たくあんなどの漬物なら新香巻と呼ぶ。関西では卵焼き・シイタケ・干瓢などを合わせた太巻きが主流で、干瓢巻きはなじみが薄い。
      zh: 用整张海苔卷的是太卷，切成半张卷的是细卷。在江户，说“海苔卷”就是指干瓢卷（瓠瓜干条卷），江户后期的《守贞谩稿》也记载海苔卷里只放干瓢。关东的细卷以干瓢为基本，芯放金枪鱼叫铁火卷，放黄瓜叫河童卷，放腌萝卜等咸菜叫新香卷。关西则以放玉子烧、香菇、干瓢等多种料的太卷为主，干瓢卷并不常见。
      en: "A whole sheet of nori makes a futomaki; a half sheet makes a hosomaki. In Edo “norimaki” meant the kanpyō (dried gourd strip) roll, and the late-Edo Morisada Mankō notes that the nori roll held kanpyō alone. Kantō thin rolls still start from kanpyō: with tuna it is tekkamaki, with cucumber kappamaki, with pickles such as takuan shinkomaki. In Kansai the thick futomaki with omelette, shiitake and kanpyō dominates, and kanpyō rolls are little known."
    sources:
      - title: コトバンク「巻き鮨」（デジタル大辞泉・講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E5%B7%BB%E3%81%8D%E9%AE%A8-633525
