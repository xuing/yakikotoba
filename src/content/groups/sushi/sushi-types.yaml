  - id: gunkan
    ja: 軍艦巻き
    ruby: "{軍艦|ぐんかん}{巻|ま}き"
    kana: ぐんかんまき
    romaji: gunkan maki
    mean:
      ja: 軍艦の形をしたすし
      zh: 军舰卷
      en: Battleship roll
    part:
      ja: 握ったシャリの側面に幅広の海苔を巻き、上にウニ・イクラなど崩れやすいネタをのせたすし
      zh: 捏好的醋饭外侧围一圈较宽的海苔，上面放海胆、鲑鱼子等容易散开的料
      en: A block of rice wrapped round with a wide strip of nori, forming a cup for loose toppings such as sea urchin or salmon roe
    note:
      ja: 横から見た形が軍艦に似ていることからの名で、単に「軍艦」とも言う。銀座久兵衛は、初代店主が1940年代にウニの軍艦巻きを考案したとしており、握りにはのせにくい柔らかいネタを出せる方法として広まった。回転寿司の品書きでは「まぐろたたき軍艦」「かにみそ軍艦」（はま寿司）、「かずのこ軍艦」（くら寿司）のように「〜軍艦」と書かれ、くら寿司は分類名をひらがなで「ぐんかん」としている。
      zh: 因从侧面看形似军舰而得名，也简称“军舰”。银座久兵卫称，其初代店主在1940年代想出了海胆军舰卷，这种做法能让不便捏的软料也做成寿司，后来普及开来。回转寿司菜单上写作“まぐろたたき軍艦”“かにみそ軍艦”（はま寿司）、“かずのこ軍艦”（鲱鱼籽军舰，くら寿司）等“～军舰”，くら寿司的分类名则用平假名写作“ぐんかん”。
      en: Named for its warship-like profile seen from the side, it is often called simply gunkan. Ginza Kyūbey says its founder devised the sea-urchin gunkan in the 1940s, a way of serving soft toppings that cannot be pressed onto rice, and the style spread from there. Conveyor-belt menus write it as “…軍艦”, e.g. まぐろたたき軍艦 or かにみそ軍艦 at Hama-zushi and かずのこ軍艦 (herring roe) at Kura Sushi, which heads the category in hiragana as ぐんかん.
    sources:
      - title: コトバンク「軍艦巻」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E8%BB%8D%E8%89%A6%E5%B7%BB-487619
