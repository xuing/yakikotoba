        url: https://www.nippon.com/ja/japan-data/h01735/
  - id: kappamaki
    ja: かっぱ巻き
    ruby: かっぱ{巻|ま}き
    kana: かっぱまき
    romaji: kappa maki
    mean:
      ja: キュウリの細巻き
      zh: 黄瓜细卷
      en: Cucumber roll
    part:
      ja: 生のキュウリを芯にした細巻き
      zh: 以生黄瓜为芯的细卷
      en: A thin roll with raw cucumber at its core
    note:
      ja: すし屋でキュウリを「かっぱ」と呼ぶことからの名で、河童の好物がキュウリとされるためという。河童は水神の性格をもつ妖怪で、水神祭や川祭にキュウリを供えて水難よけを祈る地方が多い。キュウリの断面が河童の頭の皿に似ているからという説もある。
      zh: 寿司店把黄瓜叫“河童”（かっぱ），卷名由此而来，据说是因为传说中的河童最爱吃黄瓜。河童是带有水神性质的妖怪，许多地方在水神祭、河祭时供奉黄瓜，祈求免遭水难。另一说认为黄瓜的切面像河童头顶的碟子。
      en: Sushi bars call cucumber kappa, after the water imp said to love cucumbers. The kappa has the character of a water deity, and many regions offer cucumbers at water-god and river festivals to ward off drowning. Another theory says a cucumber’s cut face looks like the water-filled dish on a kappa’s head.
    sources:
      - title: コトバンク「河童巻」（デジタル大辞泉・精選版 日本国語大辞典）
        url: https://kotobank.jp/word/%E6%B2%B3%E7%AB%A5%E5%B7%BB-464517
      - title: コトバンク「河童」（デジタル大辞泉・日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典）
        url: https://kotobank.jp/word/%E6%B2%B3%E7%AB%A5-45345
