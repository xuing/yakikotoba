        url: https://www.nippon.com/ja/japan-data/h01735/
  - id: temaki
    ja: 手巻き
    ruby: "{手巻|てま}き"
    kana: てまき
    romaji: temaki
    mean:
      ja: 手巻きずし
      zh: 手卷
      en: Hand roll
    part:
      ja: 巻き簀を使わず、海苔にシャリと具をのせて手で巻いたすし
      zh: 不用竹帘，在海苔上放醋饭和料、用手卷成的寿司
      en: Sushi rolled by hand in a sheet of nori, without a bamboo mat
    note:
      ja: 巻き簀などの道具を使わず、手だけで巻くことからの名。作り置きはせず、海苔・すし飯・ネタを並べて各自がその場で巻いて食べることが多い。回転寿司の品書きでは「えび天手巻」（くら寿司）のように送り仮名を省いて書くことがあり、はま寿司はネタとシャリに半切り海苔を添えた持ち帰り用の「手巻きセット」を売っている。
      zh: 因不用竹帘等工具、只用手卷而得名。通常不事先做好，而是把海苔、醋饭和各种料摆上桌，各人当场自己卷着吃。回转寿司菜单上有时省略送假名写作“手巻”，如くら寿司的“えび天手巻”（炸虾手卷）；はま寿司还卖附有半张海苔的外带“手卷套装”。
      en: "The name means “hand-rolled”: no bamboo mat or other tool is used. It is rarely made ahead; nori, sushi rice and toppings are set out and everyone rolls their own at the table. Chain menus may drop the okurigana and write 手巻, as in Kura Sushi’s えび天手巻 (shrimp-tempura hand roll), and Hama-zushi sells a take-home “temaki set” of toppings, rice and half-size nori sheets."
    sources:
      - title: コトバンク「手巻き鮨」（デジタル大辞泉・講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E6%89%8B%E5%B7%BB%E3%81%8D%E9%AE%A8-679081
      - title: くら寿司「メニュー」
        url: https://www.kurasushi.co.jp/menu/
      - title: はま寿司「メニュー紹介」
        url: https://www.hama-sushi.co.jp/menu/
  - id: chirashi
    ja: ちらし寿司
    ruby: ちらし{寿司|ずし}
    kana: ちらしずし
    romaji: chirashi-zushi
    mean:
      ja: 散らしずし
      zh: 散寿司
      en: Scattered sushi
    part:
      ja: 器に盛ったすし飯の上に具を散らしたすし。関西では具をすし飯に混ぜ込む
      zh: 在盛入容器的醋饭上铺撒各种料的寿司；关西多把料拌进饭里
      en: Sushi rice in a bowl or box with toppings scattered over it (in Kansai, mixed through it)
    note:
      ja: 関東のすし屋のちらしは、すし飯の上に刺身・ゆでたエビ・玉子焼きなど握りのネタを並べたもの。関西では刻んだ具をすし飯に混ぜ、錦糸玉子をのせて「ばらずし」「五目ずし」「かやくずし」と呼ぶ。岡山の「ばらずし（まつりずし）」には、藩主が倹約令で庶民に「一汁一菜」を命じた際、具を飯に混ぜればおかずにならないと考えて作ったという話が伝わる。ひなまつりの定番料理でもある。
      zh: 关东寿司店的散寿司，是在醋饭上摆放生鱼片、煮虾、玉子烧等握寿司的料。关西则把切碎的料拌进醋饭，再铺上蛋丝，叫“ばらずし”“五目ずし”“かやくずし”。冈山的“ばらずし（祭寿司）”流传着这样的故事：藩主颁布节俭令，命令百姓只准“一汤一菜”，百姓便把鱼和菜拌进饭里，这样就不算菜了。散寿司也是女儿节的固定菜色。
      en: "At a Kantō sushi bar, chirashi is sushi rice laid with nigiri toppings: sashimi, boiled prawns, tamagoyaki. In Kansai chopped ingredients are mixed into the rice and topped with shredded omelette, and the dish is called barazushi, gomokuzushi or kayakuzushi. Okayama’s barazushi (matsurizushi) carries a story that when the domain lord’s frugality edict allowed commoners only “one soup, one side dish”, people mixed fish and vegetables into the rice so they would not count as a side dish. It is also a standard dish for Hinamatsuri, the Girls’ Festival."
    sources:
      - title: コトバンク「散らし鮨」（デジタル大辞泉・講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E6%95%A3%E3%82%89%E3%81%97%E9%AE%A8-569649
      - title: 農林水産省「うちの郷土料理」まつりずし／ばらずし（岡山県）
        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/41_1_okayama.html
      - title: 農林水産省「お家で祝うひなまつり！」
        url: https://www.maff.go.jp/j/keikaku/syokubunka/culture/wagohan/articles/2302/spe14_03.html
  - id: inari
    ja: いなり寿司
    ruby: いなり{寿司|ずし}
    kana: いなりずし
    romaji: inari-zushi
    mean:
      ja: 稲荷ずし
      zh: 稻荷寿司（豆皮寿司）
      en: Inari sushi
    part:
      ja: 甘辛く煮た油揚げを袋状に開き、すし飯を詰めたもの
      zh: 把甜咸口煮过的油炸豆腐皮撑成袋状，塞入醋饭
      en: Sushi rice stuffed into a pouch of fried tofu simmered sweet and salty
    note:
      ja: 稲荷神の使いとされるキツネが油揚げを好むとされることからの名で、「しのだずし」「きつねずし」ともいう。『守貞謾稿』によれば発祥は名古屋で、江戸では天保（1830〜44）の末ごろから、鳥居を描いた行灯をともした稲荷ずし売りが夜の町を売り歩いた。関東は濃口醤油で煮た長方形、関西は薄揚げと淡口醤油を使った三角形が多く、西日本では五目の具を混ぜることも多い。いなりと巻きずしの詰め合わせを「助六」と呼ぶのは、歌舞伎『助六』の恋人「揚巻」に「揚げ」と「巻き」を掛けたもの。
      zh: 名字来自传说中稻荷神的使者狐狸爱吃油炸豆腐，也叫“信太寿司”“狐狸寿司”。据《守贞谩稿》，它起源于名古屋；江户从天保末年（1840年代初）起，有小贩点着画有鸟居的灯笼，夜里沿街叫卖。关东多用浓口酱油煮成长方形，关西多用薄油豆腐和淡口酱油做成三角形，西日本还常在饭里拌入什锦配料。稻荷寿司配卷寿司的拼盘叫“助六”，取歌舞伎《助六》中情人“扬卷”的谐音：“扬”指油豆腐，“卷”指卷寿司。
      en: The name comes from the belief that foxes, messengers of the Inari deity, love fried tofu; it is also called shinoda-zushi or kitsune-zushi. According to the Morisada Mankō it began in Nagoya, and in Edo from the end of the Tenpō era (early 1840s) vendors hawked it at night under lanterns painted with a torii gate. Kantō versions are oblong and simmered in dark soy sauce; Kansai ones are often triangular, made with thin fried tofu and light soy sauce, and western Japan often mixes vegetables into the rice. A box of inari and maki is called “Sukeroku” after the kabuki hero whose lover Agemaki’s name puns on age (fried tofu) and maki (roll).
