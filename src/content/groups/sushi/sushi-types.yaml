        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_13_tokyo.html
      - title: コトバンク「新香巻」（世界大百科事典（旧版））
        url: https://kotobank.jp/word/%E6%96%B0%E9%A6%99%E5%B7%BB-1343414
  - id: tekkamaki
    ja: 鉄火巻き
    ruby: "{鉄火|てっか}{巻|ま}き"
    kana: てっかまき
    romaji: tekka maki
    mean:
      ja: マグロの細巻き
      zh: 金枪鱼细卷
      en: Tuna roll
    part:
      ja: 拍子木形に切ったマグロの赤身とおろしワサビを芯にした細巻き
      zh: 以切成长条的金枪鱼赤身和山葵泥为芯的细卷
      en: A thin roll with a stick of lean tuna and grated wasabi at its core
    note:
      ja: 「鉄火」は真っ赤に焼けた鉄のことで、すし屋ではマグロの赤身もこう呼ぶ。名の由来は、明治中期に鉄火場（賭博場）で勝負をしながら食べる簡易食だったからという説が知られるが、赤くて辛みのきいたものを「鉄火」と呼んだ例は江戸時代の鉄火みそにもある。鉄火巻きの名が見えるのは明治以降で、マグロを丼飯にのせた「鉄火丼」の名は大正以後とされる。
      zh: “铁火”本指烧得通红的铁，寿司店里也用来指金枪鱼赤身。名称来历以“明治中期在赌场（铁火场）边赌边吃的简便食物”一说最为流行；不过江户时代已有把又红又辣的东西叫“铁火”的例子（铁火味噌）。“铁火卷”一名见于明治以后，金枪鱼盖饭“铁火丼”一名则据说始于大正以后。
      en: Tekka means red-hot iron, and sushi bars also use it for lean red tuna. The best-known theory traces the name to gambling dens (tekkaba), where the roll was a quick meal eaten mid-game in the mid-Meiji era; but in the Edo period red, fiery-hot foods were already called tekka, as in tekka-miso. The name tekkamaki appears from the Meiji era, and tekkadon (tuna over rice) only from the Taishō era.
    sources:
      - title: コトバンク「鉄火巻」（百科事典マイペディア・ブリタニカ国際大百科事典ほか）
        url: https://kotobank.jp/word/%E9%89%84%E7%81%AB%E5%B7%BB-101036
      - title: コトバンク「鉄火」（デジタル大辞泉・日本大百科全書(ニッポニカ)）
        url: https://kotobank.jp/word/%E9%89%84%E7%81%AB-576046
