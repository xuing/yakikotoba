order: 4
ja: 寿司の種類
zh: 寿司的种类
en: Kinds of sushi
note:
  ja: 「すし」は「酸（す）し」が語源とされ、古くは魚を塩と飯で漬けて自然発酵させた「なれずし」（近江の鮒ずしなど）を指した。江戸時代に酢を使ってすぐ食べられる「早ずし」が生まれ、握り・巻き・ちらし・いなりはいずれもこの系統に入る。古い字は「鮓」「鮨」で、「寿司」は縁起をかついだ当て字とされる。
  zh: “すし”一词据说源自“酸し”（酸的），古时指把鱼和盐、米饭一起腌渍、自然发酵的“熟寿司”（如近江的鲫鱼寿司）。江户时代出现了用醋调味、做好即可食用的“早寿司”，握寿司、卷寿司、散寿司、稻荷寿司都属于这一系统。古字写作“鮓”“鮨”，“寿司”被认为是讨吉利的借字。
  en: "Sushi is thought to come from sushi 酸し, “sour”, and originally meant narezushi: fish packed in salt and rice and left to ferment, as in Ōmi’s funazushi. The Edo period brought hayazushi, seasoned with vinegar and eaten at once, and nigiri, rolls, chirashi and inari all descend from it. The old characters are 鮓 and 鮨; 寿司 is an auspicious phonetic spelling."
items:
  - id: nigiri
    ja: 握り
    ruby: "{握|にぎ}り"
    kana: にぎり
    romaji: nigiri
    mean:
      ja: 握りずし
      zh: 握寿司
      en: Nigiri sushi
    part:
      ja: 一口大に握ったすし飯（シャリ）にネタをのせたすし
      zh: 把醋饭捏成一口大小，上面放一片料（ネタ）的寿司
      en: A bite-sized, hand-pressed block of vinegared rice topped with a slice of fish or other topping
    note:
      ja: 文化・文政期（1804〜30）の江戸で生まれた早ずしで、両国の華屋与兵衛が始めたという説がある。当時は屋台の軽食で、大きさは現在の2〜3倍あり、ネタは煮たアナゴ・イカ・エビなど火を通したものが多く、酢漬けや生の魚は少なかったという。1923年の関東大震災より前は、屋台も含めほとんどのすし職人が座って握っていたという。数える単位は「貫」で、1貫を1個とするか2個とするかは地域や店によって異なる。
      zh: 握寿司诞生于江户（今东京）的文化、文政年间（1804—1830），一说由两国的华屋与兵卫首创。当时是路边摊的小吃，个头是现在的两三倍；料多是煮过的星鳗、乌贼、虾等熟料，醋腌鱼和生鱼用得很少。据说1923年关东大地震以前，包括路边摊在内，大多数寿司师傅是坐着捏寿司的。量词用“贯”（貫），一贯算一个还是两个，因地区和店家而异。
      en: Nigiri appeared in Edo (Tokyo) in the Bunka–Bunsei era (1804–30) as a kind of “fast sushi”; one theory credits Hanaya Yohei of Ryōgoku. It was street-stall food two to three times today’s size, and the toppings were mostly cooked, such as simmered conger eel, squid and prawns, with little vinegared or raw fish. Until the 1923 Great Kantō Earthquake most sushi makers, stall-keepers included, are said to have worked seated. Pieces are counted in kan (貫), and whether one kan means one piece or two varies by region and shop.
    sources:
      - title: コトバンク「握り鮨」（デジタル大辞泉・精選版 日本国語大辞典・ブリタニカ国際大百科事典）
