  - id: tamago
    ja: 玉子
    ruby: "{玉子|たまご}"
    kana: たまご
    romaji: tamago
    mean:
      ja: "すし種の厚焼き玉子"
      zh: "玉子烧（厚蛋烧）"
      en: "Sweet rolled omelette (tamagoyaki)"
    part:
      ja: "溶き卵に調味料を加えて厚く焼いた卵焼き。すし屋では「ギョク」と呼ぶ"
      zh: "在蛋液里加调味料煎成的厚蛋烧；寿司店里叫“ギョク”"
      en: "Beaten egg seasoned and cooked into a thick omelette; sushi shops call it gyoku"
    note:
      ja: "握りずしは文化・文政期（1804〜30年）ごろに江戸で始まり、初めは鮮魚介類を使わず卵焼きと「おぼろ（でんぶ）」が主な種だったとされる。当時のすしは1貫4〜8文ほどで、江戸末期に最も高かったのは16文の「卵巻き」だったという。「ギョク」は「玉子」の「玉」を音読みした符丁で、「玉子」の字は形の丸さから、あるいは魂（たま）の入ったものと考えたためと解され、「厚焼の玉子」の語は1769年の洒落本に見える。"
      zh: "握寿司约在文化、文政年间（1804—1830年）诞生于江户，据说起初不用鲜鱼贝，主要的料是玉子烧和“おぼろ”（鱼松）。当时的寿司每贯约4—8文，据说江户末期最贵的是16文的“卵巻き”（蛋卷寿司）。“ギョク”是把“玉子”的“玉”字按音读念的行话；“玉子”的写法一说因其形圆，一说因为被看作装有“魂（たま）”之物；“厚焼の玉子”一词见于1769年的洒落本。"
      en: "Nigiri began in Edo around the Bunka–Bunsei era (1804–30), and at first, it is said, its main toppings were not fresh seafood but omelette and oboro, sweet fish floss. Sushi then cost about 4–8 mon a piece, and the dearest at the end of the Edo period, at 16 mon, is said to have been the egg roll (tamago-maki). Gyoku is trade slang reading the 玉 of 玉子 in its Chinese reading; the spelling 玉子 is explained by the egg’s round shape or as a vessel holding a soul (tama), and “thick-cooked egg” (atsuyaki no tamago) appears in a sharebon of 1769."
    sources:
      - title: "コトバンク「握り鮨」（精選版 日本国語大辞典・ブリタニカ国際大百科事典）"
        url: "https://kotobank.jp/word/%E6%8F%A1%E3%82%8A%E9%AE%A8-109183"
