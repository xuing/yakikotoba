  - id: saba
    ja: サバ
    kana: さば
    romaji: saba
    mean:
      ja: "マサバ・ゴマサバ"
      zh: "鲭鱼（鲐鱼）"
      en: "Mackerel"
    part:
      ja: "サバ科サバ属のマサバとゴマサバ。すし種では光り物で、塩と酢で締めた「しめさば」にして使う"
      zh: "鲭科鲭属的日本鲭（マサバ）和澳洲鲭（ゴマサバ）；在寿司里属于“光り物”，多做成用盐和醋腌过的“しめさば”"
      en: "Chub mackerel (masaba) and spotted mackerel (gomasaba); a hikarimono at sushi, used as shime-saba, cured in salt and vinegar"
    note:
      ja: "マサバは背に黒い波状紋があり断面が平たく（別名ヒラサバ）、ゴマサバは腹に細かな黒点があり断面が丸い（別名マルサバ）。マサバは産卵前の秋〜冬に脂肪分が20〜30%前後までのって「秋サバ」「寒サバ」と呼ばれ、ゴマサバは一年を通じて味の変化が小さい。しめさばは三枚におろして塩をし、酢に漬けて作り、京都の棒ずしや、明治中期に大阪の鮓常が考案したとされるバッテラ（ポルトガル語bateira＝小舟）の材料にもなる。名は『出雲国風土記』（733年）に「佐波」として見え、大分県佐賀関で一本釣りされたマサバは「関さば」と呼ばれる。"
      zh: "日本鲭背上有黑色波纹，横截面扁平（别名ヒラサバ）；澳洲鲭腹部有细小黑点，截面呈圆形（别名マルサバ）。日本鲭在产卵前的秋冬季脂肪可达20%—30%左右，称“秋サバ”“寒サバ”；澳洲鲭一年中味道变化不大。しめさば的做法是剖成三片后撒盐，再用醋浸泡；它也是京都“棒ずし”和大阪“バッテラ”的材料，后者据说由大阪的“鮓常”在明治中期发明，名字来自葡萄牙语bateira（小船）。“サバ”一名早在《出云国风土记》（733年）中就写作“佐波”；大分县佐贺关一本钓的日本鲭称为“関さば”。"
      en: "Masaba has black wavy bars on its back and a flattish cross-section (hence hirasaba); gomasaba has fine dark spots on the belly and a round section (marusaba). Masaba fattens to around 20–30% fat in autumn and winter before spawning — aki-saba, kan-saba — while gomasaba changes little through the year. Shime-saba is made by filleting, salting and then soaking in vinegar; it also goes into Kyoto’s bō-zushi and Osaka’s battera, said to have been created in the mid-Meiji era by the shop Sushitsune and named from Portuguese bateira, “small boat”. The name appears as 佐波 in the Izumo Fudoki of 733, and masaba line-caught at Saganoseki in Ōita is sold as Seki-saba."
    sources:
      - title: "コトバンク「サバ」（日本大百科全書・改訂新版 世界大百科事典）"
        url: "https://kotobank.jp/word/%E3%81%95%E3%81%B0-275730"
      - title: "コトバンク「鯖」（精選版 日本国語大辞典）"
        url: "https://kotobank.jp/word/%E9%AF%96-188412"
      - title: "コトバンク「しめさば」（日本大百科全書）"
        url: "https://kotobank.jp/word/%E3%81%97%E3%82%81%E3%81%95%E3%81%B0-1543368"
      - title: "コトバンク「バッテラ」（デジタル大辞泉・日本大百科全書）"
        url: "https://kotobank.jp/word/%E3%81%B0%E3%81%A4%E3%81%A6%E3%82%89-3164212"
      - title: "Umios umito.「日本で漁獲されるサバはどんなサバ？美味しさと資源量の話」"
        url: "https://umito.umios.com/article72/"
