order: 2
ja: 寿司ネタ
zh: 常见寿司料
en: Common toppings
note:
  ja: "赤身魚と白身魚は身の見た目ではなく、筋肉100gあたりの色素たんぱく質（ミオグロビンとヘモグロビン）が10mg以上かどうかで分ける。このためブリ・アジ・サバ・イワシは身が白っぽくても赤身魚で、オレンジ色のサーモンは餌に含まれるアスタキサンチンで色づいた白身魚になる。すし種の「光り物」は、コハダ・アジ・サバ・イワシなど皮が青白く光る魚をいう。"
  zh: "红肉鱼与白肉鱼不是看肉色，而是看每100克肌肉中的色素蛋白（肌红蛋白和血红蛋白）是否达到10毫克。因此鰤鱼、竹荚鱼、鲭鱼、沙丁鱼虽然肉色偏白，仍属红肉鱼；橙色的三文鱼则是白肉鱼，颜色来自饵料中的虾青素。寿司料里的“光り物”指鱼皮青白发亮的鱼，如小鳍（コハダ）、竹荚鱼、鲭鱼、沙丁鱼。"
  en: "Red-fleshed and white-fleshed fish are defined not by colour but by whether the muscle holds at least 10 mg of pigment protein (myoglobin and haemoglobin) per 100 g. So yellowtail, horse mackerel, mackerel and sardine count as red fish despite their pale flesh, while orange salmon is a white fish tinted by astaxanthin from its food. Hikarimono, “shiny things”, are sushi fish with bright silvery-blue skin, such as kohada, aji, saba and iwashi."
items:
  - id: samon
    ja: サーモン
    kana: さーもん
    romaji: sāmon
    mean:
      ja: "生食用のサケ・マス類（主に養殖）"
      zh: "三文鱼（生食用的养殖鲑鳟）"
      en: "Salmon (farmed, for eating raw)"
    part:
      ja: "ノルウェーやチリなどから輸入される養殖のアトランティックサーモン（タイセイヨウサケ）や、海面養殖したニジマス（トラウトサーモン）、ギンザケなどの身"
      zh: "从挪威、智利等国进口的养殖大西洋鲑，以及海水养殖的虹鳟（“trout salmon”）、银鲑等的鱼肉"
      en: "Flesh of farmed Atlantic salmon imported from Norway, Chile and elsewhere, or of sea-farmed rainbow trout (“trout salmon”), coho and the like"
    note:
      ja: "日本でサケは塩焼きなど加熱して食べる魚で、生食は凍らせてから食べるルイベや、酢で締めたます寿司などに限られていた。1980年代半ば、ノルウェーが養殖サーモンを生食用に売り込む「プロジェクト・ジャパン」を始め、生食用のサーモンは1990年ごろから市場に広まった。現在はその9割以上がチリやノルウェーなどからの輸入品で、Umios（旧マルハニチロ）の調査では2026年まで15年連続で回転寿司の「よく食べるネタ」1位となっている。"
      zh: "在日本，鲑鱼原本是盐烤等加热后吃的鱼，生吃只限于冷冻后切片的“ルイベ”或醋腌的鳟鱼寿司等少数做法。1980年代中期，挪威发起“Project Japan”，向日本推销可生食的养殖三文鱼，生食用三文鱼从1990年前后开始在市场上普及。如今九成以上是从智利、挪威等国进口的；据Umios（原Maruha Nichiro）调查，到2026年它已连续15年位居回转寿司“常吃的寿司料”第一。"
      en: "In Japan salmon was a fish for grilling; it was eaten raw only in a few forms such as frozen ruibe slices or vinegar-cured masu-zushi. In the mid-1980s Norway launched “Project Japan” to sell farmed salmon for eating raw, and raw salmon spread through the market from around 1990. Over 90% of it is now imported, mainly from Chile and Norway, and in Umios’s (formerly Maruha Nichiro) survey it has been the most-eaten topping at conveyor-belt sushi for 15 straight years, as of 2026."
    sources:
      - title: "Umios umito.「サーモンとサケは違うのでしょうか？」（2019年4月18日）"
        url: "https://umito.umios.com/article38/"
      - title: "Umios umito.「巨大なノルウェーサーモンの養殖施設を調べてみた」（2019年7月25日）"
        url: "https://umito.umios.com/article53/"
      - title: "コトバンク「サーモン」（共同通信ニュース用語解説・デジタル大辞泉）"
        url: "https://kotobank.jp/word/%E3%81%95%E3%83%BC%E3%82%82%E3%82%93-3202072"
      - title: "＋αオンライン（川本大吾）「40年前までは生食の文化がなかった“サーモン”…今では大人気のサーモン寿司が広まった原因は「ノルウェーの輸出戦略」だった」（2026年1月28日）"
        url: "https://gendai.media/articles/-/162695"
      - title: "くら寿司 プレスリリース「11月11日は「鮭の日」！ サーモン寿司が誕生して今年で40周年！ノルウェー大使館の水産参事官に聞く」（2025年10月24日）"
        url: "https://digitalpr.jp/r/121042"
      - title: "nippon.com「回転すし、人気のネタ「サーモン」が15年連続トップ―Umios調査」（2026年3月27日）"
        url: "https://www.nippon.com/ja/japan-data/h02749/"

  - id: hamachi
    ja: ハマチ
    kana: はまち
    romaji: hamachi
    mean:
      ja: "ブリの若魚。また養殖ブリ"
      zh: "鰤鱼的幼鱼；也指养殖鰤鱼"
      en: "Young yellowtail; also farmed yellowtail"
    part:
      ja: "関西で全長40cm前後のブリを呼ぶ名（ツバス→ハマチ→メジロ→ブリ）。現在は大きさに関係なく養殖ブリの呼び名としても全国に通じる"
      zh: "关西对全长40厘米左右鰤鱼的叫法（ツバス→ハマチ→メジロ→ブリ）；现在不论大小，全国也用它指养殖鰤鱼"
      en: "The Kansai name for yellowtail of about 40 cm (tsubasu → hamachi → mejiro → buri); now also understood nationwide as farmed yellowtail of any size"
    note:
      ja: "ブリは成長につれて名が変わる出世魚で、関東ではワカシ→イナダ→ワラサ→ブリと呼ぶ。平安時代の『和名抄』に見える「波里万知（はりまち）」が詰まって室町期にハマチとなったとされる。ハマチ養殖は1928年（昭和3年）に香川県引田（現・東かがわ市）で野網和三郎が事業化したのが始まりで、1971年には養殖物の生産量が天然物の漁獲量を上回った。養殖の盛んな西日本の呼び名が全国に広まったため、今は養殖ブリをハマチと呼ぶことが多い。"
      zh: "鰤鱼是随着长大而改名的“出世鱼”，关东依次叫ワカシ→イナダ→ワラサ→ブリ。平安时代《和名抄》里的“波里万知”（はりまち）在室町时期缩略成了“ハマチ”。鰤鱼养殖始于1928年（昭和3年），由野网和三郎在香川县引田（今东香川市）实现商业化；1971年养殖产量超过了野生渔获量。由于养殖兴盛的西日本的叫法推广到全国，如今“ハマチ”常指养殖鰤鱼。"
      en: "Yellowtail is a “promotion fish” whose name changes as it grows; in Kantō the sequence is wakashi → inada → warasa → buri. The name is said to be a contraction of harimachi, recorded in the Heian dictionary Wamyōshō, which became hamachi in the Muromachi period. Yellowtail farming was first made a business in 1928 by Noami Wasaburō at Hiketa in Kagawa, and by 1971 farmed output exceeded the wild catch. Because the term spread from western Japan, where farming flourished, hamachi now often simply means farmed yellowtail."
    sources:
      - title: "コトバンク「ハマチ」（日本大百科全書・百科事典マイペディア）"
        url: "https://kotobank.jp/word/%E3%81%AF%E3%81%BE%E3%81%A1-3163617"
      - title: "コトバンク「ブリ」（日本大百科全書・改訂新版 世界大百科事典）"
        url: "https://kotobank.jp/word/%E3%81%B6%E3%82%8A-2861008"
      - title: "香川県「ハマチ養殖80周年記念事業」"
        url: "https://www.pref.kagawa.lg.jp/suisan/sogo/event/hamachi.html"
      - title: "Umios umito.「魚の名前いろいろ。出世魚と名前が変わる魚たち」"
        url: "https://umito.umios.com/article56/"

  - id: buri
    ja: ブリ
    kana: ぶり
    romaji: buri
    mean:
      ja: "成長したブリ（出世魚の最後の名）"
      zh: "鰤鱼（五条鰤）成鱼"
      en: "Japanese amberjack (yellowtail), adult"
    part:
      ja: "アジ科ブリ属の回遊魚の成魚。おおむね全長80cmを超えると地域を問わず「ブリ」と呼ぶ"
      zh: "鲹科鰤属洄游鱼的成鱼；全长超过约80厘米后，各地都叫“ブリ”"
      en: "The adult of a migratory jack (Seriola quinqueradiata); above about 80 cm it is called buri everywhere"
    note:
      ja: "旬は冬で、産卵に備えて餌を飽食し南下する脂ののった成魚を「寒ブリ」と呼び、富山湾の定置網で獲れて氷見漁港で競りにかけられた7kg以上のものは「ひみ寒ぶり」のブランドになる。名の由来には「アブラ」から来たとする説と、年を経た魚を意味する「フリ」から来たとする説があり、「鰤」は日本で作られた字。西日本では正月の年取り魚に塩ブリを使い、東日本のサケと対をなす。身は白っぽく見えるが、色素たんぱく質の量による定義では赤身魚に入る。"
      zh: "旬期在冬季：为产卵大量进食后南下、脂肪丰厚的成鱼叫“寒ブリ”；在富山湾定置网捕获、并在冰见渔港拍卖的7公斤以上个体，可冠以“ひみ寒ぶり”品牌。名字来源有两说：一说出自“アブラ”（油脂），一说出自表示“上了年纪的鱼”的“フリ”；“鰤”是日本自造的汉字。西日本过年的“年取り魚”用盐腌鰤鱼，与东日本用鲑鱼相对。鰤鱼肉色偏白，但按色素蛋白含量的定义属于红肉鱼。"
      en: "It is best in winter: adults that have gorged before spawning and are heading south are called kan-buri, and those of 7 kg or more caught by set nets in Toyama Bay and auctioned at Himi port carry the “Himi kan-buri” brand. The name is traced either to abura, “oil”, or to furi, an old word for a fish that has lived many years; the character 鰤 was coined in Japan. Western Japan eats salted buri as its New Year fish, the counterpart of salmon in the east. Though pale-looking, it counts as a red-fleshed fish by its pigment content."
    sources:
      - title: "コトバンク「ブリ」（日本大百科全書・改訂新版 世界大百科事典）"
        url: "https://kotobank.jp/word/%E3%81%B6%E3%82%8A-2861008"
      - title: "コトバンク「寒鰤」（デジタル大辞泉・精選版 日本国語大辞典）"
        url: "https://kotobank.jp/word/%E5%AF%92%E9%B0%A4-471382"
      - title: "nippon.com「雪が降るごとに美味しくなる冬の味覚の王者ブリ」（2018年2月7日）"
        url: "https://www.nippon.com/ja/views/b01728/"
      - title: "Umios umito.「魚の名前いろいろ。出世魚と名前が変わる魚たち」"
        url: "https://umito.umios.com/article56/"
      - title: "Umios umito.「赤身魚と白身魚の違いは生態にあり！？」"
        url: "https://umito.umios.com/article161/"

  - id: madai
    ja: 真鯛
    ruby: "{真鯛|まだい}"
    kana: まだい
    romaji: madai
    mean:
      ja: "タイ科の代表種"
      zh: "真鲷"
      en: "Red sea bream"
    part:
      ja: "タイ科マダイ属の海水魚。身は白く、よく締まる"
      zh: "鲷科真鲷属的海水鱼；白肉，肉质紧实"
      en: "A sea bream (Pagrus major) with firm white flesh"
    note:
      ja: "春の産卵期に浅場へ寄り体が桜色を帯びたものを「桜鯛」、秋に栄養を蓄えて深い紅色になったものを「紅葉鯛」と呼ぶ。赤い色は餌の甲殻類に含まれるアスタキサンチンによるもので、寿命は20〜40年、全長1mに育つまで20年以上かかる。「タイ」の名は一説に「平たい」に由来し、タイと名の付く魚は300種以上あるが、分類上のタイ科は13種前後にすぎない。2024年の天然の漁獲1万5454トンに対し養殖は6万8439トンで、その57%を愛媛県が占める。"
      zh: "春季产卵期游到浅海、体色泛樱花粉的叫“桜鯛”，秋季积蓄营养、颜色变得深红的叫“紅葉鯛”。红色来自饵料甲壳类所含的虾青素；寿命20—40年，长到全长1米要20年以上。“タイ”一名一说源于“平たい”（扁平）；名字带“タイ”的鱼有300多种，但分类上的鲷科只有13种左右。2024年野生渔获15,454吨，养殖则有68,439吨，其中57%产自爱媛县。"
      en: "Fish that move into the shallows to spawn in spring, flushed cherry-pink, are sakura-dai; in autumn, fattened and deep red, they are momiji-dai. The red comes from astaxanthin in the crustaceans they eat; they live 20–40 years and take more than 20 years to reach 1 m. One theory derives tai from hiratai, “flat”; over 300 fish carry “tai” in their names, but the true sea-bream family has only about 13 species. In 2024 the wild catch was 15,454 t against 68,439 t farmed, 57% of it in Ehime."
    sources:
      - title: "コトバンク「マダイ」（日本大百科全書）"
        url: "https://kotobank.jp/word/%E3%81%BE%E3%81%A0%E3%81%84-3171257"
      - title: "Umios umito.「なぜ「おかしら付き」といえばタイなのか──海と祝いの文化をひもとく」"
        url: "https://umito.umios.com/article181/"
      - title: "Umios umito.「「タイ」と名のつく魚は多けれど、本物のタイは一部だけ？」"
        url: "https://umito.umios.com/article36/"
      - title: "農林水産省「消費者の部屋」タイの天然と養殖の漁獲量はどのくらいですか。"
        url: "https://www.maff.go.jp/j/heya/sodan/1110/02.html"

  - id: hirame
    ja: ヒラメ
    kana: ひらめ
    romaji: hirame
    mean:
      ja: "カレイ目ヒラメ科の白身魚"
      zh: "牙鲆（比目鱼）"
      en: "Olive flounder"
    part:
      ja: "ヒラメ科の海水魚。腹を手前に置くと頭が左を向き、両目が体の左側にある"
      zh: "牙鲆科海水鱼；腹部朝向自己放置时头朝左，两眼都在身体左侧"
      en: "A lefteye flounder (Paralichthys olivaceus): laid belly towards you, its head points left, with both eyes on the left side"
    note:
      ja: "「左ヒラメに右カレイ」の通り目が左側にあるが、孵化後しばらくは普通の魚と同じく両側にあり、体長2cm足らずまでに右目が左へ移る。4〜6月の産卵後の夏は味が落ち、秋から冬が「寒ビラメ」の旬だが、天然物の脂質は100gあたり2.0g程度で、脂よりも身の厚みとうま味が持ち味。すし種の白身として東京ではタイ以上に珍重され、背びれ・しりびれの付け根の「縁側（えんがわ）」が特に好まれる。身は背側・腹側から2枚ずつ取る「五枚おろし」にする。"
      zh: "正如“左ヒラメに右カレイ”（左牙鲆、右鲽）所说，牙鲆的眼睛在左侧；但孵化后一段时间两眼还像普通鱼一样长在两侧，体长不到2厘米时右眼才移到左边。4—6月产卵后的夏季味道变差，秋冬是“寒ビラメ”的旬期；不过野生牙鲆每100克脂质只有约2.0克，靠的是肉厚和鲜味而非油脂。在东京，它作为白肉寿司料比鲷鱼更受珍视，背鳍、臀鳍根部的“縁側”（裙边）尤其受欢迎。处理时从背侧和腹侧各取两片，称“五枚おろし”。"
      en: "As the saying “hirame on the left, karei on the right” goes, its eyes are on the left, yet for a while after hatching they sit on both sides like any fish’s, the right eye migrating left before it is 2 cm long. It spawns in April–June and is poor in summer; autumn to winter is kan-birame season, though wild fish hold only about 2.0 g of fat per 100 g, so its appeal is thick, savoury flesh rather than fat. Tokyo sushi has long ranked it above sea bream as a white-fish topping, the fin-base engawa being especially prized. It is filleted into five pieces (gomai-oroshi), two each from the back and belly sides."
    sources:
      - title: "コトバンク「ヒラメ」（日本大百科全書・改訂新版 世界大百科事典）"
        url: "https://kotobank.jp/word/%E3%81%B2%E3%82%89%E3%82%81-1582929"
      - title: "Umios umito.「一見そっくり！ヒラメとカレイの違いを探る」"
        url: "https://umito.umios.com/article43/"
      - title: "Umios umito.「「寒」がつくとうまい魚、ヒラメ」"
        url: "https://umito.umios.com/article71/"

  - id: aji
    ja: アジ
    kana: あじ
    romaji: aji
    mean:
      ja: "マアジ"
      zh: "竹荚鱼（日本竹荚鱼）"
      en: "Japanese horse mackerel"
    part:
      ja: "アジ科マアジ属のマアジ（ふつう「アジ」といえばこれを指す）。すし種では光り物"
      zh: "鲹科竹荚鱼属的日本竹荚鱼（一般说“アジ”就是指它）；在寿司里属于“光り物”"
      en: "The Japanese jack mackerel (Trachurus japonicus), the fish meant by plain “aji”; a hikarimono at sushi"
    note:
      ja: "側線に沿って「ぜいご（ぜんご）」と呼ばれる硬いとげ状の鱗（稜鱗）が並ぶのが特徴で、日本のマアジ属は本種のみ。沿岸の瀬に居着いて体高が高く脂の多い黄色っぽい「キアジ」と、沖を回遊して体高が低く脂の少ない黒っぽい「クロアジ」の型がある。名は新井白石『東雅』が「アジとは味なり」とするように味の良さからとされ、旬は夏で、すし種には小ぶりのものの皮をむいて使う。大分県佐賀関の漁師が一本釣りしたマアジだけが「関あじ」を名乗れる。"
      zh: "侧线上排列着一列称为“ぜいご（ぜんご）”的硬刺状鳞片（棱鳞），这是它的特征；日本的竹荚鱼属只有这一种。它有两种类型：定居在沿岸礁区、体高较高、脂肪多、偏黄的“キアジ”，以及在外海洄游、体高较低、脂肪少、偏黑的“クロアジ”。新井白石《东雅》说“アジとは味なり”，名字被认为来自味道之美；旬期在夏季，做寿司料时用较小的鱼去皮。只有大分县佐贺关渔民一本钓捕获的竹荚鱼才能叫“関あじ”（关竹荚鱼）。"
      en: "Its mark is a row of hard, spiny scutes along the lateral line, called zeigo or zengo; it is the only Trachurus species in Japan. There are two types: kiaji, yellowish, deep-bodied and fatty, which stay on coastal reefs, and kuroaji, darker, slimmer and leaner, which roam offshore. Arai Hakuseki’s Tōga explains the name as aji, “taste”, for its fine flavour; it is best in summer, and small fish are skinned for sushi. Only aji caught on single hook-and-line by fishers of Saganoseki in Ōita may be sold as Seki-aji."
    sources:
      - title: "コトバンク「マアジ」（日本大百科全書）"
        url: "https://kotobank.jp/word/%E3%81%BE%E3%81%82%E3%81%98-3170880"
      - title: "コトバンク「アジ」（日本大百科全書・改訂新版 世界大百科事典）"
        url: "https://kotobank.jp/word/%E3%81%82%E3%81%98-1261863"
      - title: "農林水産省 aff 2019年7月号「大好きな釣りを仕事にするために（大分）」"
        url: "https://www.maff.go.jp/j/pr/aff/1907/spe1_08.html"
      - title: "コトバンク「光り物」（デジタル大辞泉）"
