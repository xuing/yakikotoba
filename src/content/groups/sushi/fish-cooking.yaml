        url: https://www.tfd.metro.tokyo.lg.jp/content/000003061.pdf
  - id: zuke
    ja: 漬け
    ruby: "{漬|づ}け"
    kana: づけ
    romaji: zuke
    mean:
      ja: 醤油漬けのすし種
      zh: 酱油腌渍的寿司料
      en: Soy-marinated topping
    part:
      ja: 醤油、または醤油・酒・みりんのたれに漬け込んだマグロの赤身などのネタ
      zh: 用酱油或酱油、酒、味醂调成的汁腌过的金枪鱼赤身等寿司料
      en: Lean tuna or other fish steeped in soy sauce or a soy–sake–mirin marinade
    note:
      ja: すし屋の隠語で、もとはマグロの赤身のすしを「づけ」と呼んだ。天保7〜8年（1836〜37）ごろの大漁を機にマグロが握りの代表的なネタになり、明治初年に三陸から取り寄せる際、冷凍設備がないため醤油漬けにして送ったのが名の由来とされる。現在は醤油・酒・みりんのたれにマグロやカツオなどを漬けたものをいい、八丈島の郷土料理「島ずし」も、醤油ベースのたれに漬けた魚をワサビの代わりにからしを添えて握る。
      zh: 这是寿司店的行话，原指金枪鱼赤身寿司。天保7—8年（1836—37年）前后金枪鱼大丰收，金枪鱼从此成为握寿司的代表性食材；明治初年从三陆地区运金枪鱼时，因为没有冷冻设备，便用酱油腌着运来，“づけ”之名据说由此而来。如今指把金枪鱼、鲣鱼等浸在酱油、酒、味醂调的汁里腌制的寿司料；八丈岛的乡土料理“岛寿司”也是用酱油汁腌鱼再捏成寿司，并以黄芥末代替山葵。
      en: Zuke began as sushi-bar slang for lean-tuna nigiri. Tuna only became a leading nigiri topping after a huge catch around 1836–37, and in the early Meiji era, with no freezing facilities, tuna brought in from the Sanriku coast was shipped steeped in soy sauce, which is said to be the origin of the name. Today it means tuna, bonito or similar steeped in a soy, sake and mirin marinade; Hachijō Island’s shimazushi likewise uses soy-marinated fish, with hot mustard in place of wasabi.
    sources:
      - title: コトバンク「漬け」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E6%BC%AC%E3%81%91-571486
      - title: コトバンク「すし」（日本大百科全書(ニッポニカ)）
        url: https://kotobank.jp/word/%E3%81%99%E3%81%97-541612
      - title: nippon.com「おすし屋さんの業界用語：これであなたも「通」の仲間入り！」（2023年）
        url: https://www.nippon.com/ja/japan-data/h01735/
      - title: 農林水産省「うちの郷土料理」島ずし（東京都）
        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_19_tokyo.html
  - id: shime
    ja: 〆
    ruby: "{〆|しめ}"
    kana: しめ
    romaji: shime
    mean:
      ja: 塩や酢で締めたもの
      zh: 用盐、醋腌紧
      en: Salt- or vinegar-cured
    part:
      ja: 塩を振って身を締め、さらに酢や昆布で締めた魚。「〆」は「締め」の別表記
      zh: 先撒盐让鱼肉紧实，再用醋或昆布腌制的鱼；“〆”是“締め”的另一种写法
      en: Fish firmed with salt and then cured in vinegar or between sheets of kelp; 〆 is another way of writing 締め (shime)
    note:
      ja: 酢締めは、魚に塩を振ってしばらく置き、軽く水で流してから酢に漬けて身を締める技法で、しめさばはサバを三枚におろして塩をし、酢に浸してさらに締めたもの。江戸前の光り物の代表コハダも塩でしめて酢漬けにし、富山の「昆布〆」は江戸時代に北前船が運んだ北海道の昆布で富山湾の魚を挟んだのが始まりとされる。品書きの「〆」は意味が一つではなく、はま寿司のメニューには「塩〆黒そい」（塩で締めた）、「活〆まだい」（鮮度を保つため血抜きした活け締め）、「〆シャリ」（締めのご飯）が並ぶ。
      zh: “醋腌”（酢締め）是先给鱼撒盐放一会儿，稍加冲洗后再泡醋，让鱼肉紧实的方法；醋鲭鱼（しめさば）就是把鲭鱼片成三片、撒盐后再泡醋腌成的。江户前寿司“光物”的代表斑鰶（コハダ）也是先盐腌再醋腌；富山的“昆布〆”据说起源于江户时代用北前船运来的北海道昆布夹住富山湾的鱼。菜单上的“〆”不止一个意思：はま寿司的菜单上同时有“塩〆黒そい”（盐腌许氏平鲉）、“活〆まだい”（为保鲜而活杀放血的真鲷）和“〆シャリ”（收尾的米饭）。
      en: "Sujime (vinegar curing) means salting fish, leaving it a while, rinsing it lightly and then steeping it in vinegar to firm the flesh; shime-saba is mackerel filleted, salted and then soaked in vinegar. Kohada (gizzard shad), the emblem of Edo-style “shiny” fish, is likewise salted and vinegared, and Toyama’s kobujime is said to have begun in the Edo period by pressing Toyama Bay fish between Hokkaido kelp brought by Kitamae trading ships. 〆 on a menu has more than one meaning: Hama-zushi lists 塩〆黒そい (salt-cured rockfish), 活〆まだい (sea bream killed and bled alive, ikejime, to keep it fresh) and 〆シャリ (rice to round off the meal) side by side."
    sources:
      - title: コトバンク「酢締め」（講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E9%85%A2%E7%B7%A0%E3%82%81-302448
