  - id: tataki
    ja: たたき
    kana: たたき
    romaji: tataki
    mean:
      ja: あぶった魚／たたいた魚
      zh: 炙鱼片／剁碎的鱼
      en: Seared or chopped fish
    part:
      ja: ①皮付きの身の表面を強火であぶり、厚めに切ったもの（カツオなど）②生の魚を包丁でたたいて細かくしたもの（アジなど）
      zh: ①带皮鱼块用大火炙烤表面后切厚片（鲣鱼等）②用刀把生鱼剁碎（竹荚鱼等）
      en: (1) Skin-on fish seared over high flame and cut thick (e.g. bonito); (2) raw fish chopped fine with a knife (e.g. horse mackerel)
    note:
      ja: 土佐のカツオのたたきは、三枚におろした身を藁などの炎で、皮は少し焦げるまで、身は白くなる程度にあぶり、厚めに切って塩やタレをかけ、包丁などで叩いてなじませることからの名とされる。高知では柚子酢と醤油のタレにニンニクの薄切りを必ず添え、脂ののった秋の下りカツオがたたきに最適とされる。アジやイワシのたたきは包丁の刃でたたいて細かくし、ネギやショウガを加えたもの。江戸時代の文献にいう「カツオのたたき」は、カツオの身や小骨をたたいて漬けた塩辛のことだった。
      zh: 土佐（高知）的鲣鱼たたき，是把片好的鲣鱼用稻草等的火焰炙烤，鱼皮略焦、鱼肉表面变白即可，切厚片后撒盐或浇汁，再用刀等拍打使其入味，名字据说由此而来。高知的吃法是浇柚子醋和酱油调的汁，一定配大蒜片，以秋季南下、脂肪丰满的“下りカツオ”最适合。竹荚鱼、沙丁鱼的たたき，则是用刀刃把鱼肉剁碎，再加葱、姜等。江户时代文献中所说的“鲣鱼たたき”，其实是把鲣鱼肉和小骨剁碎腌成的盐辛（咸鱼酱）。
      en: "Tosa-style katsuo no tataki is bonito fillet seared over burning straw until the skin chars slightly and the flesh just whitens, then cut thick, salted or dressed and patted with the knife so the seasoning sinks in; the patting (tataku) is said to give the name. In Kōchi it is dressed with yuzu vinegar and soy sauce and always topped with sliced garlic, and fatty autumn bonito on its way south is considered best. Aji or iwashi tataki is raw fish chopped fine with the knife edge, with negi or ginger. In Edo-period texts “katsuo no tataki” meant something else: shiokara, a salt-fermented paste of chopped bonito meat and small bones."
    sources:
      - title: コトバンク「たたき」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典）
        url: https://kotobank.jp/word/%E3%81%9F%E3%81%9F%E3%81%8D-849999
      - title: コトバンク「叩き」（デジタル大辞泉・講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E5%8F%A9%E3%81%8D-560687
      - title: 農林水産省「うちの郷土料理」かつおのたたき（高知県）
        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/katuonotataki_kochi.html
  - id: shioyaki
    ja: 塩焼き
    ruby: "{塩焼|しおや}き"
    kana: しおやき
    romaji: shioyaki
    mean:
      ja: 塩を振って焼いた魚
      zh: 盐烤
      en: Salt-grilled
    part:
      ja: 魚に塩を振って焼いたもの。姿焼きにも切り身にもいう
      zh: 鱼撒盐后烤制，整条或切块都可以
      en: Fish sprinkled with salt and grilled, whole or as a fillet
    note:
      ja: 和食の焼き物の基本で、振り塩をすると塩が浸透して身がしまり、焼くと溶けたタンパク質が再び固まってうま味が逃げない。白身魚や小魚は焼く直前に、青背の魚や脂の多い魚は焼く30分〜1時間前に塩をする。姿焼きでは尾やひれに塩をたっぷりすり込む「化粧塩」で焦げを防ぎ、尾がぴんと跳ね上がるように「踊り串（うねり串）」を打つ。
      zh: 盐烤是日本料理烤物的基础：撒盐后盐分渗入、鱼肉收紧，加热时溶出的蛋白质重新凝固，鲜味不会流失。白身鱼和小鱼在烤之前才撒盐，青背鱼和多脂的鱼则提前30分钟到1小时撒盐。整条烤时在鱼尾、鱼鳍上厚厚抹盐（“化妆盐”）以免烤焦，并穿“跃串”（踊り串），让鱼尾高高翘起。
      en: "Salt-grilling is the foundation of Japanese grilled dishes: salt penetrates and firms the flesh, and as it cooks the dissolved proteins set again so the flavour stays in. White-fleshed and small fish are salted just before grilling, blue-backed or oily fish 30 minutes to an hour ahead. For a whole fish, keshō-jio (“make-up salt”) is rubbed thickly onto the tail and fins to stop them burning, and an odori-gushi (“dancing skewer”) is woven through the body so the tail flicks up."
    sources:
      - title: コトバンク「塩焼き」（日本大百科全書(ニッポニカ)）
        url: https://kotobank.jp/word/%E5%A1%A9%E7%84%BC%E3%81%8D-1495052
      - title: コトバンク「化粧塩」（日本大百科全書(ニッポニカ)ほか）
        url: https://kotobank.jp/word/%E5%8C%96%E7%B2%A7%E5%A1%A9-490026
  - id: nitsuke
    ja: 煮付け
    ruby: "{煮付|につ}け"
    kana: につけ
    romaji: nitsuke
    mean:
      ja: 甘辛く煮た魚
      zh: 酱烧鱼
      en: Simmered in sweet soy
    part:
      ja: 醤油・砂糖・みりん・酒の煮汁で、汁を少なめにして甘辛く煮た魚（野菜にもいう）
      zh: 用酱油、砂糖、味醂、酒调的少量汤汁，把鱼煮得甜咸入味（也用于蔬菜）
      en: Fish (or vegetables) simmered in a little soy sauce, sugar, mirin and sake until sweet-savoury
    note:
      ja: 煮物のうち煮汁を少なくして煮る類に入り、魚を味付けして煮たもの全般は「煮魚」と呼ぶ（みそを加えるみそ煮、大根おろしを加えるおろし煮もある）。カレイ・メバル・キンメダイ・カサゴといった白身魚がよく煮付けにされ、メバルは煮付けにすると身がころりと外れるという。鍋より一回り小さく材料に直接のせる落とし蓋は、煮汁の回りをよくし煮崩れを防ぐ。魚の煮汁が冷えて固まったものは「煮凝り（にこごり）」と呼ばれる。
      zh: 属于煮物中汤汁较少的一类；凡调味后煮的鱼统称“煮鱼”（煮魚），此外还有加味噌的味噌煮、加萝卜泥的“おろし煮”。常做煮付的是鲽鱼、无备平鲉（メバル）、金眼鲷、褐菖鲉（カサゴ）等白身鱼，据说メバル煮好后鱼肉会整块脱落。比锅口小一圈、直接压在食材上的“落盖”（落とし蓋）能让汤汁均匀循环、防止鱼肉煮散。鱼的汤汁冷却后凝成的冻叫“煮凝り”。
      en: It belongs to the kind of nimono cooked in only a little liquid; seasoned simmered fish in general is nizakana, which also includes miso-ni (with miso) and oroshi-ni (with grated daikon). White fish such as flounder, mebaru (Japanese rockfish), kinmedai (splendid alfonsino) and kasago (scorpionfish) are the usual choices, and simmered mebaru flesh is said to come away cleanly. A drop lid (otoshibuta) laid directly on the fish keeps the liquid circulating and stops the flesh breaking up, and fish broth that sets into jelly as it cools is called nikogori.
    sources:
      - title: コトバンク「煮付け」（デジタル大辞泉・講談社 世界の料理がわかる辞典）
