  - id: teriyaki
    ja: 照り焼き
    ruby: "{照|て}り{焼|や}き"
    kana: てりやき
    romaji: teriyaki
    mean:
      ja: たれを塗ってつやよく焼いたもの
      zh: 照烧
      en: Teriyaki (glaze-grilled)
    part:
      ja: 醤油・みりん・酒などのたれを塗りながら、または漬けてから、つやよく焼いたもの
      zh: 边刷（或先腌）酱油、味醂、酒等调成的酱汁边烤，烤出光泽
      en: Grilled while basted with, or after marinating in, a soy–mirin–sake sauce until glossy
    note:
      ja: たれを何度もつけながら焼くと照り（つや）が出ることからの名で、日本大百科全書はたれの割合をみりん1.5・酒1・醤油1とし、材料にサワラ・ブリ・生サケ・マナガツオ・イワシなどを挙げる。ウナギの蒲焼きも照り焼きの一種だが、焦げ目をつけ、焼くときの煙が材料に戻るのが特色という。醤油・酒・みりんにユズの輪切りを浸したたれで焼くのは「幽庵焼き」で、考案した茶人北村幽庵の名からという。英語の teriyaki は、Merriam-Webster によれば1901年から用例がある。
      zh: 因反复刷酱汁烤出光泽（照り）而得名；《日本大百科全书》给出的酱汁比例为味醂1.5、酒1、酱油1，适用的鱼有鲅鱼、鰤鱼、新鲜鲑鱼、鲳鱼、沙丁鱼等。鳗鱼的蒲烧也是照烧的一种，特点是烤出焦痕，并让烤时的烟回熏到食材上。用浸了柚子片的酱油、酒、味醂汁烤的叫“幽庵烧”，据说得名于创制者茶人北村幽庵。英语中的 teriyaki 据韦氏词典最早见于1901年。
      en: "The name comes from the shine (teri) built up by brushing on sauce again and again; the Nipponica encyclopedia gives mirin 1.5 : sake 1 : soy 1 and names Spanish mackerel, yellowtail, fresh salmon, silver pomfret and sardine as typical fish. Eel kabayaki is a kind of teriyaki, set apart by its charred spots and by letting the grilling smoke flavour the eel. Fish grilled in soy, sake and mirin steeped with yuzu slices is yūan-yaki, said to be named after its inventor, the tea master Kitamura Yūan. Merriam-Webster dates “teriyaki” in English to 1901."
    sources:
      - title: コトバンク「照焼き」（日本大百科全書(ニッポニカ)）
        url: https://kotobank.jp/word/%E7%85%A7%E7%84%BC%E3%81%8D-1565945
      - title: コトバンク「照焼」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E7%85%A7%E7%84%BC-577166
      - title: コトバンク「幽庵焼」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E5%B9%BD%E5%BA%B5%E7%84%BC-2131656
      - title: Merriam-Webster “teriyaki”
        url: https://www.merriam-webster.com/dictionary/teriyaki
  - id: tenpura
    ja: 天ぷら
    ruby: "{天|てん}ぷら"
    kana: てんぷら
    romaji: tenpura
    mean:
      ja: 衣揚げ
      zh: 天妇罗
      en: Tempura
    part:
      ja: 魚介や野菜に、小麦粉を卵と水で溶いた衣をつけて植物油で揚げたもの
      zh: 鱼贝、蔬菜裹上用鸡蛋和水调开的面衣，用植物油炸
      en: Seafood or vegetables coated in a batter of flour, egg and water and deep-fried in vegetable oil
    note:
      ja: 江戸時代は上方と江戸で中身が違い、上方では魚のすり身を揚げたもの（今の薩摩揚げ）、江戸では衣揚げを「てんぷら」と呼んだ。今も西日本には薩摩揚げを「てんぷら」と呼ぶ所がある。江戸では屋台の立ち食いとして広まり、エビ・キス・イカ・アナゴなど江戸前の魚介をごま油で揚げ、揚げたてを次々に食べるのが特色とされる。語源はポルトガル語 tempero（調理）や têmporas（四季の斎日）などとする説があるが、決め手となる当時の文献は見つかっていない。
      zh: 江户时代上方（京都、大阪）与江户的“天ぷら”并不是一回事：上方指油炸的鱼浆（即今天的萨摩扬），江户则指挂面衣炸的东西。如今西日本仍有地方把萨摩扬叫“天ぷら”。在江户，天妇罗作为路边摊上站着吃的小吃流行开来，特色是用芝麻油炸虾、沙鮻、乌贼、星鳗等江户前海鲜，炸好一样吃一样。词源有葡萄牙语 tempero（烹调）、têmporas（四季斋日）等说法，但至今没有找到能证实的当时文献。
      en: "In the Edo period the word meant different things: in Kamigata (Kyoto–Osaka) it was fried fish paste, today’s satsuma-age, while in Edo it was batter-fried food; parts of western Japan still call satsuma-age “tenpura”. In Edo it spread as stand-up street-stall food, its hallmark being Edo Bay seafood such as prawns, kisu (sillago), squid and anago fried in sesame oil and eaten piece by piece straight from the pot. Portuguese tempero (“seasoning”) or têmporas (Ember Days) and other words have been proposed as its origin, but no decisive contemporary document has been found."
    sources:
      - title: コトバンク「天麩羅」（デジタル大辞泉・改訂新版 世界大百科事典ほか）
        url: https://kotobank.jp/word/%E5%A4%A9%E9%BA%A9%E7%BE%85-578873
      - title: 農林水産省「うちの郷土料理」てんぷら（東京都）
        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_6_tokyo.html
  - id: karaage
    ja: 唐揚げ
    ruby: "{唐揚|からあ}げ"
    kana: からあげ
    romaji: karaage
    mean:
      ja: 粉をまぶして揚げたもの
      zh: 日式炸（唐扬）
      en: Karaage (dusted and fried)
    part:
      ja: 小麦粉やかたくり粉を薄くまぶして、または何もつけずに油で揚げたもの
      zh: 薄薄拍上面粉或淀粉（或什么都不裹）直接油炸
      en: Food dusted lightly with flour or potato starch, or left bare, and deep-fried
    note:
      ja: 「唐（中国）風の揚げ物」の意とする説と、衣をつけない「空揚げ」の意とする説があり、どちらの表記も使われる。魚では、アジ・キス・ハゼ・アユ・フナなどの小魚に小麦粉とかたくり粉を厚めにまぶし、高温でさっと揚げてから二度揚げすると、頭から尾まで骨ごと食べられる。アジ・キス・アナゴなどの中骨を素揚げにしたものは「骨せんべい」という。
      zh: 名称一说意为“唐（中国）式的炸物”，一说是不挂面衣的“空扬”，两种写法都有人用。鱼类的唐扬，是给竹荚鱼、沙鮻、虾虎鱼、香鱼、鲫鱼等小鱼厚厚拍上面粉和淀粉，高温快炸后再复炸一次，这样从头到尾连骨头都能吃。把竹荚鱼、沙鮻、星鳗等的中骨直接下锅炸，叫“骨煎饼”（骨せんべい）。
      en: One view reads the name as “Tang (Chinese)-style frying”, another as kara-age, “empty frying” without batter; both spellings, 唐揚げ and 空揚げ, are used, and Merriam-Webster follows the “empty” etymology. Small fish such as aji, kisu, goby, ayu or crucian carp are coated fairly thickly with flour and potato starch, fried briefly at high heat and then fried a second time so they can be eaten bones and all, head to tail. Backbones of aji, kisu or anago fried bare are called hone senbei, “bone crackers”.
    sources:
      - title: コトバンク「から揚げ」（日本大百科全書(ニッポニカ)）
        url: https://kotobank.jp/word/%E3%81%8B%E3%82%89%E6%8F%9A%E3%81%92-1519218
      - title: コトバンク「空揚げ」（世界大百科事典（旧版））
        url: https://kotobank.jp/word/%E7%A9%BA%E6%8F%9A%E3%81%92-1293090
      - title: Merriam-Webster “karaage”
        url: https://www.merriam-webster.com/dictionary/karaage
  - id: himono
    ja: 干物
    ruby: "{干物|ひもの}"
    kana: ひもの
    romaji: himono
    mean:
      ja: 干した魚
      zh: 鱼干
      en: Dried fish
    part:
      ja: 魚介類を生のまま、または塩をして干したもの。開き・丸干し・一夜干しなど
      zh: 把鱼贝生的或抹盐后晒干的食品，有剖开晒（開き）、整条晒（丸干し）、一夜干等
      en: "Fish or shellfish dried raw or after salting: split (hiraki), whole (maruboshi), overnight-dried (ichiyaboshi) and more"
    note:
      ja: 製法により、塩をせずに干す素干し（するめ・身欠きにしん）、塩をして干す塩干し（アジ・サバ・サンマの開き、イワシの丸干し・目刺し）、煮てから干す煮干し、焼いてから干す焼干し、みりん干しなどの調味干しに分けられ、ふつう「干物」といえば塩干しを指す。開きは魚を背開きまたは腹開きにして干したもの、一夜干しは軽く塩をした魚を一晩外気に当てて干したもの。かつては日持ちさせるために強く干したが、今は水分60〜70％ほどの生干しが好まれ、干すことはうま味を引き出す手段になっている。
      zh: 按制法可分为不加盐直接晒的素干（鱿鱼干、鲱鱼干）、抹盐后晒的盐干（竹荚鱼、鲭鱼、秋刀鱼的开片干，沙丁鱼整条干、“目刺”）、煮后晒的煮干、烤后晒的烤干，以及味醂干等调味干；一般说“干物”多指盐干。“開き”是把鱼从背部或腹部剖开晒干，“一夜干し”是轻轻撒盐后吹一夜风晾干。过去为了耐放晒得很干，如今更受欢迎的是含水约60%—70%的半干品，晒干更多成了增添鲜味的手段。
      en: "By method there are suboshi (dried unsalted, e.g. surume squid, migaki herring), shiboshi (salted then dried: split aji, saba or sanma, whole iwashi and mezashi), niboshi (boiled then dried), yakiboshi (grilled then dried) and seasoned types such as mirin-boshi; “himono” usually means the salted kind. Hiraki is fish split open from the back or the belly and dried; ichiyaboshi is lightly salted fish left out in the air overnight. Fish were once dried hard to keep, but today semi-dried fish of about 60–70% moisture is preferred, and drying is used more to develop flavour than to preserve."
    sources:
      - title: コトバンク「干物」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典ほか）
        url: https://kotobank.jp/word/%E5%B9%B2%E7%89%A9-120933
      - title: コトバンク「開き」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E9%96%8B%E3%81%8D-613780
      - title: コトバンク「一夜干し」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E4%B8%80%E5%A4%9C%E5%B9%B2%E3%81%97-433791
