order: 5
ja: 料理法
zh: 鱼的做法
en: Ways with fish
items:
  - id: sashimi
    ja: 刺身
    ruby: "{刺身|さしみ}"
    kana: さしみ
    romaji: sashimi
    mean:
      ja: 生の魚の切り身
      zh: 刺身（生鱼片）
      en: Sliced raw fish
    part:
      ja: 新鮮な魚介を生のまま薄く、または小さく切ったもの。すし飯は付かない
      zh: 把新鲜鱼贝生着切成薄片或小块，不配饭
      en: Fresh raw fish or shellfish cut into slices or pieces, served without rice
    note:
      ja: 古くは「指身」「差味」とも書き、文献に見える古い例は『鈴鹿家記』応永6年（1399）の「指身 鯉，イリ酒，ワサビ」。名の由来は、何の魚か分かるようにひれを刺しておいたからとも、「切る」を忌んで「刺す」と言い換えたからともいわれ、定説はない。切り方には平造り・糸造り・角造り、フグやヒラメなどに使う薄造りなどがあり、刺身を作ることは「切る」ではなく「引く」という。大根などの「けん」、大葉などの「つま」、わさびなどの薬味を添え、「お造り」「作り身」とも呼ぶ。
      zh: 古时也写作“指身”“差味”，文献中较早的例子是《铃鹿家记》应永6年（1399）条的“指身 鲤、煎酒、山葵”。名称由来有两说：一说为了分辨是什么鱼，把鱼鳍插在切片上；一说忌讳“切”字而改称“刺”，并无定论。切法有平造、丝造、角造，以及河豚、比目鱼等用的薄造等，做刺身不说“切”而说“引”。通常配萝卜丝等“けん”、紫苏叶等“つま”以及山葵等佐料，也叫“お造り”“作り身”。
      en: "Older spellings include 指身 and 差味; an early record is the Suzuka-ke ki entry for 1399: “sashimi of carp, with irizake and wasabi”. The name is said to come either from sticking the fish’s fin on the slices to show the species, or from avoiding the ill-omened word kiru (cut) in favour of sasu (pierce); there is no settled answer. Cuts include hira-zukuri (flat slices), ito-zukuri (threads), kaku-zukuri (cubes) and usu-zukuri (paper-thin, for fugu or flounder), and chefs say they “pull” (hiku) rather than cut sashimi. It comes with ken (shredded daikon etc.), tsuma (shiso leaves etc.) and a pungent condiment such as wasabi, and is also called otsukuri."
    sources:
      - title: コトバンク「刺身」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典ほか）
        url: https://kotobank.jp/word/%E5%88%BA%E8%BA%AB-69016
  - id: aburi
    ja: 炙り
    ruby: "{炙|あぶ}り"
    kana: あぶり
    romaji: aburi
    mean:
      ja: 表面を火であぶったもの
      zh: 炙烤
      en: Flame-seared
    part:
      ja: ネタや切り身の表面だけを直火やガスバーナーで焼いたもの
      zh: 只用明火或喷枪把鱼肉、寿司料的表面烤一下
      en: Fish or a sushi topping seared on the surface only, over a flame or with a gas torch
    note:
      ja: 「あぶる」は火で焼くこと、特に食べ物をほどよく焦がすことをいう。和食には、魚の皮目を直火であぶってすぐ冷水で冷ます「焼き霜」があり、生臭みと余分な脂を除いて風味を増す技法としてタイ・アイナメ・ハモなどに使われ、カツオのたたきもこの手法による（熱湯をかける方法は「湯霜」「皮霜」）。回転寿司には「炙り豚とろ」「炙りえびマヨ」（はま寿司）、「あぶりチーズサーモン」（くら寿司）のように、魚以外のネタやチーズ・マヨネーズを炙ったすしも並び、表記も「炙り」「あぶり」と店によって異なる。
      zh: “炙る”意为用火烤，尤指把食物烤到微焦。日本料理中有“焼き霜”技法：用明火炙烤鱼皮一面后立刻浸冷水，可去腥、去多余油脂并增香，常用于真鲷、六线鱼、海鳗，鲣鱼“たたき”也属此法（浇开水的做法叫“湯霜”“皮霜”）。回转寿司还有“炙り豚とろ”（炙烤猪颈肉）、“炙りえびマヨ”（炙烤蛋黄酱虾，はま寿司）、“あぶりチーズサーモン”（炙烤芝士三文鱼，くら寿司）等非鱼类或加芝士、蛋黄酱的炙烤寿司，写法也有汉字“炙り”和平假名“あぶり”之分。
      en: "Aburu means to roast over a flame, especially to char food lightly. Classic Japanese cooking has yakishimo: the skin side of a fish is seared over direct flame and plunged into cold water, removing fishy smells and excess fat while adding aroma; it is used for sea bream, greenling and pike conger, and katsuo no tataki is made the same way (pouring boiling water over the skin instead is yushimo or kawashimo). Conveyor-belt chains also sear non-fish toppings and mayo or cheese, as in Hama-zushi’s 炙り豚とろ (pork jowl) and 炙りえびマヨ (shrimp with mayonnaise) or Kura Sushi’s あぶりチーズサーモン, and spell the word either 炙り or あぶり."
    sources:
      - title: コトバンク「炙る」（精選版 日本国語大辞典）
        url: https://kotobank.jp/word/%E7%82%99%E3%82%8B-2003083
      - title: コトバンク「焼き霜」（講談社 世界の料理がわかる辞典）
        url: https://kotobank.jp/word/%E7%84%BC%E3%81%8D%E9%9C%9C-1496386
      - title: コトバンク「霜降り」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典）
        url: https://kotobank.jp/word/%E9%9C%9C%E9%99%8D%E3%82%8A-524266
      - title: コトバンク「刺身」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典ほか）
        url: https://kotobank.jp/word/%E5%88%BA%E8%BA%AB-69016
      - title: はま寿司「メニュー紹介」
        url: https://www.hama-sushi.co.jp/menu/
