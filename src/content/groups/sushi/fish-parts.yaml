  - id: nakaochi
    ja: 中落ち
    ruby: "{中落|なかお}ち"
    kana: なかおち
    romaji: nakaochi
    mean:
      ja: "中骨とそれに付いた身"
      zh: "鱼脊骨及其附着的肉"
      en: "Backbone and the meat left on it"
    part:
      ja: "魚を三枚におろしたときの中骨の部分と、そこに付いている身"
      zh: "把鱼剖成三片（三枚おろし）后剩下的中骨部分，以及附在上面的肉"
      en: "The backbone left after filleting a fish into three pieces (sanmai-oroshi), and the meat still on it"
    note:
      ja: "マグロの中落ちは太い中骨に付いた身で、丼の具材にもなる比較的なじみのある部位であり、骨ごと出してスプーンで身を削りながら食べさせる店もある。かつて築地市場では中落ちなど骨まわりの身はほとんど廃棄物扱いで、関係者が骨からかき取って食べる程度だったが、今は「本マグロ中落ち」などとして品書きに並ぶ。タイの中骨は上品で深いうま味の出汁が出るため、鯛めしや味噌汁、茶碗蒸しの出汁に使われる。"
      zh: "金枪鱼的中落ち是附在粗大脊骨上的肉，常用作盖饭的料，算是比较常见的部位；也有店把整根骨头端上桌，让客人用勺子自己刮着吃。从前在筑地市场，中落ち这类骨边肉几乎被当作废料，只有市场里的人从骨头上刮下来吃；如今却以“本マグロ中落ち”等名目出现在菜单上。真鲷的中骨能熬出清雅浓厚的高汤，用来做鲷鱼饭、味噌汤和茶碗蒸。"
      en: "Tuna nakaochi is the meat on the thick backbone, a fairly familiar cut often piled on rice bowls, and some restaurants bring the bone to the table for diners to scrape with a spoon. At the old Tsukiji market such bone-side meat was treated almost as waste, eaten only by market hands who scraped it off; now it appears on menus as “bluefin nakaochi”. Sea-bream backbone gives a refined, deep stock used for tai-meshi rice, miso soup and chawanmushi."
    sources:
      - title: "コトバンク「中落ち」（デジタル大辞泉）"
        url: "https://kotobank.jp/word/%E4%B8%AD%E8%90%BD%E3%81%A1-587615"
