order: 3
ja: 部位
zh: 鱼的部位
en: Fish parts
items:
  - id: kama
    ja: カマ
    kana: かま
    romaji: kama
    mean:
      ja: "魚のえら下・胸びれまわりの身"
      zh: "鱼下巴（鳃下胸鳍根部的肉）"
      en: "Fish collar"
    part:
      ja: "えらの下の、胸びれが付いている部分"
      zh: "鱼鳃下方、长着胸鳍的部位"
      en: "The section below the gills where the pectoral fin is attached"
    note:
      ja: "名は、形が草刈りの「鎌」に似ていることによる。マダイのカマは脂がのって濃厚で塩焼きや照り焼きに向き、マグロのカマは塩焼きか煮付けにする。マグロの大トロ（腹カミ）はカマに接する腹側の部分で、頭部からはカマのほか「カマトロ」「脳天」「ホホ肉」なども切り出され、かつての端材が今は希少部位として流通している。"
      zh: "名字来自它的形状像割草用的“鎌”（镰刀）。真鲷的カマ脂肪丰富、味道浓郁，适合盐烤或照烧；金枪鱼的カマ则做盐烤或炖煮。金枪鱼的大腹（腹カミ）就是紧挨カマ的腹侧部分；头部除了カマ还能切出“カマトロ”“脳天”（头顶肉）“颊肉”等，这些过去的边角料如今都作为稀少部位流通。"
      en: "The name comes from its likeness to a kama, a sickle. Sea-bream collar is rich and fatty and suits salt-grilling or teriyaki, while tuna collar is salt-grilled or simmered. Tuna ōtoro (hara-kami) is the belly section adjoining the collar, and the head also yields kama-toro, nōten and cheek meat — former trimmings now sold as rare cuts."
    sources:
      - title: "コトバンク「鎌」（精選版 日本国語大辞典）"
        url: "https://kotobank.jp/word/%E9%8E%8C-46504"
