  - id: neta
    ja: ネタ
    kana: ねた
    romaji: neta
    mean:
      ja: すし種
      zh: 寿司料
      en: Sushi topping
    part:
      ja: すし飯にのせる魚介・玉子焼きなどの材料（すしだね）
      zh: 放在醋饭上的鱼贝、玉子烧等材料（すしだね）
      en: The fish, shellfish, omelette and so on placed on the rice (sushi-dane)
    note:
      ja: 「たね（種）」を逆さに読んだ隠語で、1818〜45年ごろの随筆『松屋筆記』に用例がある。本来の形で「タネ」「すしだね」とも言い、すし以外でも新聞記事の材料や手品の仕掛け、芸人の演目を「ねた」と呼ぶ。すし種のうち、コハダ・サバ・アジなど皮が青白く光る魚は「光り物」と呼ばれる。
      zh: 是把“たね”（种，材料）倒过来念的行话，1818—45年前后的随笔《松屋笔记》中已有用例。也可按本来的说法叫“タネ”“すしだね”；寿司以外，新闻报道的素材、魔术的机关、艺人的段子也叫“ねた”。寿司料中，斑鰶、鲭鱼、竹荚鱼等鱼皮泛青白光泽的鱼称为“光り物”。
      en: Inverted slang for tane (種, “seed, material”), attested in the essay collection Matsunoya hikki (c. 1818–45). The plain forms tane and sushi-dane are also used, and outside sushi neta means a news story’s material, a magic trick’s secret or a comedian’s routine. Toppings with bluish, shining skin such as kohada, mackerel and horse mackerel are grouped as hikarimono, “shiny things”.
    sources:
      - title: コトバンク「ねた」（デジタル大辞泉・精選版 日本国語大辞典）
        url: https://kotobank.jp/word/%E3%81%AD%E3%81%9F-595058
