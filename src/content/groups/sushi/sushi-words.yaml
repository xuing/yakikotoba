        url: https://kotobank.jp/word/%E4%B8%8A%E3%81%8C%E3%82%8A%E8%8A%B1-422929
      - title: コトバンク「出花」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E5%87%BA%E8%8A%B1-576640
  - id: sabinuki
    ja: さび抜き
    ruby: さび{抜|ぬ}き
    kana: さびぬき
    romaji: sabinuki
    mean:
      ja: わさび抜き
      zh: 不放山葵
      en: No wasabi
    part:
      ja: 握りずしのシャリとネタの間にわさびを入れないこと。「さび」はわさびの略
      zh: 握寿司的醋饭和料之间不放山葵；“さび”是“わさび”的省略
      en: Nigiri made without the dab of wasabi between rice and topping; sabi is short for wasabi
    note:
      ja: 握りずしにわさびを挟むのは、1820年（文政3）ごろ江戸の華屋与兵衛がコハダやエビの握りで考案して評判になったとされ、全国に広まったのは明治以降。わさびの辛味成分アリルイソチオシアネートは、すりおろして細胞が壊れると酵素の働きで生じ、市販の粉わさびの多くはセイヨウワサビ（ホースラディッシュ）の粉末に葉緑素や着色料を加えたもの。すし屋ではわさびを「なみだ」とも呼び、伊豆諸島の島ずしのように、ワサビが手に入らずからしで代用した地域もある。
      zh: 在握寿司里夹山葵，据说是1820年（文政3年）前后江户的华屋与兵卫在斑鰶、虾的握寿司上首创并大受欢迎，明治以后才普及全国。山葵的辣味成分异硫氰酸烯丙酯，是磨碎时细胞破裂、在酶的作用下生成的；市售的山葵粉大多是辣根（西洋山葵）粉加叶绿素或色素做成的。寿司店也把山葵叫“なみだ”（眼泪）；伊豆诸岛的岛寿司当年弄不到山葵，就用黄芥末代替。
      en: Tucking wasabi into nigiri is credited to Hanaya Yohei of Edo around 1820, for his kohada and prawn pieces, and it only spread nationwide in the Meiji era. Wasabi’s heat, allyl isothiocyanate, forms by enzyme action when grating ruptures the cells; most powdered “wasabi” on sale is horseradish powder with chlorophyll or colouring added. Sushi bars also call wasabi namida (“tears”), and in the Izu Islands, where real wasabi was unobtainable, shimazushi used hot mustard instead.
    sources:
      - title: コトバンク「さび抜き」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E3%81%95%E3%81%B3%E6%8A%9C%E3%81%8D-681483
      - title: コトバンク「ワサビ」（日本大百科全書(ニッポニカ)・改訂新版 世界大百科事典）
