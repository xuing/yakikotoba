  - id: agari
    ja: あがり
    kana: あがり
    romaji: agari
    mean:
      ja: お茶
      zh: 茶
      en: Tea
    part:
      ja: すし屋で出すお茶。「上がり花」の略
      zh: 寿司店对茶的叫法，是“上がり花”的简称
      en: The sushi-bar word for tea, short for agaribana
    note:
      ja: 遊郭や料理屋で入れたての茶を「上がり花」と呼んだのが略されたもので、すし屋ではもともと食事の最後に飲むお茶を指した。暇なことを表す「お茶をひく」（茶葉を臼でひくこと）が芸者や遊女の忌み言葉だったため、「客が上がる」に掛けて「上がり花」「あがり」と呼ぶようになったとされる。入れたての香りのよい茶は一般には「出花」といい、「鬼も十八、番茶も出花」ということわざに残る。
      zh: 源自游廓（花街）和料亭把刚沏好的茶叫“上がり花”，后来简称“あがり”；在寿司店原指饭后最后喝的那杯茶。因为表示“闲着没客人”的“お茶をひく”（用石臼磨茶叶）是艺伎和游女忌讳的说法，便取“客人上门”（客が上がる）的吉利意思，把茶叫作“上がり花”“あがり”。刚沏好、香气正浓的茶一般叫“出花”，见于俗语“鬼も十八、番茶も出花”（丑女十八也动人，粗茶初沏也香醇）。
      en: In pleasure quarters and restaurants freshly made tea was called agaribana, later shortened to agari; at sushi bars it originally meant the tea drunk at the end of the meal. Because ocha o hiku (“grinding tea”, i.e. sitting idle with no clients) was a taboo phrase for geisha and courtesans, the tea was named after the lucky phrase kyaku ga agaru, “a customer comes up”. Freshly brewed, fragrant tea is otherwise called debana, as in the proverb “Oni mo jūhachi, bancha mo debana” (even an ogre is pretty at eighteen, even coarse tea is good fresh-brewed).
    sources:
      - title: nippon.com「おすし屋さんの業界用語：これであなたも「通」の仲間入り！」（2023年）
        url: https://www.nippon.com/ja/japan-data/h01735/
      - title: コトバンク「上がり」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E4%B8%8A%E3%81%8C%E3%82%8A-422907
