        url: https://kotobank.jp/word/%E5%85%89%E3%82%8A%E7%89%A9-608881
  - id: gari
    ja: ガリ
    kana: がり
    romaji: gari
    mean:
      ja: すしに添える甘酢しょうが
      zh: 寿司醋姜片
      en: Pickled ginger for sushi
    part:
      ja: 薄切りにしたショウガ（多くは新ショウガ）を軽くゆで、甘酢に漬けたもの
      zh: 把姜（多用嫩姜）切薄片、稍微焯水后泡在甜醋里
      en: Thin slices of ginger, usually young ginger, blanched and pickled in sweet vinegar
    note:
      ja: 噛むと「ガリガリ」と音がすることからの名とされる。一般には「甘酢しょうが」といい焼き魚などにも添えるが、すしに添えるものを特に「ガリ」と呼ぶ。回転寿司では、ガリ・お茶・醤油・箸がカウンターに置かれ、客が自分で取るのがふつう。
      zh: 据说因嚼起来“嘎吱嘎吱”（ガリガリ）作响而得名。一般叫“甜醋姜”（甘酢しょうが），也用来配烤鱼等，配寿司的则特称“ガリ”。在回转寿司店，醋姜、茶、酱油、筷子一般都放在柜台上，由客人自取。
      en: The name is said to imitate the crunching sound, gari-gari, it makes. The general term is amazu-shōga (sweet-vinegar ginger), also served with grilled fish, but the version served with sushi is called gari. At conveyor-belt sushi bars, gari, tea, soy sauce and chopsticks usually sit on the counter for diners to help themselves.
    sources:
