        url: https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_19_tokyo.html
  - id: omakase
    ja: おまかせ
    kana: おまかせ
    romaji: omakase
    mean:
      ja: 店に一任すること
      zh: 主厨精选（交给师傅）
      en: Chef’s choice
    part:
      ja: 何を出すかを店（職人）に一任する頼み方
      zh: 把吃什么全权交给店家（师傅）决定的点法
      en: Ordering by leaving the selection entirely to the chef
    note:
      ja: 「任せる」に接頭語「お」が付いた語で、特に料理屋で料理の内容を店に一任することをいい、「おまかせコース」のように使う。すし店でおまかせにすると、その日のおすすめのネタで握ったすしが出される。英語にも omakase として入り、Merriam-Webster は名詞の初出を1967年とし、職人の裁量で選んだ一連の少量の料理（すしなど）を定額で出すもの、と定義している。
      zh: 由“任せる”（交给）加前缀“お”构成，特指在餐馆把菜品全权交给店家，常见“おまかせコース”（主厨精选套餐）等说法。在寿司店点“おまかせ”，师傅会用当天推荐的料来捏。这个词也进入了英语，韦氏词典记载其名词用法最早见于1967年，释义为“由厨师决定、按固定价格供应的一系列小份菜品（如寿司）”。
      en: "O- (honorific) + makase, “leaving it to someone”: in restaurants, leaving the content of the meal to the house, as in omakase kōsu (chef’s-choice course). At a sushi bar, omakase brings nigiri made from the day’s recommended toppings. English has borrowed the word: Merriam-Webster dates the noun to 1967 and defines it as a series of small servings or courses (as of sushi) offered at a fixed price and selected at the chef’s discretion."
    sources:
      - title: コトバンク「御任せ」（デジタル大辞泉）
        url: https://kotobank.jp/word/%E5%BE%A1%E4%BB%BB%E3%81%9B-454386
      - title: GO TOKYO（東京観光財団）「東京の寿司ガイド」
        url: https://www.gotokyo.org/jp/story/guide/from-skipjack-to-salmon-a-guide-to-eating-sushi-in-tokyo/index.html
      - title: Merriam-Webster “omakase”
        url: https://www.merriam-webster.com/dictionary/omakase
  - id: kaitenzushi
    ja: 回転寿司
    ruby: "{回転|かいてん}{寿司|ずし}"
    kana: かいてんずし
    romaji: kaiten-zushi
    mean:
      ja: 回るすし
      zh: 回转寿司
      en: Conveyor-belt sushi
    part:
      ja: 小皿に盛ったすしが客の前を回るベルトに乗って流れ、客が好きな皿を取る方式の店
      zh: 小碟寿司放在顾客面前循环的传送带上，任客人自取的寿司店
      en: A sushi restaurant where small plates ride a belt past the counter and diners take what they like
    note:
      ja: 大阪・布施市（現東大阪市）で立ち食いずしを1皿4貫20円で出していた白石義明が、吹田市のビール工場で見たベルトコンベアから着想し、町工場の経営者らと約10年かけて「コンベア旋回式食事台」を開発、1958年4月に近鉄布施駅近くで「廻る元禄寿司」1号店を開いた（特許は1962年取得、1978年失効）。1970年の大阪万博への出店で一躍知られ、1991年には広辞苑（第4版）に「回転寿司」が初めて載った。国内の店舗は4,000店を超え、市場規模は2022年に7,252億円（富士経済調べ）。皿の色や柄で値段を分け、食べ終えた皿の枚数で会計する。
      zh: 在大阪布施市（今东大阪市）以每盘4个20日元卖站着吃的寿司的白石义明，从吹田市一家啤酒厂的传送带得到灵感，与当地小工厂老板们花了约10年开发出“传送带回旋式餐台”，1958年4月在近铁布施站附近开出“廻る元禄寿司”1号店（1962年取得专利，1978年失效）。1970年大阪世博会出店后一举成名，1991年“回转寿司”首次收入《广辞苑》（第4版）。如今日本国内门店超过4000家，2022年市场规模达7252亿日元（富士经济调查）。按盘子的颜色或花纹分价，吃完按盘子数量结账。
      en: Shiraishi Yoshiaki, who sold stand-up sushi at four pieces for ¥20 in Fuse (now Higashi-Ōsaka), took the idea from a conveyor belt at a beer plant in Suita and spent about ten years with local machine shops developing a “conveyor rotating dining counter”; the first Mawaru Genroku Sushi opened near Kintetsu Fuse Station in April 1958 (patented 1962, expired 1978). A stand at the 1970 Osaka Expo made it famous, and the Kōjien dictionary first listed 回転寿司 in its 4th edition (1991). Japan now has more than 4,000 such restaurants, and the market reached ¥725.2 billion in 2022 (Fuji Keizai). Prices are coded by plate colour or pattern, and the bill is counted from the empty plates.
    sources:
      - title: J-Net21（中小企業基盤整備機構）「「外食産業元年」に歴史の1ページを刻んだ回転寿司【元禄産業株式会社】」
        url: https://j-net21.smrj.go.jp/special/expo1970/20231113.html
      - title: コトバンク「回転寿司」（デジタル大辞泉・百科事典マイペディア）
        url: https://kotobank.jp/word/%E5%9B%9E%E8%BB%A2%E5%AF%BF%E5%8F%B8-458090
