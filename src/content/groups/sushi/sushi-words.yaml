order: 6
ja: 用語
zh: 寿司店用语
en: Sushi-bar words
note:
  ja: すし屋には店の者どうしで使う業界用語（符丁）が多く、ここに挙げた語のほか、醤油を「むらさき」、わさびを「なみだ」、会計を「おあいそ」と呼ぶ。「おあいそ」は、精算の際に店側が「愛想がなくて申し訳ありません」と詫びたのが始まりとされる。
  zh: 寿司店里有很多店员之间使用的行话，除本组的词以外，还把酱油叫“むらさき”（紫）、山葵叫“なみだ”（眼泪）、结账叫“おあいそ”。“おあいそ”据说源于结账时店家致歉“招待不周（愛想がなくて），实在抱歉”。
  en: "Sushi bars have plenty of trade jargon used among staff: besides the words here, soy sauce is murasaki (“purple”), wasabi namida (“tears”) and the bill oaiso, said to come from the shop apologising at payment for its lack of aiso (hospitality)."
items:
  - id: shari
    ja: シャリ
    kana: しゃり
    romaji: shari
    mean:
      ja: すし飯
      zh: 寿司饭
      en: Sushi rice
    part:
      ja: 酢・塩・砂糖の合わせ酢で味をつけた、すし用のご飯
      zh: 用醋、盐、糖调成的混合醋调味的寿司米饭
      en: Rice seasoned with a mixture of vinegar, salt and sugar for sushi
    note:
      ja: 仏の遺骨を意味する「舎利」（梵語 śarīra の音写）が、形が似ていることから米粒や飯を指すようになった語で、白米の飯を「銀シャリ」と呼ぶのは戦中・戦後の食糧難の時代からという。すし飯は白飯よりやや硬めに炊き、熱いうちに合わせ酢を混ぜる。1804年に江戸で早ずしに出会ったミツカン創業者の中埜又左衛門が酒粕から造った粕酢（赤酢）は、江戸のすし屋に欠かせない調味料になった。回転寿司の品書きには「シャリハーフ」（くら寿司）、「シャリ大盛り」（はま寿司の丼）といった表示もある。
      zh: 源自意为佛骨的“舍利”（梵语 śarīra 的音译），因形状相似，后来用来指米粒和米饭；把白米饭叫“银舍利”（銀シャリ），据说始于战时和战后的粮荒年代。寿司饭比普通米饭煮得稍硬，趁热拌入混合醋。1804年在江户见识了早寿司的味滋康（ミツカン）创始人中埜又左卫门用酒糟酿出的粕醋（红醋），成了江户寿司店不可缺少的调料。回转寿司的菜单上还能看到“シャリハーフ”（半份饭，くら寿司）、“シャリ大盛り”（大份饭，はま寿司的盖饭）等字样。
      en: From shari 舎利, the Buddha’s relics (Sanskrit śarīra), applied to grains of rice because of their resemblance; calling plain white rice gin-shari (“silver shari”) dates from the food shortages of the war and post-war years. Sushi rice is cooked slightly firmer than ordinary rice and dressed with the vinegar mix while hot. Nakano Matazaemon, founder of Mizkan, encountered Edo’s new fast sushi in 1804 and began making vinegar from sake lees; this red vinegar (akazu) became indispensable to Edo sushi bars. Chain menus also show options such as シャリハーフ (half rice, Kura Sushi) and シャリ大盛り (extra rice, on Hama-zushi’s rice bowls).
    sources:
      - title: コトバンク「舎利」（デジタル大辞泉・精選版 日本国語大辞典）
        url: https://kotobank.jp/word/%E8%88%8E%E5%88%A9-76362
