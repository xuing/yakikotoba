ja: 牛角
ruby: "{牛角|ぎゅうかく}"
kana: ぎゅうかく
romaji: Gyūkaku
cuisine: yakiniku
url: "https://www.gyukaku.ne.jp/"
note:
  ja: 1996年1月に東京・三軒茶屋で開業した焼肉チェーン（運営はレインズインターナショナル）。七輪で焼くスタイルで、単品注文と90分の食べ放題（5コース）がある。
  zh: 1996年1月在东京三轩茶屋开业的烤肉连锁（由Reins International运营）。用七轮小炉自己烤，可单点，也有90分钟吃到饱（5种套餐）。
  en: Yakiniku chain that opened in Sangenjaya, Tokyo, in January 1996 (run by Reins International); you grill on a shichirin and can order à la carte or take one of five 90-minute all-you-can-eat courses.
