    rows: [fish-cooking/zuke, maguro/akami]
    mean:
      ja: まぐろを特製の漬けダレに漬けた「漬け」のにぎり。白ごまをのせる
      zh: 用特制酱汁腌渍金枪鱼做成的「漬け」握寿司，撒白芝麻；官网中文名「特制腌渍金枪鱼」
      en: "Tuna marinated in the house sauce (zuke), with white sesame; English-site name “Special Soy-Marinated Tuna”"
    image: tokusei-zuke-maguro.webp
