ja: はま寿司
ruby: "はま{寿司|ずし}"
kana: はまずし
romaji: Hamazushi
cuisine: sushi
url: "https://www.hama-sushi.co.jp/"
note:
  ja: ゼンショーホールディングス傘下の株式会社はま寿司が運営する回転寿司チェーン。2002年11月に栃木県の足利店を1号店として開業し、国内685店（2026年9月末）。
  zh: 由Zensho控股（ゼンショーホールディングス）旗下的株式会社はま寿司经营的回转寿司连锁，官网中文名「滨寿司」；2002年11月以栃木县的足利店为首家店开业，日本国内685家（2026年9月底）。
  en: "Conveyor-belt sushi chain run by Hama-Sushi Co., a Zensho Holdings subsidiary; its first shop opened in Ashikaga, Tochigi in November 2002; 685 shops in Japan (end of Sept 2026)."
items:
  # まぐろ
  - id: maguro
    ja: まぐろ
    kana: まぐろ
    romaji: maguro
    rows: [maguro/maguro, maguro/akami]
    mean:
      ja: まぐろの赤身のにぎり（太平洋・大西洋・インド洋産）。主に40kg以上の天然まぐろを使い、同社は「自慢のネタ」とする
      zh: 金枪鱼赤身握寿司（太平洋、大西洋、印度洋产）；主要用40公斤以上的野生金枪鱼，公司称之为「引以为傲的寿司料」；官网中文名「金枪鱼」
      en: "Lean tuna (akami) nigiri; mostly wild tuna over 40 kg from the Pacific, Atlantic and Indian Oceans, billed as the chain’s pride; English-site name “Lean Tuna”"
    signature: true
    image: maguro.webp
  - id: tokusei-zuke-maguro
